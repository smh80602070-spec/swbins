<script>
window.DG_NO_DRAW = true; window.DG_NO_ACCOUNT = true; window.DG_NO_TUNE = true; window.DG_NO_SCENARIO = true;

/* 무작위 고정 — 진단이 굴릴 때마다 달라지면 판정이 흔들린다.
   게임 스크립트보다 **먼저** 갈아 둬야 부트에서 쓰는 난수까지 잡힌다.
   (실제 플레이는 그대로다 — 이 파일 안에서만 바꾼다)
   mulberry32: 짧고 분포가 고르며 같은 씨앗이면 같은 수열이 나온다. */
(function (seed) {
  var s = seed >>> 0;
  Math.random = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  window.DG_SEED = seed;
})(20260824);
</script>

<script>
(function () {
  var out = [], errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message); });

  function t(name, fn) {
    try {
      var r = fn();
      out.push((r ? '<span class="pass">PASS</span> ' : '<span class="fail">FAIL</span> ') +
        name + (typeof r === 'string' ? ' — ' + r : ''));
      return !!r;
    } catch (e) {
      out.push('<span class="fail">FAIL</span> ' + name + ' — 예외: ' + e.message);
      return false;
    }
  }

  setTimeout(function () {
    var C = DG.core, R = DG.rtk, CD = DG.cityData, FD = DG.forceData,
        off = DG.off, W = DG.war, D = DG.diplo, AI = DG.rtkAI, Q = DG.quiz, QD = DG.quizData;

    /**
     * 판을 깨끗하게 다시 세운다.
     * **항목은 자기가 쓸 상태를 스스로 만든다** — 앞 항목이 남긴 성·충성·맹약이
     * 다음 항목으로 흘러 들어가면 통과와 실패가 순서에 달리게 된다.
     */
    function fresh(meId, scen) {
      /* 무장 성장(`save.heroes`)은 setup 이 건드리지 않는다 — 세이브 공용 칸이라
         일부러 그렇게 두었다. 진단에서는 **함께 비운다**. 안 비우면 앞 항목이
         올려 놓은 레벨이 뒤 항목의 능력치로 흘러 들어가 수치가 순서에 달린다 */
      C.save.heroes = {};
      R.setup(meId || 'cao', scen);
      return R.state();
    }

    /** 그 성의 장수를 모두 성하게(명령 안 쓴 상태로) 만든다 */
    function freeUp(cityId) {
      var list = off.atCity(cityId, R.city(cityId).force);
      for (var i = 0; i < list.length; i++) {
        var r = off.rec(list[i].id); r.done = false; r.hurt = 0;
      }
      return list;
    }

    /**
     * 재야(在野)는 이름 해시로 `CD.CITIES.length` 를 나눠 결정적으로 흩는다
     * (`rtk.scatterFree`) — 성을 늘릴 때마다(지역 확장) 나눗셈이 바뀌어 어느
     * 성에 숨은 사람이 걸리는지도 통째로 바뀐다. 대개는 내 세력(cao)의 몇
     * 안 되는 시작 성 어딘가에 우연히 걸리지만, **2026-09-10 균열(아홉째)
     * 확장에서 실제로 셋 다 빗나가 세 항목이 한꺼번에 깨졌다** — 성 수가
     * 93 이 되면서 하필 cao 의 세 시작 성(진류·복양·허창) 모두에 숨은 재야가
     * 하나도 안 떨어졌다. 자연스러운 산포 운에 기대는 대신, 아무 데나 숨어
     * 있는 재야 하나를 내 세력 성으로 직접 옮겨 확실하게 만든다 — 시험하려는
     * 것("수색 전엔 등용 못 한다", "학식·세작이 재야를 드러낸다")은 그대로다,
     * 산포 자체의 운을 시험하는 게 아니다. */
    function ensureHiddenAtMine() {
      var mine = R.citiesOf('cao'), i;
      for (i = 0; i < mine.length; i++) {
        if (off.freeAt(mine[i], false).length) { return mine[i]; }
      }
      for (i = 0; i < CD.CITIES.length; i++) {
        var hidden = off.freeAt(CD.CITIES[i].id, false)[0];
        if (hidden) {
          off.placeAt(hidden.id, mine[0], null);
          off.rec(hidden.id).found = false;
          return mine[0];
        }
      }
      return null;
    }

    /**
     * 낙양 앞에 진(陣)을 하나 세운다.
     * **배수를 올려 가며 진영이 설 때까지** 해 본다 — 한 배수에 못을 박아 두면
     * 앞 항목이 난수를 얼마나 썼느냐에 따라 함락이 되거나 퇴각이 되어 흔들린다.
     */
    function campSet() {
      var ms = [1, 1.2, 1.5, 1.8, 2.2], i;
      for (i = 0; i < ms.length; i++) {
        fresh('cao');
        var from = R.city('chenliu'), to = R.city('luoyang');
        from.troops = Math.round(to.troops * ms[i]); from.food = 999999;
        var lead = off.atCity('chenliu', 'cao').slice(0, 3).map(function (h) { return h.id; });
        var rep = W.march('chenliu', 'luoyang', lead, from.troops - 1);
        var cp = W.campsOf('cao')[0];
        if (cp) { return { rep: rep, cp: cp, lead: lead, mult: ms[i] }; }
      }
      return null;
    }

    function countFound() {
      var n = 0, m = R.state().officers, k;
      for (k in m) { if (!m[k].force && m[k].found) { n++; } }
      return n;
    }

    /* ── 골격 ────────────────────────────────────────── */

    t('옛 경영 모듈은 걷어냈다', function () {
      var gone = ['land', 'territory', 'build', 'buildData', 'incident', 'auto'];
      var left = gone.filter(function (k) { return !!DG[k]; });
      return left.length === 0 && '강역·특산·건설·사변·자동 없음 (성이 그 자리를 맡는다)';
    });

    t('삼국지 모듈이 다 실려 있다', function () {
      var here = ['cityData', 'forceData', 'off', 'rtk', 'war', 'diplo', 'rtkAI', 'quiz'];
      var miss = here.filter(function (k) { return !DG[k]; });
      return miss.length === 0 &&
        ('성 ' + CD.CITIES.length + ' · 세력 ' + FD.FORCES.length +
         ' · 명령 ' + R.ORDERS.length + ' · 계략 ' + D.PLOTS.length +
         ' · 문답 ' + QD.BANK.length);
    });

    t('지도에 외딴 성이 없다', function () {
      /* 한 곳이라도 길이 끊기면 그 성은 영영 못 뺏고 못 빼앗긴다 */
      var lonely = CD.CITIES.filter(function (c) { return !c.adj.length; });
      var far = CD.CITIES.filter(function (c) { return CD.hops('luoyang', c.id) < 0; });
      return lonely.length === 0 && far.length === 0 && CD._dropped.length === 0 &&
        ('서른 성이 다 이어져 있다 · 낙양→성도 ' + CD.hops('luoyang', 'chengdu') +
         '성 · 계→회계 ' + CD.hops('jixian', 'kuaiji') + '성');
    });

    t('길은 양쪽으로 이어진다', function () {
      /* 한쪽만 이어져 있으면 "칠 수는 있는데 되받아칠 수 없는" 성이 생긴다 */
      var bad = [];
      for (var i = 0; i < CD.CITIES.length; i++) {
        var a = CD.CITIES[i];
        for (var j = 0; j < a.adj.length; j++) {
          if (CD.find(a.adj[j]).adj.indexOf(a.id) < 0) { bad.push(a.id + '→' + a.adj[j]); }
        }
      }
      return bad.length === 0 && '한쪽만 난 길 없음';
    });

    t('무장 명부는 data.js 를 건드리지 않고 늘어난다', function () {
      /* data.js 는 다섯 판이 바이트까지 같은 복사본이다. 얹기만 한다 */
      var n = off.all().length;
      var three = off.all().filter(function (h) { return h.era === '삼국지'; }).length;
      /* 2026-09-10 — data.js 쪽 인물 수는 다른 세션(HEROES 가명화 후속)이 같은
         시각에 늘리고 있어(현재 삼국지22·한국사26·일본사20·세계사37 = 105)
         고정 매직넘버로 두면 그쪽이 또 늘 때마다 이 진단이 헛되이 깨진다.
         그래서 이 판이 보탠 무장(FD.OFFICERS + 확장 지역, 2026-09-22 현재
         열한 곳)만 id로 골라내 "보탠 개수"를 세고, 나머지(=data.js 쪽)는
         거꾸로 계산한다 — data.js 를 안 건드리고 늘었다는 것만 확인하면
         되는 테스트라 이걸로 충분하다 */
      var added = FD.OFFICERS.concat(
        FD.KOREA_OFFICERS, FD.JAPAN_OFFICERS, FD.JIAOZHOU_OFFICERS, FD.XIYU_OFFICERS,
        FD.NANZHONG_OFFICERS, FD.TIANZHU_OFFICERS, FD.MOBEI_OFFICERS, FD.LINYI_OFFICERS,
        FD.DAQIN_OFFICERS, FD.XIANBEI_OFFICERS, FD.NANHAI_OFFICERS, FD.SILK_OFFICERS);
      var addedIds = {};
      added.forEach(function (o) { addedIds[o.id] = true; });
      var dataHeroBase = off.all().filter(function (h) { return !addedIds[h.id]; }).length;
      return n === dataHeroBase + added.length && three === 76 &&
        !!DG.data.find('rf_guojia') && !!DG.data.find('sg_caocao') &&
        ('인물(data.js) ' + dataHeroBase + ' + 이 판이 보탠 무장 ' + added.length + ' = ' + n +
         ' · 삼국지 ' + three + ' · 재야 후보 ' + (n - three));
    });

    t('세력 표의 무장이 모두 명부에 있다', function () {
      var miss = [];
      for (var i = 0; i < FD.FORCES.length; i++) {
        var ids = FD.roster(FD.FORCES[i].id);
        for (var j = 0; j < ids.length; j++) { if (!off.find(ids[j])) { miss.push(ids[j]); } }
      }
      return miss.length === 0 && '군주 13 · 부하 전원 확인';
    });

    /* ── 판 세우기 ───────────────────────────────────── */

    t('194년 판이 선다 — 서른 성에 주인이 다 있다(확장 지역은 주인 없이 시작)', function () {
      var st = fresh('cao');
      var keys = Object.keys(st.cities);
      /* 확장 지역(garrison 필드가 있는 성 — 역사 열한 곳 + 균열·폐허·묘역)은
         처음부터 일부러 주인이 없다 — 정복 대상이다. 그것들을 빼고서
         나머지가 다 주인 있는지만 잰다 */
      var noOwner = keys.filter(function (k) {
        return !st.cities[k].force && !CD.find(k).garrison;
      });
      var total = 0;
      for (var i = 0; i < FD.FORCES.length; i++) { total += FD.FORCES[i].cities.length; }
      return keys.length === CD.CITIES.length && noOwner.length === 0 && total === 30 &&
        (st.year + '년 ' + st.month + '월 · 내 세력 ' + R.forceName(st.me));
    });

    t('재야는 삼국지 사람이 아닌 인물들이다', function () {
      fresh('cao');
      var free = off.all().filter(function (h) { return h.stats && !off.rec(h.id).force; });
      var nonThree = free.filter(function (h) { return h.era !== '삼국지'; }).length;
      /* 역사 확장 지역(2026-09-22 현재 열한 곳) 수비 무장도 force:null 이라
         이 정의로는 재야에 든다. data.js 쪽 비삼국지 인물 수는 다른 세션이
         같이 늘리고 있어 고정 매직넘버를 안 쓴다(위 "무장 명부는…" 테스트와
         같은 이유) — "이 판이 보탠 비삼국지 무장이 전부 재야에 잡히는지"만
         확인한다 */
      var addedGroups = FD.KOREA_OFFICERS.concat(
        FD.JAPAN_OFFICERS, FD.JIAOZHOU_OFFICERS, FD.XIYU_OFFICERS,
        FD.NANZHONG_OFFICERS, FD.TIANZHU_OFFICERS, FD.MOBEI_OFFICERS, FD.LINYI_OFFICERS,
        FD.DAQIN_OFFICERS, FD.XIANBEI_OFFICERS, FD.NANHAI_OFFICERS, FD.SILK_OFFICERS);
      var addedNonThree = addedGroups.length;
      var freeIds = {};
      free.forEach(function (h) { freeIds[h.id] = true; });
      var addedFreeOk = addedGroups.every(function (o) { return freeIds[o.id]; });
      return addedFreeOk && nonThree >= addedNonThree &&
        ('재야 ' + free.length + ' (확장 지역 ' + addedNonThree + '인 전원 포함, 비삼국지 계 ' +
         nonThree + ' + 삼국지 재야 ' + (free.length - nonThree) + ')');
    });

    t('재야는 늘 같은 성에 있다 (난수를 얼마나 썼든)', function () {
      /* 무작위로 흩으면 진단이 실행마다 다른 성을 짚는다 — 이름 해시로 흩는다 */
      fresh('cao');
      var a = off.rec('kr_yisunsin').city;
      for (var i = 0; i < 30; i++) { Math.random(); }
      fresh('bei');
      var b = off.rec('kr_yisunsin').city;
      return a === b && ('이순신은 두 번 다 ' + CD.find(a).name);
    });

    t('수색 전에는 재야가 보이지 않는다', function () {
      /* 특정 인물을 못 박으면 그 사람이 (이름 해시로) 떨어지는 성이 성이
         늘 때마다 바뀐다 — 하필 수비 무장이 있는 성(이미 found:true 인
         사람이 있어 seen이 0이 아닌 성)에 떨어지면 헛되이 깨진다. 그래서
         "묻힌 사람은 있는데 보이는 사람은 없는 성"을 직접 찾는다(위
         "수색해야 등용할 수 있다" 테스트와 같은 방식) */
      fresh('cao');
      var target = null, all = 0;
      for (var i = 0; i < CD.CITIES.length; i++) {
        var cid = CD.CITIES[i].id;
        var a = off.freeAt(cid, false).length;
        var s = off.freeAt(cid, true).length;
        if (a > 0 && s === 0) { target = cid; all = a; break; }
      }
      if (!target) { return false; }
      return ('그 성(' + target + ')에 ' + all + '명이 묻혀 있고 보이는 사람은 0');
    });

    t('열다섯째 확장 실크로드 + 서역 보강(2026-09-23) — 새 성 아홉이 낙양에서 닿고, 주인 없이 시작하며, 수비 무장이 제 성에 선다', function () {
      var NEW = ['cheshi', 'shache', 'jingjue', 'wusun', 'kangju', 'yancai', 'jianshi', 'xiumi', 'guishuang'];
      var st = fresh('cao'), bad = [];
      var seen = { luoyang: true }, q = ['luoyang'];
      while (q.length) { CD.find(q.shift()).adj.forEach(function (a) { if (!seen[a]) { seen[a] = true; q.push(a); } }); }
      NEW.forEach(function (id) {
        var d = CD.find(id), c = st.cities[id];
        if (!d || !c) { bad.push(id + ' 없음'); return; }
        if (!seen[id]) { bad.push(id + ' 못 닿음'); }
        if (c.force) { bad.push(id + ' 주인=' + c.force); }
        if (c.troops !== d.garrison) { bad.push(id + ' 병력'); }
        if (d.adj.some(function (a) { return d.land === 'river' && CD.find(a).land === 'river'; })) { bad.push(id + ' 물길'); }
        var g = (d.prov === 'sl' ? FD.SILK_GARRISON : FD.XIYU_GARRISON)[id] || [];
        if (!g.length) { bad.push(id + ' 수비 무장 없음'); }
        g.forEach(function (oid) {
          var o = off.find(oid), r = off.rec(oid);
          if (!o || o.faction !== d.name || !r || r.city !== id) { bad.push(oid + ' 자리'); }
        });
      });
      var unreached = CD.CITIES.filter(function (d) { return !seen[d.id]; }).length;
      if (unreached) { bad.push('못 닿는 성 ' + unreached); }
      if (CD.provName('sl') !== '실크로드' || !CD.find('guishuang').landmark) { bad.push('지역 이름·랜드마크'); }
      if (bad.length) { throw new Error('실패: ' + bad.join(', ')); }

         버려 ratio가 origMul과 안 맞았다 — **세 진형을 전부** 꺼야 "진형이
         아예 안 선 값"이 나온다(하나만 못 박는 예전 방식은 여러 진형

    /* ── 지형 전술·진형 수동 선택 (PLAN §5-6) ─────────────── */

    /** 같은 씨앗의 난수로 fn 을 굴린다 — stepRound 는 손실에 Math.random 을 쓰므로, 두 번 굴려 비교하려면 필요하다 */
    function withSeed(seed, fn) {
      var real = Math.random, s = seed >>> 0;
      Math.random = function () {
        s = (s + 0x6D2B79F5) >>> 0;
        var t = Math.imul(s ^ (s >>> 15), s | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      try { return fn(); } finally { Math.random = real; }
    }
    function byStat(stat, min, max) {
      return off.all().filter(function (h) { return h.stats; }).filter(function (h) {
        var s = off.stats(h.id); return s[stat] >= min && (max === undefined || s[stat] <= max);
      })[0];
    }
    /** 공격·수비 한 쌍과 성벽 — 판마다 새로 만든다 */
    function duelSetup(atkIds, troops) {
      return {
        atk: { side: 'atk', force: 'a', troops: troops || 10000, start: troops || 10000, train: 60, tech: 300, officers: atkIds.slice(), morale: 1, water: false, ships: 0 },
        def: { side: 'def', force: 'd', troops: troops || 10000, start: troops || 10000, train: 60, tech: 300, officers: [], morale: 1, water: false, ships: 0 },
        wall: { wall: 1000, maxWall: 1000 }
      };
    }
    function round(landKey, ids, cmd, seed, n) {
      var s = duelSetup(ids), lines = [], i, res;
      withSeed(seed || 7, function () {
        for (i = 0; i < (n || 1); i++) { res = W.stepRound(s.atk, s.def, s.wall, 'x', CD.LANDS[landKey], false, false, function (l) { lines.push(l); }, i === 0 ? cmd : (cmd && cmd.next)); }
      });
      return { s: s, lines: lines, res: res };
    }

    /** 쪼개기 전 duel() 본문 그대로의 사본 — 새 duel() 이 난수까지 같은 결과를 내는지 견주는 기준이다 */
    function oldDuel(aId, dId) {
      var am = off.stats(aId).might * off.traitMul(aId, 'duelMight'), dm = off.stats(dId).might * off.traitMul(dId, 'duelMight');
      if (Math.abs(am - dm) > W.DUEL_GAP) { return null; }
      if (Math.random() > Math.min(0.9, 0.35 * off.traitMul(aId, 'duelRate') * off.traitMul(dId, 'duelRate'))) { return null; }
      var rounds = [], hits = [], ah = 100, dh = 100, n = 0;
      while (ah > 0 && dh > 0 && n < 12) {
        n++;
        var hit = am / (am + dm);
        if (Math.random() < hit) { dh -= 8 + Math.round(am / 12); rounds.push('a'); }
        else { ah -= 8 + Math.round(dm / 12); rounds.push('d'); }
        hits.push({ who: rounds[rounds.length - 1], ah: Math.max(0, ah), dh: Math.max(0, dh) });
      }
      var winner = dh <= 0 ? aId : (ah <= 0 ? dId : (ah >= dh ? aId : dId));
      var loser = winner === aId ? dId : aId;
      var decisive = (winner === aId ? dh : ah) <= 0;
      var hurt = decisive && Math.random() < 0.5;
      if (hurt) { off.rec(loser).hurt = 1 + Math.floor(Math.random() * 2); }
      return { winner: winner, loser: loser, rounds: n, decisive: decisive, hurt: hurt, hits: hits,
        text: off.find(winner).name + ' 이(가) ' + off.find(loser).name + ' 을(를) ' + n + '합 만에 ' + (decisive ? '꺾었다' : '밀어냈다') };
    }
    /** Math.random 을 고정값으로 묶고 fn 을 굴린다 — 0 이면 일기토 문턱이 늘 열리고 칠 때마다 a 가 맞힌다 */
    function withRand(v, fn) {
      var real = Math.random;
      Math.random = function () { return v; };
      try { return fn(); } finally { Math.random = real; }
    }
    /** 무력이 비슷한 두 장수 — 일기토가 성립할 수 있는 한 쌍 */
    function duelPair() {
      var hs = off.all().filter(function (h) { return h.stats; }).sort(function (a, b) { return off.stats(b.id).might - off.stats(a.id).might; });
      for (var i = 10; i < hs.length - 1; i++) {
        if (Math.abs(off.stats(hs[i].id).might - off.stats(hs[i + 1].id).might) <= 6) { return [hs[i].id, hs[i + 1].id]; }
      }
      return [hs[10].id, hs[11].id];
    }
    function cleanHurt(ids) { ids.forEach(function (id) { off.rec(id).hurt = 0; }); }

      /* 이 나이에선 명부 전체가 걸려 rollAging() 한 번에 Math.random() 을
         수백 번 끌어 쓴다 — 진단 전체가 공유하는 고정 씨앗 순번이 이
         항목 때문에 밀리면 뒤따르는 다른 항목이 죄다 흔들린다. 여기서만
         잠깐 딴 발생기를 끼우고 끝나면 반드시 원래 것으로 되돌린다. */
      var savedRandom = Math.random, seed = 0xC0FFEE;
      Math.random = function () {
        seed = (seed + 0x6D2B79F5) >>> 0;
        var x = seed;
        x = Math.imul(x ^ (x >>> 15), x | 1);

        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };

        off.rollAging();
        died = off.isDead(id);
      }
      Math.random = savedRandom;

      C.setTune('war.journeyEventChance', 1);

      var bad = [], line = [];
      for (var s = 0; s < FD.SCENARIOS.length; s++) {
        var sc = FD.SCENARIOS[s], seen = {}, n = 0, i, j, extra = 0;
        for (i = 0; i < sc.forces.length; i++) {
          var f = sc.forces[i];

            if (seen[f.cities[j]]) { bad.push(sc.id + ':' + f.cities[j] + ' 겹침'); }

            else if (CD.find(f.cities[j]).garrison) { extra++; continue; }
            seen[f.cities[j]] = true; n++;
          }
          if (!off.find(f.lord)) { bad.push(sc.id + ':' + f.lord + ' 없는 군주'); }
          if (f.officers.indexOf(f.lord) >= 0) { bad.push(sc.id + ':' + f.lord + ' 군주가 두 번'); }
          for (j = 0; j < f.officers.length; j++) {

        ('보병 장식 천만 물듦·걷기·창 오른손 x ' + fp.x.toFixed(2) + ' · 기수 엉덩이 = 말 등 · 몸 없으면 null');
    });

    /* ── 명마·비행(mount.js, SAGA-DESIGN §15) — 장수에게 얹는 말 셋(땅 싸움 부대 힘) + 3D 지도 비행 카메라 둘 ── */
    function mtCount(n) {

      var st = R.state(), ids = Object.keys(st.cities), i, k = 0;

    t('탈것 — 카탈로그 5(농마 2성·갈색 말 4성·흰 말 7성 · 학 5성 · 용 9성) · 성 수로 열림 · 장수에게 얹기(한 필 한 사람) · 비행 고르기 · 저장 칸 · 손잡이', function () {

        r.one = !M.equip(b, 'mt_white').ok && /이미/.test(M.equip(b, 'mt_white').why) && M.freeFor(b).map(function (m) { return m.id; }).join() === 'mt_farm,mt_brown';

    t('탈것 — 명마: 땅 싸움 부대 힘 ×mul(수전 ✕) · 우리 세력을 떠나면 효과 없음 · 싸움 기록·3D 돌격 배율 · 비행 카메라·이동 배율', function () {

        M.cycle(); r.swap = M.current().id === 'mt_crane' && M.panMul() === 1.7 && calls.length === 2;

    });

    t('런타임 에러 없음', function () {
