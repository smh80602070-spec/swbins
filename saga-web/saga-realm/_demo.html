<script>
/* 데모는 **진짜 세이브를 건드리지 않는다** — 따로 판 키를 쓰고, 나갈 때 지운다.
   (데모가 실제 세이브를 덮은 사고가 다른 판에서 있었다) */
window.DG_NO_ACCOUNT = true;
(function (seed) {
  var s = seed >>> 0;
  Math.random = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
})(20260824);
</script>

<script>
/**
 * 장면 — 주소 뒤에 #를 붙여 고른다.
 *   #scen   판(시나리오) 고르기 #pick  세력 고르기
 *   #map    지도 (194년, 조조)  #chibi 208년 적벽의 지도
 *   #grown  다섯 해 뒤의 지도   #city  성(허창) — 명령표
 *   #enemy  남의 성(낙양) — 계략·출진
 *   #war    전황 보고          #camp  진영 (달을 넘긴 원정)
 *   #ask    출진 물음 카드 (폰에서 prompt 를 걷어낸 자리)
 *   #officers 무장   #diplo 외교   #school 학당
 *   #korea  한국 지역(2026-09-03 확장) 지도 + 첫 성(양평) 시트
 */
(function () {
  var C = DG.core, R = DG.rtk, off = DG.off, W = DG.war;
  C.setSaveKey('saga-realm/save/demo');
  C.persist = function () {};          // 데모는 아무것도 남기지 않는다

  /* 판을 **먼저** 세운다 — init() 이 "아직 안 선 판" 을 보면 세력 고르기를 띄운다.
     순서를 바꾸면 어느 장면을 열든 그 덮개가 앞을 가린다 */
  R.setup('cao');
  DG.ui.init();

  var scene = (location.hash || '#map').slice(1);

  function freeUp(cityId) {
    var list = off.atCity(cityId, R.city(cityId).force);
    for (var i = 0; i < list.length; i++) {
      off.rec(list[i].id).done = false; off.rec(list[i].id).hurt = 0;
    }
  }

  if (scene === 'scen') {
    DG.ui.showScenPick();
  } else if (scene === 'chibi') {
    R.setup('quan', '208');
    DG.ui.renderTop(); DG.ui.renderMap();
  } else if (scene === 'pick') {
    DG.ui.showForcePick();
  } else if (scene === 'grown') {
    for (var m = 0; m < 60 && !R.state().result; m++) { R.endMonth(); }
    DG.ui.renderTop(); DG.ui.renderMap();
  } else if (scene === 'city') {
    R.city('xuchang').disaster = 'drought'; R.city('xuchang').dLeft = 2;
    freeUp('xuchang');
    DG.ui.openCity('xuchang');
  } else if (scene === 'enemy') {
    freeUp('chenliu'); freeUp('xuchang');
    DG.ui.openCity('luoyang');
  } else if (scene === 'war') {
    var from = R.city('chenliu'), to = R.city('luoyang');
    from.troops = Math.round(to.troops * 2.4); from.food = 999999;
    var lead = off.atCity('chenliu', 'cao').slice(0, 3).map(function (h) { return h.id; });
    DG.ui.showBattle(W.march('chenliu', 'luoyang', lead, from.troops - 1));
  } else if (scene === 'camp') {
    /* 낙양 앞에 진을 세워 둔다 — 한 달에 안 떨어지는 크기로 친다 */
    var cf = R.city('chenliu'), ct = R.city('luoyang');
    cf.troops = Math.round(ct.troops * 1.5); cf.food = 999999;
    var clead = off.atCity('chenliu', 'cao').slice(0, 3).map(function (h) { return h.id; });
    W.march('chenliu', 'luoyang', clead, cf.troops - 1);
    var cp = W.campsOf('cao')[0];
    if (cp) { cp.months = 3; cp.morale = 0.82; }     // 석 달째 에워싼 그림
    DG.ui.closeEnc();                                // 전황 카드가 시트를 가린다
    DG.ui.openSheet('camp');
  } else if (scene === 'ask') {
    freeUp('chenliu');
    DG.ui._act('march', {
      getAttribute: function (k) { return k === 'data-from' ? 'chenliu' : 'luoyang'; }
    });
  } else if (scene === 'officers') {
    DG.ui.openSheet('officers');
  } else if (scene === 'diplo') {
    freeUp('xuchang');
    DG.ui.openSheet('diplo');
  } else if (scene === 'school') {
    DG.ui.openSheet('school');
  } else if (scene === 'korea') {
    DG.ui.renderTop(); DG.ui.renderMap();
    DG.ui.openCity('yangping');
  } else {
    DG.ui.renderTop(); DG.ui.renderMap();
  }

  window.addEventListener('hashchange', function () { location.reload(); });
  localStorage.removeItem('saga-realm/save/demo');
})();
</script>
