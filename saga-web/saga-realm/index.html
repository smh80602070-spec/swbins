<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* 주소창에서 파일 이름을 지운다 — /xxx/index.html → /xxx/ */
try{if(location.protocol!=='file:'&&/\/index\.html$/.test(location.pathname))history.replaceState(null,'',location.pathname.replace(/index\.html$/,'')+location.search+location.hash);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12141a">
<title>사가국지 — 다스리고 꾀고 친다</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/strategy.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="사가국지">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body class="camp">

<div id="camp-bg"></div>
<div id="vignette"></div>

<!-- 상단: 세력·연월 · 살림 · 다음 달 -->
<div id="top">
  <div class="glass profile" id="profile"></div>
  <div class="tools">
    <button class="icon-btn" id="btn-3d" title="국토 지도 2D↔3D 전환">🧊</button>
    <button class="icon-btn" id="btn-more" title="더보기">⋯</button>
    <div id="top-more">
      <a class="icon-btn" id="btn-rts" href="rts.html" title="전장 (시험) — 조조전식 턴 전투">⚔️</a>
      <button class="icon-btn" id="btn-sound" title="소리 (전투·승진·외교 등, 절차적 생성 — 아직 실기 미확인)">🔊</button>
      <button class="icon-btn" id="btn-settings" title="설정 (효과음 음량)">⚙️</button>
      <button class="icon-btn" id="btn-help" title="노는 법">❔</button>
      <a class="icon-btn" id="btn-admin" href="_admin.html" target="_blank" rel="noopener" title="어드민 (QA · 손잡이)">🛠️</a>
      <button class="icon-btn" id="btn-reset" title="처음부터">↺</button>
    </div>
  </div>
  <div class="glass wallet" id="wallet"></div>
</div>

<!-- 가운데: 지도 (성 서른 곳) -->
<div id="realm"></div>
<canvas id="realm3d"></canvas>

<!-- 좌하단: 지도 조이스틱 · 내 땅으로 · 확대·축소 (2D·3D 다 통한다) -->
<div id="rjoy"><div id="rjoy-knob"></div></div>
<div id="rmapctl">
  <button class="icon-btn sm" id="btn-map-home" title="내 땅으로">🏠</button>
  <button class="icon-btn sm" id="btn-map-zoomin" title="확대">➕</button>
  <button class="icon-btn sm" id="btn-map-zoomout" title="축소">➖</button>
</div>

<!-- 우하단: 액션 독 -->
<nav id="dock">
  <button data-sheet="city"><span>🏯</span><small>성</small></button>
  <button data-sheet="officers"><span>👤</span><small>무장</small></button>
  <button data-sheet="camp"><span>🏕️</span><small>진영</small></button>
  <button data-sheet="diplo"><span>🤝</span><small>외교</small></button>
  <button data-sheet="school"><span>📚</span><small>학당</small></button>
  <button data-sheet="log"><span>📜</span><small>기록</small></button>
</nav>

<!-- 슬라이드 시트 -->
<div id="scrim"></div>
<aside id="sheet">
  <div class="sheet-head">
    <div class="grip"></div>
    <h3 id="sheet-title">성</h3>
    <button class="icon-btn sm" id="sheet-map" title="국토 지도로 (M)">🗺️</button>
    <button class="icon-btn sm" id="sheet-close">✕</button>
  </div>
  <canvas id="city3d" title="성 안 (3D)"></canvas>
  <div id="sheet-body"></div>
</aside>

<div id="encounter"></div><div id="detail"></div>
<div id="toast"></div>

<script src="dist/app.js"></script>
<script>
/* 서비스 워커 — https · localhost 에서만 등록된다.
   파일을 늘리거나 고쳤으면 sw.js 의 VERSION 도 같이 올릴 것. */
(function () {
  if (!('serviceWorker' in navigator)) { return; }
  var h = location.hostname;
  var secure = location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1';
  if (!secure) { return; }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')['catch'](function (e) {
      console.warn('서비스 워커 등록 실패', e);
    });
  });
})();
</script>
</body>
</html>
