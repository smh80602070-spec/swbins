<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>saga-web 맵 편집기</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="top">
  <h1>맵 편집기</h1>
  <nav><a class="cur" href="map.html">글자 지도</a><a href="city.html">성 지도</a><a href="side.html">사냥터</a><a href="/scene.html">3D 배치</a><a href="town.html">사가나락 마을</a></nav>
  <select id="landSel"></select>
  <span class="muted" id="meta"></span>
  <span class="sp"></span>
  <span id="playMount" style="display:flex;gap:4px"></span>
  <button id="bPlayHere" title="F6 — 고른 명소(없으면 화면 가운데) 칸에서 시작 · Alt+누르기 = 누른 칸">▶ 여기서</button>
  <span id="badge" class="muted">검사 중…</span>
  <button id="btnUndo" title="Ctrl+Z">되돌리기</button>
  <button id="btnReload">다시 읽기</button>
  <button class="primary" id="btnSave">저장</button>
</div>
<div id="main">
  <div id="left">
    <h3>도구</h3>
    <div class="row"><button id="tPaint" class="on">칠하기</button><button id="tFill">채우기</button><button id="tPick">스포이트</button><button id="tPlace">명소 옮기기</button></div>
    <h3>범례(칠할 글자) — 이 땅 legend 그대로</h3>
    <div id="palette"></div>
    <h3>크기</h3>
    <div class="row"><button id="addCol">오른쪽 +1열</button><button id="delCol">−1열</button></div>
    <div class="row"><button id="addRow">아래 +1줄</button><button id="delRow">−1줄</button></div>
    <div class="muted">왼쪽·위로는 늘리지 않는다 — 격자 원점(ox·oy)과 명소 좌표가 한꺼번에 밀리기 때문이다.</div>
  </div>
  <div id="center"><canvas id="grid"></canvas></div>
  <div id="right">
    <h3>검사 — 게임 코드(validate·roadIslands·tally) 그대로</h3>
    <div id="report"></div>
    <h3>명소(places) — 고르고 "명소 옮기기"로 칸을 누른다</h3>
    <div id="places"></div>
    <div class="row"><button id="addPlace">명소 추가</button></div>
    <h3>기록</h3>
    <div id="log"></div>
  </div>
</div>
<script>
'use strict';
const KIND_COLOR = { grass: '#8fbf6a', forest: '#3f7d45', mount: '#8b7d6b', water: '#4f86c6', road: '#d9c38c', town: '#c9785a', farm: '#c2b24a' };
const $ = (s) => document.querySelector(s);
let lands = [], L = null, map = [], places = [], hash = '', cur = '.', tool = 'paint', selPlace = -1, undo = [], dirty = false, CELL = 26;
const cv = $('#grid'), cx = cv.getContext('2d');

function log(t, ok) { const d = document.createElement('div'); d.className = ok ? 'ok' : 'bad'; d.textContent = (ok ? '✓ ' : '✗ ') + t; $('#log').prepend(d); }
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function load() {
  const r = await fetch('/api/lands'); lands = (await r.json()).lands || [];
  $('#landSel').innerHTML = lands.map((l, i) => '<option value="' + i + '">' + esc(l.game + ' · ' + l.name + ' (' + l.id + ')') + '</option>').join('');
  if (!lands.length) { $('#meta').textContent = 'js/land.js 가 있는 판이 없다'; return; }
  pick(0);
}
function pick(i) {
  L = lands[i]; map = L.map.slice(); places = L.places.map((p) => ({ ...p })); hash = L.hash; undo = []; dirty = false; selPlace = -1;
  renderPalette(); renderPlaces(); draw(); showReport(L.report);
}
function renderPalette() {
  $('#palette').innerHTML = Object.entries(L.legend).map(([ch, e]) =>
    '<div class="pal' + (ch === cur ? ' sel' : '') + '" data-ch="' + esc(ch) + '"><span class="sw" style="background:' + (KIND_COLOR[e.kind] || '#777') + '">' + (e.mark ? esc(ch) : '') + '</span>' +
    '<span><b>' + esc(ch) + '</b> ' + esc(e.kind) + (e.mark ? ' · <span class="warn">' + esc(e.mark) + '</span>' : '') + '</span></div>').join('');
  document.querySelectorAll('.pal').forEach((d) => { d.onclick = () => { cur = d.dataset.ch; renderPalette(); }; });
}
function renderPlaces() {
  $('#places').innerHTML = places.map((p, i) =>
    '<div class="pl' + (i === selPlace ? ' sel' : '') + '" data-i="' + i + '"><input data-k="name" value="' + esc(p.name) + '" title="' + esc(p.id) + '">' +
    '<input data-k="tx" type="number" value="' + p.tx + '"><input data-k="ty" type="number" value="' + p.ty + '">' +
    '<input data-k="hidden" type="checkbox" title="숨은 곳"' + (p.hidden ? ' checked' : '') + '></div>').join('');
  document.querySelectorAll('.pl').forEach((row) => {
    const i = +row.dataset.i;
    row.onclick = (e) => { if (e.target.tagName !== 'INPUT') { selPlace = i; renderPlaces(); draw(); } };
    row.querySelectorAll('input').forEach((inp) => {
      inp.onfocus = () => { selPlace = i; draw(); };
      inp.onchange = () => {
        push(); const k = inp.dataset.k;
        places[i][k] = k === 'hidden' ? inp.checked : (k === 'name' ? inp.value : parseInt(inp.value, 10) || 0);
        if (k === 'hidden' && !inp.checked) delete places[i].hidden;
        changed();
      };
    });
  });
}
function draw() {
  const w = map[0].length, h = map.length;
  cv.width = w * CELL; cv.height = h * CELL;
  cx.font = '700 ' + Math.floor(CELL * 0.5) + 'px Consolas, monospace'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = map[y][x], e = L.legend[ch];
    cx.fillStyle = e ? (KIND_COLOR[e.kind] || '#777') : '#f0f';
    cx.fillRect(x * CELL, y * CELL, CELL, CELL);
    if (!e || e.mark) { cx.fillStyle = '#111'; cx.fillText(ch, x * CELL + CELL / 2, y * CELL + CELL / 2 + 1); }
  }
  cx.strokeStyle = 'rgba(0,0,0,.18)';
  for (let x = 0; x <= w; x++) { cx.beginPath(); cx.moveTo(x * CELL + .5, 0); cx.lineTo(x * CELL + .5, h * CELL); cx.stroke(); }
  for (let y = 0; y <= h; y++) { cx.beginPath(); cx.moveTo(0, y * CELL + .5); cx.lineTo(w * CELL, y * CELL + .5); cx.stroke(); }
  // 격자 (0,0) 표시 — 게임 시작 자리
  const x0 = -L.ox, y0 = -L.oy;
  cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.strokeRect(x0 * CELL + 2, y0 * CELL + 2, CELL - 4, CELL - 4); cx.lineWidth = 1;
  places.forEach((p, i) => {
    const px = (p.tx - L.ox) * CELL + CELL / 2, py = (p.ty - L.oy) * CELL + CELL / 2;
    cx.fillStyle = i === selPlace ? '#ffdf5a' : (p.hidden ? '#b06cff' : '#fff');
    cx.beginPath(); cx.arc(px, py, CELL * 0.22, 0, Math.PI * 2); cx.fill();
    cx.strokeStyle = '#111'; cx.stroke();
  });
  $('#meta').textContent = w + '×' + h + '칸 · ' + (w * 48) + '×' + (h * 48) + 'm · 격자 ' + L.ox + ',' + L.oy + '..' + (L.ox + w - 1) + ',' + (L.oy + h - 1) + (dirty ? ' · 저장 안 됨' : '');
}
function push() { undo.push({ map: map.slice(), places: places.map((p) => ({ ...p })) }); if (undo.length > 200) undo.shift(); }
function setCell(x, y, ch) { if (map[y][x] === ch) return false; map[y] = map[y].slice(0, x) + ch + map[y].slice(x + 1); return true; }
function fill(x, y, ch) {
  const from = map[y][x]; if (from === ch) return;
  const st = [[x, y]];
  while (st.length) {
    const [a, b] = st.pop();
    if (b < 0 || b >= map.length || a < 0 || a >= map[b].length || map[b][a] !== from) continue;
    setCell(a, b, ch); st.push([a + 1, b], [a - 1, b], [a, b + 1], [a, b - 1]);
  }
}
let painting = false;
function cellAt(e) { const r = cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / CELL), Math.floor((e.clientY - r.top) / CELL)]; }
cv.onmousedown = (e) => {
  const [x, y] = cellAt(e); if (y < 0 || y >= map.length || x < 0 || x >= map[0].length) return;
  if (e.altKey) { e.preventDefault(); playHere(x, y); return; }
  if (tool === 'pick') { cur = map[y][x]; renderPalette(); return; }
  if (tool === 'place') { if (selPlace < 0) { log('명소를 먼저 고르세요', false); return; } push(); places[selPlace].tx = x + L.ox; places[selPlace].ty = y + L.oy; renderPlaces(); changed(); return; }
  push();
  if (tool === 'fill') { fill(x, y, cur); changed(); return; }
  painting = true; if (setCell(x, y, cur)) changed(true);
};
cv.onmousemove = (e) => { if (!painting) return; const [x, y] = cellAt(e); if (map[y] && x >= 0 && x < map[y].length && setCell(x, y, cur)) changed(true); };
addEventListener('mouseup', () => { if (painting) { painting = false; changed(); } });

let tmr = 0;
function changed(fast) {
  dirty = true; draw();
  if (fast) return;
  clearTimeout(tmr); tmr = setTimeout(runCheck, 250);
}
async function runCheck() {
  const r = await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: L.game, id: L.id, map, places }) });
  showReport(await r.json());
}
function showReport(rep) {
  if (rep.error) { $('#report').innerHTML = '<div class="bad">' + esc(rep.error) + '</div>'; $('#badge').className = 'bad'; $('#badge').textContent = '검사 실패'; return; }
  const errs = rep.errors || [];
  const t = rep.tally || {};
  let h = errs.length ? '<div class="bad">오류 ' + errs.length + ' — 저장이 막힌다<br>' + errs.slice(0, 12).map(esc).join('<br>') + '</div>' : '<div class="ok">validate() 통과</div>';
  h += '<div class="' + (rep.islands === 1 ? 'ok' : 'warn') + '">길 덩어리 ' + rep.islands + (rep.islands === 1 ? ' — 하나로 이어짐' : ' — 끊겼다(게임 진단 "길이 하나로 이어진다"가 실패한다)') + '</div>';
  h += '<div class="muted">' + Object.entries(t).map(([k, v]) => esc(k) + ' ' + v).join(' · ') + '</div>';
  $('#report').innerHTML = h;
  $('#badge').className = errs.length ? 'bad' : rep.islands === 1 ? 'ok' : 'warn';
  $('#badge').textContent = errs.length ? '오류 ' + errs.length : rep.islands === 1 ? '성함' : '길 끊김';
}

function setTool(t) { tool = t; ['Paint', 'Fill', 'Pick', 'Place'].forEach((n) => $('#t' + n).classList.toggle('on', t === n.toLowerCase())); }
$('#tPaint').onclick = () => setTool('paint'); $('#tFill').onclick = () => setTool('fill');
$('#tPick').onclick = () => setTool('pick'); $('#tPlace').onclick = () => setTool('place');
$('#addCol').onclick = () => { push(); map = map.map((r) => r + r[r.length - 1]); changed(); };
$('#delCol').onclick = () => { if (map[0].length < 2) return; push(); map = map.map((r) => r.slice(0, -1)); changed(); };
$('#addRow').onclick = () => { push(); map.push(map[map.length - 1]); changed(); };
$('#delRow').onclick = () => { if (map.length < 2) return; push(); map.pop(); changed(); };
$('#addPlace').onclick = () => {
  const id = prompt('새 명소 id(영문 소문자, 한번 정하면 바꾸지 않는다)'); if (!id || !/^[a-z][a-z0-9_]*$/.test(id)) return;
  if (places.some((p) => p.id === id)) { alert('이미 있는 id'); return; }
  push(); places.push({ id, name: id, tx: 0, ty: 0 }); selPlace = places.length - 1; renderPlaces(); changed(); setTool('place');
};
function doUndo() { const s = undo.pop(); if (!s) return; map = s.map; places = s.places; renderPlaces(); changed(); }
$('#btnUndo').onclick = doUndo;
addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); doUndo(); }
  if (e.key === 'F6') { e.preventDefault(); playHere(); }
});
/* ▶ 여기서 — 실행 창을 이 칸 한가운데(월드 미터 = 격자 × 48 + 24, land.js places 와 같은 셈)에서 연다.
   x·y 는 화면 칸(0..w-1). 안 주면 고른 명소, 그것도 없으면 보이는 화면 가운데 칸 */
function playHere(x, y) {
  if (!L || !window.SagaPlay) return;
  if (x == null && selPlace >= 0 && places[selPlace]) { x = places[selPlace].tx - L.ox; y = places[selPlace].ty - L.oy; }
  if (x == null) {
    const c = $('#center').getBoundingClientRect(), v = cv.getBoundingClientRect();
    x = Math.floor((c.left + c.width / 2 - v.left) / CELL); y = Math.floor((c.top + c.height / 2 - v.top) / CELL);
  }
  x = Math.max(0, Math.min(map[0].length - 1, x)); y = Math.max(0, Math.min(map.length - 1, y));
  const e = L.legend[map[y][x]];
  if (e && (e.kind === 'water' || e.kind === 'mount') && !e.mark) log('물·산 칸에서 시작하면 갇힐 수 있다(' + (x + L.ox) + ',' + (y + L.oy) + ')', false);
  if (dirty) log('저장 안 한 지도는 실행 창에 안 나온다(게임은 파일을 읽는다) — 저장 먼저', false);
  SagaPlay.open(L.game, { x: (x + L.ox) * 48 + 24, y: (y + L.oy) * 48 + 24 });
}
$('#bPlayHere').onclick = () => playHere();
$('#btnReload').onclick = async () => { if (dirty && !confirm('저장 안 한 변경을 버릴까요?')) return; const i = +$('#landSel').value; await load(); $('#landSel').value = i; pick(i); };
$('#landSel').onchange = (e) => { if (dirty && !confirm('저장 안 한 변경을 버릴까요?')) { e.target.value = lands.indexOf(L); return; } pick(+e.target.value); };
$('#btnSave').onclick = async () => {
  const r = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: L.game, id: L.id, map, places, hash }) });
  const out = await r.json();
  if (out.error) { log(out.error, false); if (out.report) showReport(out.report); alert(out.error); return; }
  hash = out.hash; dirty = false; draw(); showReport(out.report);
  log(L.game + '/js/land.js ' + (out.unchanged ? '바뀐 것 없음(안 씀)' : '저장') + (out.sw && out.sw.version ? ' · sw.js ' + out.sw.version : '') + (out.report.islands !== 1 ? ' (길 끊김 경고)' : ''), true);
  if (!out.unchanged && window.SagaPlay) SagaPlay.reloadIfOpen();
};
addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
load();
</script>
<script src="/play-panel.js"></script>
<script>SagaPlay.mount(document.getElementById('playMount'), () => (L ? L.game : null));</script>
</body>
</html>
