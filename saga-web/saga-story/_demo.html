<!--
  스크린샷용 데모 상태 — "며칠 사냥한 뒤" 를 재현한다. 게임 코드는 건드리지 않는다.

  장면(해시)
    #camp   쉬는 중(사냥터 고르기)   #hunt  사냥 중
    #boss   보스 앞                  #field 사냥터 시트
    #dex    도감                     #log   기록
    #crit   전투 연출(급소·넉백·넘어가는 몸) — 정지 화면으로 볼 유일한 수단
    #gorge  호로곡(넷째 사냥터) — 불타는 골짜기
    #town   신야성 — 마을 사람 대화창(PLAN 16절)

  이 파일은 index.html 과 **같은 스크립트 목록**을 써야 한다. 하나가 어긋나면
  화면이 통째로 죽는다 (사가만리에서 실제로 그렇게 오래 죽어 있었다).
-->
<!-- 3D 바탕(index.html 과 같은 자리) — 이게 없으면 side-view3d.js 가 조용히
     2D 로 남는다(init(null)). 데모로 3D 화면을 확인하려면 이 태그가 있어야 한다 -->

<script>
/* 세이브 보호 — 루프가 주기적으로 persist() 한다. 데모 상태로 덮이지 않게 막는다. */
DG.core.persist = function () {};

/* 데모에서 터진 예외는 제목과 화면에 남긴다 (스크린샷만 보면 죽은 걸 모른다) */
window.addEventListener('error', function (e) {
  var msg = e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno;
  document.title = 'DEMO ERROR: ' + msg;
  var box = document.getElementById('demo-err');
  if (!box) {
    box = document.createElement('div');
    box.id = 'demo-err';
    box.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:9999;padding:8px 10px;' +
      'background:#5b1414;color:#ffd9d9;border:1px solid #ff8f8f;border-radius:10px;' +
      'font:600 12px ui-monospace,Consolas,monospace;white-space:pre-wrap';
    document.body.appendChild(box);
  }
  box.textContent = '⚠️ ' + msg;
});
</script>
<script>
setTimeout(function () {
  var C = DG.core, S = DG.side;

  var party = ['kr_yisunsin', 'sg_zhaoyun', 'kr_ganggamchan'];
  party.forEach(function (id) { C.save.dex.heroes[id] = { count: 1, firstAt: Date.now() }; });
  C.save.party = party.slice();
  C.save.heroes = {
    kr_yisunsin: { lv: 14, exp: 20, rank: 1 },
    sg_zhaoyun: { lv: 9, exp: 5, rank: 0 },
    kr_ganggamchan: { lv: 7, exp: 2, rank: 0 }
  };
  C.save.player.level = 12;
  C.save.player.gold = 2840;
  C.save.player.featTotal = 900;
  C.save.side = { stage: 'field', potions: 6, kills: 412, deaths: 3,
                  best: 'forest', bosses: 5, bossAt: {} };

  C.save.log = [];
  C.log('👺 황건 두목 을(를) 잡았다! · 🪙 640 · 🧪 +3 (15분 뒤 다시 나온다)', 'good');
  C.log('공적 +23 (토벌)', 'feat');
  C.log('🏃 허창 들판 에 들어섰다 — 안쪽에 황건 두목 이(가) 있다', 'info');
  C.log('레벨 업! Lv.12', 'level');

  C.emit('changed');
  document.getElementById('sheet').style.transition = 'none';
  document.getElementById('dock').style.transition = 'none';

  var hash = location.hash.replace('#', '');
  var tab = hash.split('-')[0];

  if (tab === 'gorge') {
    /* 넷째 사냥터 — 불타는 골짜기. 배경 겹 넷이 다 보이는 자리에 세운다 */
    C.save.player.level = 46;
    C.save.job = 'marshal';
    DG.jobData.skillsOf('marshal').forEach(function (sk) {
      if (sk.max) { C.save.skills[sk.key] = sk.max; }
    });
    S.enter('gorge');
    var rg = S.raw();
    if (rg) {
      rg.player.x = 980;
      rg.player.invuln = 9999;
      S.update(0.016);
    }
  }
  else if (tab === 'hunt' || tab === 'boss') {
    S.enter('field');
    var run = S.raw();
    if (tab === 'boss' && run && run.boss) {
      /* 보스 앞에 세운다 — 체력을 조금 깎아 두어야 바가 읽힌다 */
      run.boss.hp = Math.round(run.boss.hpMax * 0.62);
      run.player.x = run.boss.x - 110;
      run.player.facing = 1;
      run.player.invuln = 9999;
      /* 카메라가 따라붙도록 한 프레임 굴린다 */
      S.update(0.016);
    }
  }
  else if (tab === 'crit') {
    /* 전투 연출 — 정지 화면으로 볼 수 있는 유일한 수단이다.
       급소 숫자 · 넉백 · 넘어가는 몸 · 흔들림을 한 장면에 세운다.
       손잡이를 여기서만 못 박는다(데모는 세이브에 남기지 않는다). */
    C.setTune('crit.rate', 1);
    S.enter('field');
    var r2 = S.raw();
    if (r2) {
      var pp = r2.player;
      pp.x = 300; pp.y = r2.stage.floor - S.P_H; pp.onGround = true;
      pp.facing = 1; pp.invuln = 9999;
      r2.mp = r2.mpMax;
      r2.enemies = r2.enemies.slice(0, 3);
      r2.enemies.forEach(function (e, i) {
        e.x = pp.x + 40 + i * 42;
        e.y = pp.y;
        e.homeY = pp.y + e.h;
        e.hp = e.hpMax = i === 0 ? 1 : 99999;      // 첫 하나는 이 한 대에 넘어간다
        e.cd = 99;
      });
      S.castSkill(1);              // 횡소 — 주위를 쓸어 세 마리를 한 번에 친다
      S.update(0.016);
    }
    C.setTune('crit.rate', null);
  }
  else if (tab === 'town') {
    /* 마을 사람 대화(PLAN 16절) — 신야성에 들어가 첫 마을 사람 앞에 세우고 말을 건다 */
    S.enter('sinya');
    var rt = S.raw();
    if (rt && rt.npcs.length) {
      var npc0 = rt.npcs[0];
      rt.player.x = npc0.x - S.P_W / 2;
      rt.player.invuln = 9999;
      S.talk(npc0);
      S.update(0.016);
    }
  }
  else if (tab === 'herodetail') {
    /* 초상 렌더 검증용 — 임의 인물 하나를 강제로 상세 화면에 띄운다 */
    DG.ui.openDetail('hero', 'sg_guanyu');
  }
  else if (['field', 'dex', 'log'].indexOf(tab) >= 0) { DG.ui.openSheet(tab); }
}, 350);
</script>
