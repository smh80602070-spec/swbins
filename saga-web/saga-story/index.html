<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* 주소창에서 파일 이름을 지운다 — /xxx/index.html → /xxx/ */
try{if(location.protocol!=='file:'&&/\/index\.html$/.test(location.pathname))history.replaceState(null,'',location.pathname.replace(/index\.html$/,'')+location.search+location.hash);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12141a">
<title>사가스토리 — 뛰고 썬다</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="사가스토리">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- 본영 배경 — #stage 캔버스보다 먼저 그려 둔다. 쉬는 중(camp 안내)에는 캔버스가
     투명하게 비워져 이 배경이 비친다. 반드시 #stage 보다 앞줄에 있어야 한다 —
     뒤로 가면 z-index 가 같은 #stage 를 오히려 덮어 사냥 중 화면이 안 보인다 -->
<div id="camp-bg"></div>

<!-- 사냥터 (전체화면) — 3D 바탕(stage3d) 위에 2D 조작·오버레이(stage)가 겹친다 -->
<canvas id="stage3d"></canvas>
<canvas id="stage"></canvas>
<div id="vignette"></div>

<!-- 사냥 화면을 크게 보기 — #top 밖에 따로 둔다. 도구줄을 감췄을 때도 이 단추만은
     남아 있어야 다시 불러올 수 있다(사가고 UI와 같은 결) -->
<button class="icon-btn" id="btn-focus" title="사냥 화면을 크게 봅니다 (도구줄 감추기)"><span data-icon="expand">⛶</span></button>

<!-- 상단: 프로필 · 재화 · 도구 (사가고 UI와 같은 결 — 넓은 화면에서는 다 펼치고,
     좁은 화면에서만 ⋯ 뒤로 접는다) -->
<div id="top">
  <div class="glass profile" id="profile"></div>
  <div class="tools">
    <button class="icon-btn" id="btn-map" title="오버월드 전체 지도 (M)"><span data-icon="map">🗺️</span></button>
    <button class="icon-btn" id="btn-auto" title="자동 사냥 (대신 뛰고 벤다)"><span data-icon="bot">🤖</span></button>
    <!-- 좁은 화면에서만 접힌다. 넓은 화면에서는 서랍이 `display:contents` 로
         풀려 아래 단추들이 이 줄에 그대로 늘어선다(사가고 UI와 같은 결) -->
    <div class="tools-drawer" id="tools-drawer">
      <button class="icon-btn" id="btn-3d" title="3D 바탕 (실험)"><span data-icon="box">🧊</span></button>
      <button class="icon-btn" id="btn-sound" title="소리 (첫 눌림에서 깨어납니다)">🔊</button>
      <button class="icon-btn" id="btn-help" title="도움말"><span data-icon="circle-question-mark">❔</span></button>
      <a class="icon-btn" id="btn-admin" href="_admin.html" target="_blank" rel="noopener" title="어드민 (QA · 손잡이)"><span data-icon="wrench">🛠️</span></a>
      <button class="icon-btn" id="btn-reset" title="처음부터"><span data-icon="rotate-ccw">↺</span></button>
    </div>
    <button class="icon-btn" id="btn-more" title="도구 더 보기" aria-expanded="false"><span data-icon="ellipsis">⋯</span></button>
  </div>
  <div class="glass wallet" id="wallet"></div>
  <!-- 목표판(PLAN §5-6) — 추적 사명·이번 접속 목표·다음 예고 3줄 -->
  <div class="glass goals" id="goalboard"></div>
</div>

<!-- 자동 상태 -->
<div id="autobar"></div>

<!-- 가운데: 쉬는 중(사냥터 고르기) — 평소엔 곧장 사냥터로 들어가 안 뜬다.
     동행이 없을 때만(도감에서 인물을 고르라는 안내) 나온다 -->
<div id="camp"></div>

<!-- 아래: 사냥 중 조작 띠 -->
<div id="hud"></div>

<!-- 마을 사람 대화(PLAN 16절) — #hud 위에 뜬다. ↑ 를 다시 누르거나 닫는다 버튼,
     자리를 뜨면 저절로 닫힌다(side.js closeTalk 참고) -->
<div id="talkbox"></div>

<!-- 손가락 조작판 — 손가락뿐인 기기(hover:none · pointer:coarse)에서만 css 로 보인다.
     화면 전체를 숨은 넷으로 나눠 짚던 것 대신, 사가고 UI처럼 실제로 보이는 유리(glass)
     단추를 준다. 왼쪽 좌우 이동 · 오른쪽 위(점프·오르기·문)·아래(내려가기·앉기) -->
<div id="touchpad">
  <div class="pad-side pad-l">
    <button class="pad-btn" data-dir="left" aria-label="왼쪽으로 뛴다">◀</button>
    <button class="pad-btn" data-dir="right" aria-label="오른쪽으로 뛴다">▶</button>
  </div>
  <div class="pad-side pad-r">
    <button class="pad-btn" data-dir="up" aria-label="점프 · 오르기 · 문">▲</button>
    <button class="pad-btn" data-dir="down" aria-label="내려가기 · 앉기">▼</button>
  </div>
</div>

<!-- 우하단: 액션 독 (사가고 UI와 같은 결 — 접지 않고 다 펼친다) -->
<nav id="dock">
  <button data-sheet="field"><span data-icon="footprints">🏃</span><small>사냥터</small></button>
  <button data-sheet="bag"><span data-icon="backpack">🎒</span><small>가방</small></button>
  <button data-sheet="job"><span data-icon="swords">🥋</span><small>무예</small></button>
  <button data-sheet="shop"><span data-icon="store">🏪</span><small>저자</small></button>
  <button data-sheet="dex"><span data-icon="book-open">📖</span><small>도감</small></button>
  <button data-sheet="log"><span data-icon="scroll-text">📜</span><small>기록</small></button>
  <button data-sheet="keys"><span data-icon="keyboard">⌨️</span><small>키설정</small></button>
  <button data-sheet="settings"><span data-icon="settings">⚙️</span><small>설정</small></button>
  <button data-sheet="story"><span>📚</span><small>이야기</small></button>
  <button data-sheet="achieve"><span data-icon="award">🏅</span><small>업적</small></button>
</nav>

<!-- 슬라이드 시트 -->
<div id="scrim"></div>
<aside id="sheet">
  <div class="sheet-head">
    <div class="grip"></div>
    <h3 id="sheet-title">사냥터</h3>
    <button class="icon-btn sm" id="sheet-close"><span data-icon="x">✕</span></button>
  </div>
  <div id="sheet-body"></div>
</aside>

<div id="encounter"></div><div id="detail"></div><div id="owmap"></div>
<div id="toast"></div>

<script src="js/side-view.js"></script>
<!-- 로딩 최적화(PLAN 27절) — 716KB짜리 이 파일 하나가 뒤의 모든 스크립트를 순서대로
     막아 세우던 것을 async 로 풀었다. 대부분은 이래도 game.js 의 boot()(DOMContentLoaded
     대기)보다 먼저 끝나 그대로 3D 로 뜨고, 느린 회선에서 늦게 도착하면 게임은 이미
     2D 로 켜진 채 기다리다가 이 onload 가 game.retry3d() 로 한 번 더 켠다 -->
<script id="vendor-three" src="js/vendor/three.iife.js" async
  onload="window.DG&amp;&amp;window.DG.game&amp;&amp;window.DG.game.retry3d&amp;&amp;window.DG.game.retry3d();"></script>
<script src="js/toon3d-core.js"></script>

<script>
/* 서비스 워커 — https · localhost 에서만 등록된다.
   파일을 늘리거나 고쳤으면 sw.js 의 VERSION 도 같이 올릴 것. */
(function () {
  if (!('serviceWorker' in navigator)) { return; }
  var h = location.hostname;
  var secure = location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1';
  if (!secure) { return; }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')['catch'](function (e) {
      console.warn('서비스 워커 등록 실패', e);
    });
  });
})();
</script>
