<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><title>소리 점검</title></head>
<body>
<div id="report">…</div>
<script>window.DG_NO_DRAW = true; window.DG_NO_ACCOUNT = true;</script>
<script src="js/data.js"></script>
<script src="js/data-enemy.js"></script>
<script src="js/data-side.js"></script>
<script src="js/data-gear.js"></script>
<script src="js/data-unique.js"></script>
<script src="js/data-job.js"></script>
<script src="js/data-quest.js"></script>
<script src="js/core.js"></script>
<script src="js/sfx.js"></script>
<script>
/* 소리가 **실제로 나는지**는 자가진단(`_test.html`)으로 못 본다 — 진단은 아무것도
   누르지 않아 브라우저가 소리를 늘 잠가 두기 때문이다(그 규칙이 맞다).
   그래서 여기서 `unlock()` 을 스스로 부르고 소리표를 하나씩 내 본다.
   사가나락의 같은 이름 파일과 같은 결이다.
     chrome --headless=new --disable-gpu --dump-dom …/_sfxcheck.html  →  SFX unlock=true · 낸 소리 n/n */
(function () {
  var S = DG.sfx, errs = [], keys = Object.keys(S.CUES), i = 0, played = 0;
  window.addEventListener('error', function (e) { errs.push(e.message); });
  var ok = S.unlock();
  function step() {
    if (i >= keys.length) {
      var msg = 'unlock=' + ok + ' · 낸 소리 ' + played + '/' + keys.length +
        ' · 예외 ' + errs.length + (errs.length ? ' :: ' + errs.join(' | ') : '');
      document.getElementById('report').textContent = msg;
      document.title = 'SFX ' + msg;
      return;
    }
    S._clear();
    try { if (S.play(keys[i])) { played++; } }
    catch (e) { errs.push(keys[i] + ': ' + e.message); }
    i++;
    setTimeout(step, 800);
  }
  step();
})();
</script>
</body>
</html>
