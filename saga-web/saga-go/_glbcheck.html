<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLB 점검</title>
<style>
  html, body { margin: 0; background: #101418; color: #e8e8e8; font: 14px/1.5 -apple-system, sans-serif; }
  #log { white-space: pre-wrap; padding: 10px 12px; word-break: break-all; }
  .ok   { color: #6ee08a; }
  .bad  { color: #ff6b6b; }
  .warn { color: #ffcf5c; }
  h1 { font-size: 16px; margin: 10px 12px 4px; }
  canvas { display: block; width: 100%; height: 46vh; background: #333; }
  #picker { padding: 6px 12px; }
  #picker button { margin-right: 6px; padding: 6px 10px; }
</style>
</head>
<body>
<h1>사가만리 — 인물 GLB 실기기 점검</h1>
<div id="verdict" style="font-size:20px;font-weight:bold;padding:10px 12px;">확인 중…</div>
<div id="rawwrap" style="padding:0 12px 8px;">
  <div style="font-size:12px;opacity:.7;">원본 텍스처(3D 없이, 사진으로만) —</div>
  <canvas id="raw" style="width:100%;max-width:400px;height:auto;background:repeating-conic-gradient(#444 0% 25%, #333 0% 50%) 0 0/20px 20px;display:block;"></canvas>
</div>
<div id="picker"></div>
<canvas id="c"></canvas>
<div id="log"></div>

<script src="js/vendor/three.iife.js"></script>
<script>
(function () {
  'use strict';
  var T = window.THREE;
  var logEl = document.getElementById('log');
  var verdictEl = document.getElementById('verdict');
  function verdict(msg, color) {
    verdictEl.textContent = msg;
    verdictEl.style.color = color;
  }
  function line(msg, cls) {
    var d = document.createElement('div');
    if (cls) { d.className = cls; }
    d.textContent = msg;
    logEl.appendChild(d);
    console.log(msg);
  }
  window.onerror = function (msg, src, ln, col, err) {
    line('window.onerror: ' + msg + ' @' + ln + ':' + col + (err && err.stack ? '\n' + err.stack : ''), 'bad');
  };
  window.addEventListener('unhandledrejection', function (e) {
    line('unhandledrejection: ' + (e.reason && (e.reason.message || e.reason)) , 'bad');
  });

  line('UA: ' + navigator.userAgent);
  line('THREE 로드: ' + (T ? 'OK' : '실패'), T ? 'ok' : 'bad');
  if (!T) { return; }
  line('THREE.REVISION: ' + T.REVISION);
  line('GLTFLoader: ' + (T.GLTFLoader ? 'OK' : '없음'), T.GLTFLoader ? 'ok' : 'bad');
  line('SkeletonUtils: ' + (T.SkeletonUtils ? 'OK' : '없음'), T.SkeletonUtils ? 'ok' : 'bad');

  var renderer;
  try {
    renderer = new T.WebGLRenderer({ antialias: true });
    var gl = renderer.getContext();
    line('WebGL: OK (context ' + (gl instanceof WebGL2RenderingContext ? 'WebGL2' : 'WebGL1') + ')', 'ok');
    var dbg = gl.getExtension('WEBGL_debug_renderer_info');
    if (dbg) {
      line('GPU: ' + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
      line('Vendor: ' + gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL));
    }
    line('MAX_TEXTURE_SIZE: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE));
    line('devicePixelRatio: ' + window.devicePixelRatio);
  } catch (e) {
    line('WebGL 렌더러 생성 실패: ' + e.message, 'bad');
    return;
  }

  var canvas = document.getElementById('c');
  var w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  renderer.outputColorSpace = T.SRGBColorSpace;
  canvas.replaceWith(renderer.domElement);
  renderer.domElement.id = 'c';

  var scene = new T.Scene();
  scene.background = new T.Color(0x222833);
  var camera = new T.PerspectiveCamera(45, w / h, 0.05, 50);
  camera.position.set(0, 1.1, 2.4);
  camera.lookAt(0, 0.9, 0);

  var hemi = new T.HemisphereLight(0x6e8ab5, 0x565f70, 1.6);
  scene.add(hemi);
  var sun = new T.DirectionalLight(0xd0dcf5, 1.9);
  sun.position.set(-2, 3, 1);
  scene.add(sun);

  var current = null;
  function clearCurrent() { if (current) { scene.remove(current); current = null; } }

  function animate() {
    requestAnimationFrame(animate);
    if (current) { current.rotation.y += 0.01; }
    renderer.render(scene, camera);
  }
  animate();

  var FILES = ['Warrior', 'Ranger', 'Rogue', 'Cleric', 'Wizard', 'Monk'];
  var picker = document.getElementById('picker');
  FILES.forEach(function (n) {
    var b = document.createElement('button');
    b.textContent = n;
    b.onclick = function () { test(n); };
    picker.appendChild(b);
  });

  /** 실제 게임(asset3d.js `delam`)과 같은 규칙 — 재질을 Lambert 로 벗긴다.
   *  여기서 실기기가 map(텍스처)까지 살아 있는지 색으로 바로 드러난다:
   *  맵이 없으면 물들인 단색으로, 있으면 무늬가 보인다. */
  function delam(root) {
    root.traverse(function (o) {
      if (!o.isMesh || !o.material) { return; }
      var one = Array.isArray(o.material) ? o.material : [o.material];
      var out = one.map(function (m) {
        if (!m) { return m; }
        return new T.MeshLambertMaterial({
          color: m.color ? m.color.clone() : new T.Color(0xffffff),
          map: m.map || null, vertexColors: !!m.vertexColors,
          transparent: !!m.transparent, opacity: m.opacity,
          alphaTest: m.alphaTest || 0, side: m.side
        });
      });
      o.material = Array.isArray(o.material) ? out : out[0];
    });
  }

  function reportMesh(scene3) {
    var meshes = 0, withMap = 0, withoutMap = 0, skinned = 0, matTypes = {};
    scene3.traverse(function (o) {
      if (!o.isMesh) { return; }
      meshes++;
      if (o.isSkinnedMesh) { skinned++; }
      var mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(function (m) {
        if (!m) { return; }
        matTypes[m.type] = (matTypes[m.type] || 0) + 1;
        if (m.map) {
          withMap++;
          line('  · 텍스처: ' + (m.map.image ? (m.map.image.width + 'x' + m.map.image.height) : '(image 없음)') +
            (m.map.image && m.map.image.complete === false ? ' [미완성?]' : ''));
        } else {
          withoutMap++;
        }
      });
    });
    line('메시 ' + meshes + '개 · 스킨메시 ' + skinned + '개 · 재질형 ' + JSON.stringify(matTypes));
    line('map 있는 재질 ' + withMap + ' / map 없는 재질 ' + withoutMap, withoutMap > 0 ? 'warn' : 'ok');
  }

  /** 원본 텍스처를 3D 없이 2D 캔버스에 그대로 그린다 — 디코딩 자체가 됐는지만 본다.
   *  그리고 몇 군데 픽셀을 찍어 **다 같은 색인지**(=사실상 빈 이미지)를 잰다. */
  function drawRaw(tex) {
    var rawCanvas = document.getElementById('raw');
    if (!tex || !tex.image) {
      verdict('맵(map) 자체가 없다 — GLB에 텍스처가 안 실려 있거나 파싱에서 빠졌다', '#ff6b6b');
      return;
    }
    var img = tex.image;
    var iw = img.width || img.videoWidth || 0, ih = img.height || img.videoHeight || 0;
    line('원본 이미지 크기: ' + iw + 'x' + ih);
    if (!iw || !ih) {
      verdict('이미지 크기가 0 — 디코딩 실패', '#ff6b6b');
      return;
    }
    rawCanvas.width = iw; rawCanvas.height = ih;
    var ctx = rawCanvas.getContext('2d');
    try {
      ctx.drawImage(img, 0, 0, iw, ih);
    } catch (e) {
      verdict('drawImage 실패: ' + e.message + ' — 디코딩된 이미지를 캔버스에 못 그린다', '#ff6b6b');
      return;
    }
    var data;
    try {
      data = ctx.getImageData(0, 0, iw, ih).data;
    } catch (e) {
      verdict('getImageData 실패(CORS?): ' + e.message, '#ffcf5c');
      return;
    }
    /* 25군데를 찍어 색이 얼마나 다른지 잰다 — 진짜 그림이면 픽셀마다 크게 다르다 */
    var samples = [], n = 25, i, x, y, idx;
    for (i = 0; i < n; i++) {
      x = Math.floor((i % 5) / 5 * iw + iw / 10);
      y = Math.floor(Math.floor(i / 5) / 5 * ih + ih / 10);
      idx = (y * iw + x) * 4;
      samples.push([data[idx], data[idx + 1], data[idx + 2]]);
    }
    var maxDiff = 0;
    for (i = 1; i < samples.length; i++) {
      maxDiff = Math.max(maxDiff,
        Math.abs(samples[i][0] - samples[0][0]) +
        Math.abs(samples[i][1] - samples[0][1]) +
        Math.abs(samples[i][2] - samples[0][2]));
    }
    line('25군데 표본 픽셀의 최대 색차: ' + maxDiff + ' (0~765, 진짜 그림이면 보통 200 이상)');
    if (maxDiff < 12) {
      verdict('디코딩된 이미지가 사실상 단색이다 — 텍스처 디코딩 자체가 이 기기에서 깨졌다', '#ff6b6b');
    } else {
      verdict('원본 텍스처 디코딩은 정상 — 위 사진에 무늬가 보이면, 문제는 3D(WebGL) 렌더링 쪽이다', '#6ee08a');
    }
  }

  function test(name) {
    clearCurrent();
    verdict('확인 중…', '#e8e8e8');
    var url = 'assets/models/people/quaternius_rpg/' + name + '.glb';
    line('──── ' + name + ' ────');
    var t0 = performance.now();

    fetch(url).then(function (res) {
      line('fetch 상태: ' + res.status + ' ' + res.statusText + ' · Content-Length: ' + res.headers.get('content-length'),
        res.ok ? 'ok' : 'bad');
    }).catch(function (e) {
      line('fetch 실패(네트워크): ' + e.message, 'bad');
    });

    var loader = new T.GLTFLoader();
    loader.load(url, function (gltf) {
      var dt = (performance.now() - t0).toFixed(0);
      line('GLTFLoader 성공 (' + dt + 'ms)', 'ok');
      line('애니메이션 클립: ' + gltf.animations.length + '개 — ' + gltf.animations.map(function (a) { return a.name; }).join(', '));
      reportMesh(gltf.scene);

      /* 맨 처음 map 있는 재질을 하나 찾아 원본 그림을 2D로 그려 본다(3D 렌더 전에) */
      var firstTex = null;
      gltf.scene.traverse(function (o) {
        if (firstTex || !o.isMesh || !o.material) { return; }
        var mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(function (m) { if (!firstTex && m && m.map) { firstTex = m.map; } });
      });
      drawRaw(firstTex);

      delam(gltf.scene);
      line('delam(Lambert 변환) 후:');
      reportMesh(gltf.scene);

      /* 3D 는 **원본 그대로**(물들이지 않고) 세운다 — 위 2D 원본 그림과
         공정하게 비교하려면 여기서 색을 더 씌우면 안 된다. */
      var box = new T.Box3().setFromObject(gltf.scene);
      var size = box.getSize(new T.Vector3());
      var scale = 1.6 / (size.y || 1);
      gltf.scene.scale.setScalar(scale);
      var box2 = new T.Box3().setFromObject(gltf.scene);
      gltf.scene.position.y -= box2.min.y;

      scene.add(gltf.scene);
      current = gltf.scene;
      line('3D 캔버스(아래)에 물들이지 않은 원본을 세웠다.', 'ok');
    }, function (prog) {
      if (prog.total) { line('받는 중 ' + Math.round(prog.loaded / prog.total * 100) + '%'); }
    }, function (err) {
      verdict('GLTFLoader 자체가 실패했다: ' + (err && (err.message || err.type || String(err))), '#ff6b6b');
      line('GLTFLoader 실패: ' + (err && (err.message || err.type || String(err))), 'bad');
    });
  }

  test('Warrior');
})();
</script>
</body>
</html>
