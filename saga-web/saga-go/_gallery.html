<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><title>사가만리 스프라이트 갤러리</title>
<style>
  body { margin:0; background:#14161c; color:#eef1f6; font:12px "Malgun Gothic",system-ui; }
  h3 { margin:14px 12px 6px; font-size:13px; color:#f5b445; }
  .g { display:flex; flex-wrap:wrap; gap:6px; padding:0 10px; }
  .c { text-align:center; }
  .c img { display:block; border-radius:10px; border:1px solid #333; }
  .c small { display:block; font-size:10px; color:#9aa3b2; margin-top:2px; }
</style>
</head>
<body>
<div id="out">그리는 중…</div>
<script>window.DG_NO_DRAW = true;</script>
<script src="js/errlog.js"></script>
<script src="js/data.js"></script>
<script src="js/region-kr.js"></script>
<script src="js/genchar.js"></script>
<script src="js/region-jp.js"></script>
<script src="js/genchar-jp.js"></script>
<script src="js/region-cn.js"></script>
<script src="js/genchar-cn.js"></script>
<script src="js/sprite.js"></script>
<script>
/* 스프라이트를 한 판에 늘어놓고 눈으로 확인하는 용도. 게임 로직은 안 쓴다.
     ?w=120&h=140      크기
     ?only=hero|pet    종류
     ?n=12             앞에서 n명만 */
(function () {
  var q = new URLSearchParams(location.search);
  var W = parseInt(q.get('w') || '110', 10), H = parseInt(q.get('h') || '126', 10);
  var D = DG.data, S = DG.sprite;
  var only = q.get('only');
  var n = parseInt(q.get('n') || '0', 10);

  function cell(kind, ref, tag) {
    return '<div class="c"><img src="' + S.portraitCard(kind, ref, W, H) + '" width="' + W + '" height="' + H + '">' +
      '<small>' + ref.name + (tag ? ' · ' + tag : '') + '</small></div>';
  }
  function list(arr) { return n > 0 ? arr.slice(0, n) : arr; }

  var html = '';

  if (only !== 'pet') {
    var hs = list(D.heroes);
    html += '<h3>인물 ' + hs.length + '명</h3><div class="g">';
    for (var i = 0; i < hs.length; i++) { html += cell('hero', hs[i]); }
    html += '</div>';
  }
  if (only !== 'hero') {
    var ps = list(D.pets);
    html += '<h3>펫 ' + ps.length + '종</h3><div class="g">';
    for (var j = 0; j < ps.length; j++) { html += cell('pet', ps[j]); }
    html += '</div>';
  }
  document.getElementById('out').innerHTML = html;
})();
</script>
</body></html>
