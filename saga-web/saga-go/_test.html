<script>
window.DG_NO_DRAW = true; window.DG_NO_ACCOUNT = true; window.DG_NO_TUNE = true;

/* 무작위 고정 — 진단이 굴릴 때마다 달라지면 판정이 흔들린다.
   게임 스크립트보다 **먼저** 갈아 둬야 부트에서 쓰는 난수까지 잡힌다.
   (실제 플레이는 그대로다 — 이 파일 안에서만 바꾼다)
   mulberry32: 짧고 분포가 고르며 같은 씨앗이면 같은 수열이 나온다. */
(function (seed) {
  var s = seed >>> 0;
  Math.random = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  window.DG_SEED = seed;
})(20260824);
</script>

<script>
/* 자가진단 — 헤드리스에서 게임 로직이 실제로 도는지 확인한다.
   브라우저로 직접 열어도 되고, 아래 명령으로 자동 확인해도 된다.
     chrome --headless=new --virtual-time-budget=25000 --dump-dom http://127.0.0.1:8791/_test.html
*/
(function () {
  var out = [], errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message); });

  /* 설명 글을 돌려주는 시험 중 "실패 …" 로 시작하는 글은 실패다 — 전엔 빈 글이 아니라서 PASS 로 찍혔다 */
  function t(name, fn) {
    try {
      var r = fn();
      if (typeof r === 'string' && /^실패 /.test(r)) { r = { failText: r }; }
      var ok = !!r && !r.failText, txt = typeof r === 'string' ? r : (r && r.failText) || '';
      out.push((ok ? '<span class="pass">PASS</span> ' : '<span class="fail">FAIL</span> ') + name + (txt ? ' — ' + txt : ''));
      return ok;
    } catch (e) {
      out.push('<span class="fail">FAIL</span> ' + name + ' — 예외: ' + e.message);
      return false;
    }
  }

  setTimeout(function () {
    /* 천후는 세 시간마다 바뀐다 — 진단이 돌리는 시각에 끌려다니지 않도록 하나로 고정한다.
       (씨앗을 고정한 것과 같은 이유다. 게임 코드는 그대로 두고 여기서만 갈아 끼운다) */
    DG.weather.force('clear');
    /* 적도(賊徒)도 같은 이유로 붙들어 둔다 — 칸마다 역참의 두 할이 점거되므로,
       하필 그 칸에 진단을 돌리면 보급 항목이 통째로 깨진다(토벌에서 밟은 함정).
       적도 자신을 재는 아래 항목들만 그 자리에서 잠깐 풀었다 다시 묶는다. */
    DG.rogue.force(false);

    var C = DG.core, W = DG.world, D = DG.data;
    var HR = DG.hero, NT = DG.net, AI = DG.ai;
    localStorage.removeItem(C.SAVE_KEY);   // 깨끗한 상태로 판정
    if (DG.adventure) { DG.adventure._enableForTest(false); }   // ⑲-7 — 옛 항목의 금·적 체력 값이 등급 보상·세계 배율에 안 흔들리게(그 항목만 켠다)

    /* ── 본편 뼈대 ─────────────────────────────────────── */

    t('데이터 적재', function () {
      return D.heroes.length + '명 인물 / ' + D.pets.length + '종 펫';
    });

    t('중복 id 없음', function () {
      var seen = {}, dup = [];
      D.heroes.concat(D.pets).forEach(function (e) { if (seen[e.id]) { dup.push(e.id); } seen[e.id] = 1; });
      return dup.length ? false : '고유 id ' + Object.keys(seen).length + '개';
    });

    t('이 게임에 실린 것만 실려 있다 (원작식)', function () {
      /* 던전·장비는 saga-dungeon, 문답은 saga-quiz 로 갈라져 나갔다.
         경영(영지·건설)은 saga-quiz 가 맡는다. 여기는 걷기·조우·도감만. */
      var here = ['world', 'encounter', 'auto', 'hero', 'sprite'];
      var gone = ['dungeon', 'dungeonView', 'item', 'itemData', 'enemyData', 'quiz', 'quizData',
                  'battle', 'prestige', 'idle', 'territory', 'build'];
      var missing = here.filter(function (k) { return !DG[k]; });
      var leaked = gone.filter(function (k) { return !!DG[k]; });
      return missing.length === 0 && leaked.length === 0 &&
        ('실린 것 ' + here.length + '개 · 없는 것 ' + gone.length + '개');
    });

    t('경영은 완전히 제거됐다 (세이브·효과·구역 이름)', function () {
      var fresh = !C.save.territory && !C.save.build;          // 기본 세이브에 골격이 없다
      var noRegionCount = typeof C.regionCount === 'undefined'; // core 의 영지 집계도 없다
      var name = W.regionName('3,4');                          // 구역 이름은 world 가 자체 보유
      var stable = name === W.regionName('3,4') && name.length > 0;
      var eff = C.effect();                                    // 건설 효과 키가 남아 있지 않다
      var noProd = !eff['gold/min'] && !eff['fame/min'];
      return fresh && noRegionCount && stable && noProd &&
        ('세이브·집계·건설효과 없음 · 구역 이름 "' + name + '" 유지');
    });

    t('구역 이름 30개가 다 나온다 (hash2 반쪽 범위 보정)', function () {
      /* core.hash2 는 0~0.5 만 돌려준다 — regionName 이 그걸 그냥 쓰면
         REGION_NAMES 뒤 절반(한양·경주·전주 등 15개)이 영영 안 뽑힌다
         (2026-09-07 발견·고침, h01 로 두 배로 편다). 넓게 표본을 뽑아
         뒤 절반에서만 나오는 이름이 실제로 뜨는지로 확인한다. */
      var seen = {}, rx, ry;
      for (rx = -30; rx <= 30; rx++) {
        for (ry = -30; ry <= 30; ry++) {
          seen[W.regionName(rx + ',' + ry)] = true;
        }
      }
      var backHalf = ['한양', '경주', '전주', '충주'];
      var found = backHalf.filter(function (n) { return seen[n]; });
      var total = Object.keys(seen).length;
      return found.length === backHalf.length && total >= 25 &&
        ('표본 ' + total + '종 · 뒤 절반 이름 확인: ' + found.join('·'));
    });

    t('스폰 생성', function () {
      W.update(0.016);
      return W.spawns.length > 0 && W.spawns.length + '개 배치';
    });

    t('지형 결정성(같은 좌표=같은 지형)', function () {
      return W.terrainAt(3, 7) === W.terrainAt(3, 7) && W.terrainAt(3, 7);
    });

    /* ── 조우 (등용 · 포획) ────────────────────────────── */

    t('등용 성공 → 도감·동행·공적·동행 경험치·금', function () {
      C.save.items.scroll = 9; C.save.player.fame = 999;
      var gold0 = C.save.player.gold;
      // 먼저 한 명을 동행에 앉혀 두고, 새 인물을 등용하면 경험치가 흐르는지 본다
      var senior = D.heroes[5];
      C.save.dex.heroes[senior.id] = { count: 1, firstAt: Date.now() };
      C.save.heroes[senior.id] = { lv: 1, exp: 0, rank: 0 };
      C.save.party = [senior.id];
      var hero = D.heroes[0];
      var sp = { uid: 99991, kind: 'hero', ref: hero, x: 0, y: 0, bornAt: Date.now() };
      W.spawns.push(sp);
      DG.encounter.open(sp);
      for (var i = 0; i < 4; i++) {
        var btn = document.querySelector('[data-appeal="' + hero.trait + '"]');
        if (!btn) { break; }
        btn.click();
      }
      DG.encounter.close();
      var g = HR.info(senior.id);
      var goldGain = C.save.player.gold - gold0;
      return !!C.save.dex.heroes[hero.id] && C.save.party.indexOf(hero.id) >= 0 &&
        C.save.player.featTotal > 0 && (g.exp > 0 || g.lv > 1) &&
        goldGain === hero.rarity * 15 &&
        ('공적 누적 ' + C.save.player.featTotal + ' · 동행 경험치 ' + g.exp + ' · 금 +' + goldGain);
    });

    t('포획 시도 → 사료 소모·종료 (성공 시 명성·금)', function () {
      C.save.items.feed = 5;
      var fame0 = C.save.player.fame, gold0 = C.save.player.gold;
      var pets0 = Object.keys(C.save.dex.pets).length;
      var pet = D.pets[D.pets.length - 1];
      var sp = { uid: 99992, kind: 'pet', ref: pet, x: 0, y: 0, bornAt: Date.now() };
      W.spawns.push(sp);
      DG.encounter.open(sp);
      var before = C.save.items.feed;
      document.querySelector('[data-act="throw"]').click();
      var after = C.save.items.feed;
      var caught = Object.keys(C.save.dex.pets).length > pets0;
      DG.encounter.close();
      var fameOk = caught ? C.save.player.fame > fame0 : true;
      var goldGain = C.save.player.gold - gold0;
      var goldOk = caught ? goldGain === pet.rarity * 10 : goldGain === 0;
      return after === before - 1 && fameOk && goldOk &&
        ('사료 ' + before + '→' + after + (caught ? ' · 포획 성공(명성·금 +' + goldGain + ')' : ' · 놓침'));
    });

    /* ── 걷기 보급 ─────────────────────────────────────── */

    t('걷기 보급 — 250m 마다 사료·명성·금, 500m 마다 등용서', function () {
      var p = C.save.player;
      p.distance = 1000; p.supplyMark = 1000; p.supplyCount = 0;
      var feed0 = C.save.items.feed, scroll0 = C.save.items.scroll, fame0 = p.fame, gold0 = p.gold;
      p.distance += DG.game.SUPPLY_STEP * 2;         // 500m 걸었다
      DG.game.tickSupply();
      return C.save.items.feed === feed0 + 2 && C.save.items.scroll === scroll0 + 1 &&
        p.fame === fame0 + 20 && p.gold === gold0 + 16 && p.supplyMark === p.distance &&
        ('🍖 +2 · 📜 +1 · 🎖️ +20 · 🪙 +16');
    });

    t('보급 기준점은 거리보다 앞서지 않는다 (리셋 보호)', function () {
      var p = C.save.player;
      p.supplyMark = p.distance + 9999;
      DG.game.tickSupply();
      return p.supplyMark <= p.distance && '기준점 보정 확인';
    });

    /* ── 역참(驛站) — 원작의 보급 거점 ─────────────────── */

    t('역참 자리는 늘 같다 (좌표 해시)', function () {
      var a = DG.world.stationsIn(3, -2), b = DG.world.stationsIn(3, -2);
      var ok = a.length === 2 && a.length === b.length;
      for (var i = 0; ok && i < a.length; i++) {
        ok = a[i].key === b[i].key && a[i].x === b[i].x && a[i].y === b[i].y;
      }
      return ok && ('구역당 ' + a.length + '곳 · 두 번 물어도 같은 자리');
    });

    t('역참이 구역 한쪽에 몰리지 않는다 (hash2 0~0.5 함정)', function () {
      /* 이 판의 core.hash2 는 0~0.5 만 돌려준다. 그대로 쓰면 역참이 구역의
         왼쪽 위 사분면에만 선다 — world.js 가 두 배로 펴서 쓰는지 여기서 못박는다. */
      var R = DG.world.REGION_SIZE, maxU = 0, maxV = 0;
      for (var rx = -6; rx <= 6; rx++) {
        for (var ry = -6; ry <= 6; ry++) {
          var list = DG.world.stationsIn(rx, ry);
          for (var i = 0; i < list.length; i++) {
            var u = list[i].x / R - rx, v = list[i].y / R - ry;
            if (u > maxU) { maxU = u; }
            if (v > maxV) { maxV = v; }
          }
        }
      }
      return maxU > 0.6 && maxV > 0.6 &&
        ('구역 안 최대 위치 ' + maxU.toFixed(2) + ' · ' + maxV.toFixed(2) + ' (0.6 넘어야 정상)');
    });

    t('역참에 들르면 등용서·사료·금·경험치를 받는다', function () {
      C.save.stations = {};
      var st = DG.world.stationsIn(0, 0)[0];
      var s0 = C.save.items.scroll, f0 = C.save.items.feed, g0 = C.save.player.gold;
      var visits0 = C.save.player.stationVisits || 0;
      var r = DG.station.visit(st);
      return r.ok &&
        C.save.items.scroll === s0 + r.reward.scroll &&
        C.save.items.feed === f0 + r.reward.feed &&
        C.save.player.gold === g0 + r.reward.gold &&
        C.save.player.stationVisits === visits0 + 1 &&
        ('📜 +' + r.reward.scroll + ' · 🍖 +' + r.reward.feed + ' · 🪙 +' + r.reward.gold);
    });

    t('한 번 들른 역참은 쉬는 중 — 다시 줘도 아무것도 안 준다', function () {
      var st = DG.world.stationsIn(0, 0)[0];
      var s0 = C.save.items.scroll, g0 = C.save.player.gold;
      var r = DG.station.visit(st);
      var stt = DG.station.stateOf(st.key);
      return !r.ok && r.reason === 'cooldown' && !stt.ready &&
        C.save.items.scroll === s0 && C.save.player.gold === g0 &&
        ('남은 시간 ' + DG.station.leftLabel(stt.left));
    });

    t('쉬는 시간이 지나면 다시 찬다', function () {
      var st = DG.world.stationsIn(0, 0)[0];
      C.save.stations[st.key] = Date.now() - DG.station.COOLDOWN - 1000;
      var ready = DG.station.stateOf(st.key).ready;
      var r = DG.station.visit(st);
      return ready && r.ok && ('다시 참 · 📜 +' + r.reward.scroll);
    });

    t('다 쉰 역참 기록은 세이브에서 지워진다 (키가 무한히 쌓이지 않게)', function () {
      var st = DG.world.stationsIn(5, 5)[0];
      C.save.stations[st.key] = Date.now() - DG.station.COOLDOWN - 1000;
      DG.station.stateOf(st.key);
      return C.save.stations[st.key] === undefined && '만료 항목 정리 확인';
    });

    t('자동 순행이 채워진 역참으로 걸어가 들른다', function () {
      C.save.stations = {};
      DG.auto.state().on = true; DG.auto.state().stop = true; DG.auto.state().story = false;   // 📖 이야기가 먼저 잡으면 역참을 안 본다

    /* ── 토벌(討伐) — 원작의 레이드 ────────────────────── */

    /**
     * 적장이 든 시간 칸을 찾는다.
     * **칸의 첫머리부터** 봐야 한다 — 적장은 칸이 열리고 45분만 머무는데,
     * `Date.now() + i*SLOT` 으로 훑으면 '지금이 몇 분인지'가 그대로 따라와서
     * 45분이 지난 시각에 진단을 돌리면 한 칸도 못 찾는다(실제로 그렇게 깨졌다).
     */
    function findRaid(f) {
      var R = DG.raid;
      var base = Math.floor(Date.now() / R.SLOT_MS) * R.SLOT_MS;
      for (var i = 0; i < 400; i++) {
        var ms = base + i * R.SLOT_MS + 60000;      // 칸이 열리고 1분 뒤
        var rd = R.at(f, ms);
        if (rd) { return { raid: rd, ms: ms }; }
      }
      return null;
    }

    t('적장은 드물게 들고, 마흔다섯 분이면 물러간다', function () {
      var R = DG.raid;
      var f = DG.world.fortsNear()[0];
      if (!f) { return false; }
      var found0 = findRaid(f);
      if (!found0) { return '400칸 안에 한 번도 안 든다' && false; }
      var start = Math.floor(found0.ms / R.SLOT_MS) * R.SLOT_MS;
      var inside = R.at(f, start + R.STAY_MS - 1000);
      var outside = R.at(f, start + R.STAY_MS + 1000);
      return inside && !outside &&
        ('든 칸에서 44분엔 있고 46분엔 없다 · ' + inside.tier.name);
    });

    t('같은 성채·같은 시간 칸이면 늘 같은 적장이다', function () {
      var R = DG.raid;
      var f = DG.world.fortsNear()[0];
      var fr = findRaid(f);
      if (!fr) { return false; }
      var a = fr.raid, b = R.at(f, fr.ms);
      return a && b && a.hero.id === b.hero.id && a.tier.tier === b.tier.tier &&
        a.hp === b.hp && (a.hero.name + ' · 기세 ' + a.hp);

        var s = Dl.create({ foeHp: 100000, myAtk: 1, myDef: 1000 });

          }

        return { told: told, dmg: 0, dodged: false };
      }
      var plain = firstHeavy(false), duck = firstHeavy(true);
      return plain.told && plain.dmg > 0 && !plain.dodged &&

    /* ── 실제 지형 (geo) — OpenStreetMap 으로 terrainAt() 을 채운다 ──

    var GEO_BOUNDS = { x0: 0, y0: 0, x1: 960, y1: 960 };

      { type: 'way', tags: { natural: 'water' }, geometry: ring(100, 100, 300, 300) },
      { type: 'way', tags: { landuse: 'forest' }, geometry: ring(600, 0, 700, 100) },
      { type: 'way', tags: { highway: 'residential' }, geometry: [{ lat: fy(500), lon: fx(500) }, { lat: fy(700), lon: fx(500) }] },
      { type: 'node', id: 9001, tags: { natural: 'peak', name: '시험봉' }, lat: fy(700), lon: fx(700) },
      { type: 'node', id: 9002, tags: { place: 'village', name: '가상마을' }, lat: fy(50), lon: fx(50) }

    var EV = DG.event;

               night: !!o.night, weather: o.weather || 'clear', t: atT(o.h === undefined ? 13 : o.h) };

      var foes = {}, i, ev, bad = [], wet = 0;
      for (i = 0; i < EV.EVENTS.length; i++) {
        ev = EV.EVENTS[i];
        if (ev.foe) { foes[ev.foe] = 1; }
        if (ev.wet) { wet++; }
        if (!ev.choices || ev.choices.length < 2) { bad.push(ev.id + ' 선택지 부족'); }
        if (!EV.FOES[ev.foe] && ev.foe) { bad.push(ev.id + ' 모르는 적 ' + ev.foe); }
      }
      return EV.EVENTS.length >= 10 && Object.keys(foes).length === 3 &&
        bad.length === 0 && wet === 1 &&
        ('사건 ' + EV.EVENTS.length + '(그중 비 전용 ' + wet + ') · 적 ' +

    t('사건 — contextAt() 은 하북 마을 밖에서도 땅 갈래를 안다 (2026-09-06 재확인 발견)', function () {

         kind 가 그냥 null 로 떨어졌다 — EVENTS 가 다 where/marks 를 요구하니
         후보가 통째로 0개, 마을 밖에서는 사건이 한 건도 안 났다는 뜻이다.
         world.js 의 terrainAt() 은 이미 land→geo→해시 순으로 답을 내고
         있으니 그걸 그대로 물어 오게 고쳤다 — 그 값과 실제로 같은지 본다.

         맞으면 된다(고침 자체를 보는 것이지 특정 갈래 확률을 보는 게 아니다) */
      var i, tx, ty, ctx, want, ok = 0, sample = null;
      for (i = 0; i < 20; i++) {
        tx = 400 + i * 37; ty = -300 - i * 53;               // 하북(±10칸) 한참 밖

        if (ctx.kind !== want || ctx.mark !== null) { return '(' + tx + ',' + ty + ') kind ' + ctx.kind + ' ≠ ' + want; }

    });

      p.gold = g0;
      CX.clear();
      return ev === true && rec === false &&
        '조각을 팔면 사건은 남고 기록은 안 남는다';
    });

    /* ── 성능 (perf) — 버거우면 스스로 낮춘다 ───────────────
     * 등급을 정하는 `decide` 를 **순수 함수**로 갈라 두었다 — "20fps 가 3초 이어지면
     * 어디로 가나" 를 화면 없이 값으로 물어본다.
     */

    var PF = DG.perf;

    t('성능 — 세 등급이 아래로 갈수록 가볍다', function () {
      var T = PF.TIERS;
      return T.length === 3 && T[0].key === 'HIGH' && T[2].key === 'LOW' &&
        T[0].prop > T[1].prop && T[1].prop > T[2].prop &&
        T[0].radius > T[2].radius && T[2].mesh === 0 && T[2].shadow === 0 &&
        ('잔 사물 ' + T.map(function (x) { return x.prop; }).join(' → ') +
         ' · 반경 ' + T.map(function (x) { return x.radius; }).join(' → ') +
         ' · LOW 는 빌보드 · 그림자 끔');
    });

    t('성능 — 버거우면 내리고 넉넉하면 올린다', function () {
      var down = PF.decide(0, 18, 3, 0);          // 18fps 가 3초
      var stay = PF.decide(0, 18, 1, 0);          // 아직 1초뿐
      var up = PF.decide(2, 58, 0, 20);           // 58fps 가 20초
      var slow = PF.decide(2, 58, 0, 5);          // 아직 5초뿐
      return down === 1 && stay === 0 && up === 1 && slow === 2 &&
        '18fps 3초 → 한 칸 내림 · 58fps 20초 → 한 칸 올림 · 모자란 시간은 그대로';
    });

    t('성능 — 끝에서 더 가지 않는다', function () {
      return PF.decide(2, 10, 99, 0) === 2 && PF.decide(0, 60, 0, 99) === 0 &&
        'LOW 아래로도 HIGH 위로도 안 간다';
    });

    t('성능 — 내리는 것이 올리는 것보다 빠르다', function () {
      /* 경계에서 오르내리면 그 자체가 더 나쁘다 — 사이를 벌리고 시간을 다르게 둔다 */
      var lo = C.tuned('perf.lowFps', 26), hi = C.tuned('perf.highFps', 48);
      var d = C.tuned('perf.downSec', 2), u = C.tuned('perf.upSec', 12);
      return hi > lo + 15 && u > d * 4 &&
        ('버겁다 ' + lo + 'fps/' + d + '초 · 넉넉하다 ' + hi + 'fps/' + u + '초');
    });

    t('성능 — 손잡이를 덮어쓰지 않고 곱한다', function () {
      /* 어드민에서 잡아 둔 값을 뭉개면 사람이 고른 것이 사라진다 */
      PF.reset();
      var high = PF.mul('prop');
      PF.set('LOW');
      var low = PF.mul('prop');
      var mesh = PF.meshOk(), shadow = PF.shadowOk();
      PF.reset();
      return high === 1 && low === 0.25 && mesh === false && shadow === false &&
        PF.meshOk() === true && ('HIGH ×1 → LOW ×' + low + ' (손잡이에 곱한다)');
    });

    t('성능 — 스스로 낮추기를 끌 수 있다', function () {
      PF.set('LOW');
      var onLow = PF.tier().key;
      C.setTune('perf.auto', 0);
      var forced = PF.tier().key;               // 끄면 늘 HIGH 로 본다
      C.setTune('perf.auto', null);
      PF.reset();
      return onLow === 'LOW' && forced === 'HIGH' && 'perf.auto=0 이면 사람이 잡은 대로만';
    });

    t('성능 — ?perf 재기 요약: 평균 fps · 99분위 ms · 긴 프레임(>50ms) 수 (§6.1-B ①)', function () {
      var gaps = [], i; for (i = 0; i < 98; i++) { gaps.push(16); } gaps.push(80); gaps.push(120);
      var s = PF.summarize(gaps), z = PF.summarize([]);
      return s.n === 100 && s.long === 2 && s.p99 === 120 && s.fps === Math.round(1000 * 100 / (98 * 16 + 200)) && z.fps === 0 &&
        ('16ms×98 + 80·120 → ' + s.fps + 'fps · 99% ' + s.p99 + 'ms · 긴 프레임 ' + s.long);
    });

    t('성능 — 설정에서 고른 등급(pin)이 그대로 걸린다(낮음을 골라도 높음으로 돌던 것)', function () {
      /* 2026-09-28 — 자동을 끄면 tier() 가 늘 HIGH 라 ⚙️ "낮음·보통"이 아무 일도 안 했다(폰 발열 §6.1-B) */
      var got = {}, keys = ['LOW', 'MEDIUM', 'HIGH'], i;
      for (i = 0; i < keys.length; i++) { PF.pin(keys[i]); got[keys[i]] = PF.tier().key + '×' + PF.mul('prop'); }
      var pinnedLow = (PF.pin('LOW'), PF.pinned());
      PF.unpin();
      var back = PF.pinned();
      C.setTune('perf.auto', null);                 // unpin 이 남긴 손잡이를 지운다(뒤 진단이 손잡이 수를 센다)
      PF.reset();
      return got.LOW === 'LOW×0.25' && got.MEDIUM === 'MEDIUM×0.5' && got.HIGH === 'HIGH×1' && pinnedLow && !back &&
        ('낮음 ' + got.LOW + ' · 보통 ' + got.MEDIUM + ' · 높음 ' + got.HIGH + ' · 자동으로 되돌림');
    });

    t('성능 — 화면이 없으면 재지 않는다', function () {
      /* 진단은 rAF 가 거의 안 돌아 늘 버거워 보인다 — 여기서 등급이 내려가면
         뒤따르는 항목들이 다른 밀도로 돌게 된다(밟을 뻔한 함정) */
      PF.reset();
      var before = PF.tier().key;
      var i;
      for (i = 0; i < 40; i++) { PF.tick(1.0); }   // 1fps 짜리 프레임 마흔 번
      var after = PF.tier().key;
      PF.reset();
      return before === 'HIGH' && after === 'HIGH' && 'DG_NO_DRAW 면 tick 이 아무 일도 안 한다';
    });

    t('성능 — 판정에 한 칸도 안 닿는다', function () {
      var before = JSON.stringify(C.save);
      PF.set('LOW'); PF.mul('sky'); PF.stats(); PF.reset();
      return JSON.stringify(C.save) === before && '세이브 그대로';
    });

    /* ── 모바일 (PHASE 13) ──────────────────────────────────
     * 등급 셋은 PHASE 12 가 만들었다. 여기서 채운 것은 **켤 때 기기를 보고 시작
     * 등급을 고르는 것**(27절 "기기 성능을 자동 감지")과 **돌려 보기**(7·26절)다.
     */

    t('모바일 — 기기를 보고 시작 등급을 고른다', function () {
      var pc = PF.score({ cores: 12, mem: 16, w: 2560, h: 1440, dpr: 1, touch: false });
      var mid = PF.score({ cores: 6, mem: 4, w: 1920, h: 1080, dpr: 1, touch: false });
      var phone = PF.score({ cores: 4, mem: 4, w: 390, h: 844, dpr: 3, touch: true });
      var old = PF.score({ cores: 2, mem: 2, w: 360, h: 640, dpr: 3, touch: true });
      var t2 = [pc, mid, phone, old].map(PF.tierOfScore);
      return pc > mid && mid > phone && phone > old &&
        t2[0] === 0 && t2[3] === 2 &&
        ('PC ' + pc + '점→' + PF.TIERS[t2[0]].key + ' · 노트북 ' + mid + '→' +
         PF.TIERS[t2[1]].key + ' · 폰 ' + phone + '→' + PF.TIERS[t2[2]].key +
         ' · 낡은 폰 ' + old + '→' + PF.TIERS[t2[3]].key);
    });

    t('모바일 — 같은 사양이어도 터치 기기를 한 단 낮게 본다', function () {
      var o = { cores: 8, mem: 8, w: 1280, h: 720, dpr: 1 };
      var desk = PF.score({ cores: 8, mem: 8, w: 1280, h: 720, dpr: 1, touch: false });
      var touch = PF.score({ cores: 8, mem: 8, w: 1280, h: 720, dpr: 1, touch: true });
      return desk === touch + 1 && ('같은 사양 — 데스크톱 ' + desk + ' · 터치 ' + touch);
    });

    t('모바일 — 모르는 값은 깎지 않는다', function () {
      /* `deviceMemory` 는 크롬 계열만 알려 준다. 모른다고 낮게 보면
         사파리(아이폰)가 늘 LOW 로 시작한다 */
      var known = PF.score({ cores: 8, mem: 8, w: 390, h: 844, dpr: 3, touch: true });
      var unknown = PF.score({ cores: 8, mem: 0, w: 390, h: 844, dpr: 3, touch: true });
      return unknown >= known - 1 &&
        ('메모리를 아는 기기 ' + known + '점 · 모르는 기기 ' + unknown + '점');
    });

    t('모바일 — 그릴 픽셀이 많으면 깎는다', function () {
      var small = PF.score({ cores: 8, mem: 8, w: 1280, h: 720, dpr: 1, touch: false });
      var retina = PF.score({ cores: 8, mem: 8, w: 1440, h: 900, dpr: 2, touch: false });
      return small > retina && ('720p ' + small + '점 · 레티나 ' + retina + '점');
    });

    t('모바일 — 사람이 시작 등급을 못박을 수 있다', function () {
      PF.reset();
      C.setTune('perf.startTier', 'LOW');
      var forced = C.tuned('perf.startTier', '');
      C.setTune('perf.startTier', null);
      PF.reset();
      return forced === 'LOW' && C.tuned('perf.startTier', '') === '' &&
        'perf.startTier 로 기기 감지를 건너뛴다';
    });

    t('모바일 — 돌려 보면 카메라가 나를 축으로 돈다', function () {
      /* PLAN 7·26절. 돌려도 **내가 화면 한가운데** 남아야 한다 */
      var pos = { x: 0, y: 0 };
      var f = R3.camAim(pos, 2, null, null, 1, false, 0);
      var q = R3.camAim(pos, 2, null, null, 1, false, Math.PI / 2);
      var h = R3.camAim(pos, 2, null, null, 1, false, Math.PI);
      function d(a) { return Math.hypot(a.pos.x - pos.x, a.pos.z - pos.y); }
      return Math.abs(d(f) - d(q)) < 0.001 && Math.abs(d(f) - d(h)) < 0.001 &&
        Math.abs(q.pos.x) > 1 && Math.abs(f.pos.x) < 0.001 &&
        Math.abs(h.pos.z + f.pos.z) < 0.001 &&
        ('거리 ' + Math.round(d(f)) + 'm 그대로 · 0°/90°/180° 로 자리만 돈다');
    });

    t('모바일 — 무대에서는 안 돌아간다', function () {
      /* 조우 무대는 어느 시점에서 열었든 같은 그림이어야 한다(예전부터의 규칙) */
      var pos = { x: 0, y: 0 }, st = { x: 40, y: 0, h: 3.2 };
      var a = R3.camAim(pos, 2, null, st, 1, false, 0);
      var b2 = R3.camAim(pos, 2, null, st, 1, false, Math.PI / 2);
      return a.pos.x === b2.pos.x && a.pos.z === b2.pos.z && '무대는 돌려도 같다';
    });

    /* ── 후처리 (post3d) — 톤매핑·블룸·색보정 ────────────────
     * 그래픽 보강 16~18절. 화면 층이라 **눈으로 볼 수밖에 없는 것**이 많지만,
     * 처방을 내는 함수를 순수하게 갈라 두었으므로 여기서는 그 처방을 값으로 본다.
     * (셰이더가 실제로 무엇을 그렸는지는 `_demo.html#3d,night` 과 `#nopost` 를
     *  나란히 찍어 눈으로 본다 — 실제로 그렇게 해서 두 번 고쳤다)
     */

    var PS = DG.post3d;

    t('후처리 — 문턱 아래는 안 번지고 위는 번진다 (18절)', function () {
      /* "강한 빛에만 Bloom" 이 지켜지는지. 이 판에서 0.9 위로 가는 것은
         등롱 전구·후광·빛기둥·가산 혼합 검기뿐이다 */
      var dark = PS.soft(0.30, 0.9, 0.45);
      var lit = PS.soft(0.70, 0.9, 0.45);
      var bulb = PS.soft(1.20, 0.9, 0.45);
      var beam = PS.soft(2.50, 0.9, 0.45);
      return dark === 0 && lit > 0 && lit < 0.2 && bulb > lit && beam > bulb &&
        ('그늘 0.3→' + dark.toFixed(3) + ' · 햇빛 든 지붕 0.7→' + lit.toFixed(3) +
         ' · 전구 1.2→' + bulb.toFixed(3) + ' · 빛기둥 2.5→' + beam.toFixed(3));
    });

    t('후처리 — 문턱이 무릎으로 부드럽게 열린다', function () {
      /* 딱 잘라내면 밝기가 조금 흔들릴 때 화소가 문턱을 넘나들며 껌뻑인다 */
      var soft = PS.soft(0.75, 0.9, 0.45);
      var hard = PS.soft(0.75, 0.9, 0);
      return soft > 0 && hard === 0 &&
        ('무릎 0.45 → ' + soft.toFixed(4) + ' · 무릎 0 → 딱 끊긴다');
    });

    t('후처리 — 밤이 낮보다 더 번지고 색은 덜 만진다', function () {
      var day = PS.lookAt(0.9, 'clear');
      var night = PS.lookAt(-0.5, 'clear');
      /* **색보정은 속삭이는 세기다** — ACES 로 세게 걸었다가 밤 화면을
         망가뜨린 그 교훈. 채도·색온도가 크게 움직이면 여기서 걸린다 */
      return night.bloom > day.bloom * 1.4 && Math.abs(day.sat - 1) < 0.05 &&
        Math.abs(night.sat - 1) < 0.12 && Math.abs(night.temp) < 0.25 &&
        night.temp < 0 && day.exposure === 1 &&
        ('블룸 낮 ' + day.bloom.toFixed(2) + ' → 밤 ' + night.bloom.toFixed(2) +
         ' · 밤 채도 ' + night.sat.toFixed(2) + ' 색온도 ' + night.temp.toFixed(2));
    });

    t('후처리 — 노을은 따뜻하고 밤은 차갑다', function () {
      var gold = PS.lookAt(0.10, 'clear');
      var night = PS.lookAt(-0.6, 'clear');
      return gold.temp > 0 && night.temp < 0 && gold.sat > night.sat &&
        ('노을 색온도 +' + gold.temp.toFixed(2) + ' · 밤 ' + night.temp.toFixed(2));
    });

    t('후처리 — 안개 낀 날은 덜 번진다', function () {
      /* 안개는 이미 뿌옇다 — 번짐을 더하면 형체가 사라진다 */
      var clear = PS.lookAt(0.9, 'clear');
      var fog = PS.lookAt(0.9, 'fog');
      var rain = PS.lookAt(0.9, 'rain');
      return fog.bloom < clear.bloom && rain.bloom > clear.bloom &&
        ('맑음 ' + clear.bloom.toFixed(2) + ' · 안개 ' + fog.bloom.toFixed(2) +
         ' · 비 ' + rain.bloom.toFixed(2) + '(젖은 빛은 더 번진다)');
    });

    t('후처리 — LOW 등급에서는 통째로 안 건다 (28절)', function () {
      var hi = PS.plan({ tier: 'HIGH', alt: 0.9, w: 900, h: 700 });
      var md = PS.plan({ tier: 'MEDIUM', alt: 0.9, w: 900, h: 700 });
      var lo = PS.plan({ tier: 'LOW', alt: 0.9, w: 900, h: 700 });
      return hi.on === true && md.on === true && lo.on === false &&
        hi.bloom.mips.length > md.bloom.mips.length && lo.bloom.mips.length === 0 &&
        hi.msaa > md.msaa && md.msaa > 0 && lo.msaa === 0 &&
        md.scale < hi.scale &&
        ('층 ' + hi.bloom.mips.length + '/' + md.bloom.mips.length + '/0 · ' +
         '표본 ' + hi.msaa + '/' + md.msaa + '/0 · 배율 ' + hi.scale + '/' + md.scale);
    });

    t('후처리 — 등급표와 perf 가 같은 것을 말한다', function () {
      /* 두 곳에 적으면 어긋난다. `perf.postOk()` 가 곧 `TIER_POST[등급].post` 다 */
      PF.reset();
      var high = PF.postOk();
      PF.set('LOW');
      var low = PF.postOk();
      PF.reset();
      return high === true && low === false &&
        !!PS.TIER_POST.HIGH.post === high && !!PS.TIER_POST.LOW.post === low &&
        'HIGH 는 걸고 LOW 는 안 건다 — perf 와 post3d 가 한 말';

    t('후처리 — 층 크기는 절반씩 줄고 너무 작아지면 멈춘다', function () {
      var big = PS.mipSizes(1600, 1200, 4);

        tiny.length < 6 &&

         ' · 40×30 은 ' + tiny.length + '층에서 멈춘다');
    });

    t('후처리 — 창이 아주 작아도 안 터진다', function () {
      var p = PS.plan({ tier: 'HIGH', alt: 0.9, w: 4, h: 3 });
      return p.w >= 1 && p.h >= 1 && p.bloom.mips.length === 0 &&
        ('4×3 → ' + p.w + 'x' + p.h + ' · 블룸 층 없음(끄는 편이 낫다)');
    });

    /* ── 소품 에셋 (prop3d) ─ 진짜 나무가 선다 ────────
     * GLB 를 받는 것은 값으로 못 본다. **어느 자리에 어느 파일이 서나**만 본다.
     */
    var PR = DG.prop3d;

    t('에셋 — 나무·바위·풀에 진짜 모델이 걸려 있다 (STEP 4)', function () {
      var u = PR.urls();
      var kinds = ['tree', 'pine', 'rock', 'grass'].filter(function (k) {
        return !!PR.pick(k, 0, 0, 'all');
      });
      return kinds.length === 4 && u.length >= 12 &&
        (kinds.join(' · ') + ' — 파일 ' + u.length + '개');
    });

    t('에셋 — 같은 자리에는 늘 같은 모양이 선다 (좌표 해시)', function () {
      var a = PR.pick('tree', 3, 5, 'all'), b2 = PR.pick('tree', 3, 5, 'all');
      var c2 = PR.pick('tree', 4, 5, 'all');
      /* 자리가 다르면 대개 다른 모양이다 — 몇 자리를 훑어 실제로 갈리는지 본다.
         `tree` 는 2026-09-04 실사화(Poly Haven CC0)로 한 벌만 남아(가벼운
         후보가 그것뿐이었다, `assets/ASSET_LICENSES.md` 참고) 여기서는 갈리지
         않는다 — 여러 벌 그대로 남은 `rock` 으로 "갈린다" 쪽을 본다 */
      var seen = {}, i;
      for (i = 0; i < 30; i++) { seen[PR.pick('rock', i, 0, 'all')] = 1; }

         판정이 달라진다** — 눈으로는 들어왔는데 빗나가는, 가장 고약한 어긋남이다 */
      var zone = 0.5, zw = 0.22, base = 1.3;
      var z = E3.zoneR(zone, zw, base);
      var bad = 0, i;
      for (i = 0; i <= 200; i++) {
        var n = i / 200;
        var r = E3.ringR(n, base);
        var inRing = r <= z.outer + 1e-9 && r >= z.inner - 1e-9;
        var inBar = Math.abs(n - zone) <= zw / 2 + 1e-9;
        if (inRing !== inBar) { bad++; }
      }
      return bad === 0 && z.inner < z.outer &&
        ('201칸 모두 일치 · 테 ' + z.inner.toFixed(2) + '~' + z.outer.toFixed(2) + 'm');
    });

    t('한국·일본 권역 병합 최근접 — 후쿠오카가 한국으로 잘못 잡히지 않는다', function () {
      /* 2026-09-11 실측으로 찾은 버그: 나라별 "9권역 평균 중심"끼리 먼저
         비교하면 규슈(한국에 가까운 일본 변두리)가 한국 쪽 평균 중심에 더
         가까워져 한국으로 잘못 판정됐다. world.js의 genRegionAt()과 같은
         계산(18개 대표점 통째로 최근접)을 여기서도 그대로 재현해 지킨다. */
      var RK = DG.regionKr, RJ = DG.regionJp;
      if (!RK || !RJ) { return false; }
      function nearest(lat, lng) {
        var all = RK.REGIONS.concat(RJ.REGIONS);
        var cosLat = Math.cos(lat * Math.PI / 180), best = null, bestD = Infinity;
        for (var i = 0; i < all.length; i++) {
          var r = all[i], dLat = lat - r.center.lat, dLng = (lng - r.center.lng) * cosLat;
          var d = dLat * dLat + dLng * dLng;
          if (d < bestD) { bestD = d; best = r; }
        }
        return best;
      }
      var fukuoka = nearest(33.5904, 130.4017);
      var busan = nearest(35.1796, 129.0756);
      return fukuoka.country === 'jp' && fukuoka.code === 'kyushu' &&
        busan.country === 'kr' && busan.code === 'gyeongsang' &&
        ('후쿠오카→' + fukuoka.name + '(' + fukuoka.country + ') · 부산→' + busan.name + '(' + busan.country + ')');

     * 승급하면 攻·守·補 카드 셋이 걸리고, 하나를 고르면 그 인물의 특성이 된다.

    /** 인물 하나를 승급 가능한 상태로 세워 두고 되돌리는 틀 */

        if (k.h) { C.save.heroes[id] = k.h; } else { delete C.save.heroes[id]; }

    /* ── 비석 순례(PLAN §5 ⑤, 2026-09-21) ────────────────────────
     * 200m 격자·해시 12%·15m 발견·권역 열 = 초대장(천거장 `st:<권역>` 등급)·발견한 것만 지도에.
     * 판정(전투력·능력치)에는 한 줄도 안 닿는다. 아직 실기(GPS) 확인 전.
     */
    /** 비석 진단이 만지는 세이브를 통째로 되돌리는 틀 */
    function stelaKeep() {
      var keys = ['stelae', 'stelaeInv', 'letters', 'codex', 'daily', 'dex', 'heroes', 'dust', 'items', 'party'];
      var snap = {}; keys.forEach(function (k) { snap[k] = C.save[k] === undefined ? undefined : JSON.stringify(C.save[k]); });
      var pl = JSON.parse(JSON.stringify(C.save.player)), px = C.save.player.pos.x, py = C.save.player.pos.y;
      return function () {
        keys.forEach(function (k) { C.save[k] = snap[k] === undefined ? undefined : JSON.parse(snap[k]); });
        Object.keys(pl).forEach(function (k) { if (k !== 'pos') { C.save.player[k] = pl[k]; } });
        C.save.player.pos.x = px; C.save.player.pos.y = py;
        DG.stela._resetForTest();
      };
    }
    /** 대표점(서울급) 근처에서 (lat,lng) 로 서 있는 비석 하나 */

      return near[i || 0].stela;
    }
    function standAt(s, dLng) {
      var w = DG.world.latLngToWorld(s.lat, s.lng + (dLng || 0));
      C.save.player.pos.x = w.x; C.save.player.pos.y = w.y;
    }

        for (var k = 0; k < 3 && !b.dead; k++) { FC.hitFoe(S, b, S.party[0], 1e8, null, 'test'); }
        FC.tick(0.05);
        r.duel = C.save.story.step === 6 && !S.camps[ST.keyOf() + ':add'];
        var m = TL.mats(), k0 = m.knot || 0, gold0 = C.save.player.gold;
        stGo(ST.npcPos('mulsae'));
        r.end = stTalkAll(ST) && C.save.story.ch === 23 && C.save.story.step === 0 && m.knot === k0 + 6 && C.save.player.gold === gold0 + 6250 &&
          ST.hasMember('story_mulsae') && U.lighthouseLit();
      } finally { LF.perched = keepP; U._resetForTest(); rig.undo(); }
      var bad = Object.keys(r).filter(function (k) { return !r[k]; });
      return bad.length === 0 ? '일곱 단계 · 파랑 → 난간 판 → 등롱(땅 ✕ → 위 ○, 등대 켜짐) → 반디 → 파랑 → 파수 거신(🪨 + 바위곰·불도깨비) → 물새 합류 · 🪢+6 🪙+6250' : ('실패 ' + bad.join(','));
    });

    t('옛 등대·기록실 ⑲-47 — 등대는 23장 넷째 단계부터 켜짐(셋째 ✕·끝나도 ○) · 등대 발치·기록실 앞 자리는 뭍이고 벽 밖 · 기록실 앞은 돔 안 · 단말 자리가 돔 안', function () {
      var rig = stRig(52), ST = rig.ST, U = DG.sunken, r = {};
      try {
        U._resetForTest();
        var dm = U.siteById('dome');
        function hit(x, y) { return DG.world3d.houseRects(Math.floor(x / 48), Math.floor(y / 48)).some(function (q) { return frInRect(q, x, y); }); }
        C.save.story = { ch: 22, step: 2 }; var off = !U.lighthouseLit();
        C.save.story = { ch: 22, step: 3 }; var lit = U.lighthouseLit();
        C.save.story = { ch: 23, step: 0 }; r.lamp = off && lit && U.lighthouseLit() && U.LIGHT_FROM === 3;
        C.save.story = { ch: 21, step: 9 }; r.lamp = r.lamp && !U.lighthouseLit();
        r.spots = ['light_bandi', 'parang'].every(function (k) { var q = U.spot(k); return ST.landAt(q.x, q.y) && !hit(q.x, q.y); }) &&
          Math.hypot(U.spot('parang').x - dm.x, U.spot('parang').y - dm.y) < U.DOME_R - 2 && Math.hypot(U.TERM[0], U.TERM[1]) < U.DOME_R - 2;
      } finally { U._resetForTest(); rig.undo(); }
      var bad = Object.keys(r).filter(function (k) { return !r[k]; });
      return bad.length === 0 ? '등대 넷째부터(셋째 ✕·뒤 ○) · 자리 뭍·벽 밖 · 기록실 앞·단말 돔 안' : ('실패 ' + bad.join(','));
    });

    /* ── ⑲-48 7부 무대 · 구름 위 항로 (skyroute.js — 떠 있는 섬 셋·바람 기둥 셋, PLAN §5 ⑲-48) ── */
    t('구름 위 항로 ⑲-48 — 섬은 23장 등롱 뒤에만(발판 목록에 든다) · 등대 서쪽으로 사당 +60·잔해 +82·정거장 +104(반지름 18·20·16) · 가장자리 틈 8m · 기둥은 그 장 뒤(없으면 닫힘, 손잡이로 열림) · 기둥 끝 = 다음 섬 +9 · 다음 섬 가장자리까지 12m 안 · 발견 한 번', function () {
      var rig = stRig(52), R = DG.skyRoute, SK = DG.skyIsle, U = DG.sunken, r = {};
      try {
        U._resetForTest(); R._resetForTest(); delete C.save.skyroute;
        C.save.story = { ch: 22, step: 2 };
        r.hidden = !R.on() && R.pads().length === 0 && !SK.pads().some(function (p) { return p.id.indexOf('sr_') === 0; });
        C.save.story = { ch: 23, step: 0 };
        var I = R.isles(), L = U.siteById('lighthouse'), base = DG.relief3d.heightAt(L.x, L.y);
        r.isles = R.on() && I.length === 3 && I.map(function (q) { return q.id; }).join() === 'shrine,wreck,orbit' &&
          I.map(function (q) { return Math.round(q.top - base); }).join() === '60,82,104' && I.map(function (q) { return q.r; }).join() === '18,20,16' &&
          I[0].x < L.x && I[1].x < I[0].x && I[2].x < I[1].x;
        r.gap = Math.abs((I[0].x - I[0].r) - (I[1].x + I[1].r) - 8) < 1e-6 && Math.abs((I[1].x - I[1].r) - (I[2].x + I[2].r) - 8) < 1e-6;
        r.pads = I.every(function (q) { var p = SK.padAt(q.x, q.y); return p && p.id === 'sr_' + q.id && p.top === q.top; });
        r.closed = R.drafts().length === 0 && R.DRAFT_CH.join() === 'ch24,ch24,ch25';
        C.setTune('skyroute.drafts', 1);
        var D = R.drafts();
        r.drafts = D.length === 3 && Math.abs(D[0].top - (I[0].top + 9)) < 1e-6 && Math.abs(D[1].top - (I[1].top + 9)) < 1e-6 && Math.abs(D[2].top - (I[2].top + 9)) < 1e-6 &&
          Math.hypot(D[1].x - I[0].x, D[1].y - I[0].y) <= I[0].r - R.DRAFT_IN + 1e-6 && Math.hypot(D[2].x - I[1].x, D[2].y - I[1].y) <= I[1].r - R.DRAFT_IN + 1e-6 &&
          [[D[0], I[0]], [D[1], I[1]], [D[2], I[2]]].every(function (z) { var dd = Math.hypot(z[0].x - z[1].x, z[0].y - z[1].y) - z[1].r; return dd > 0 && dd <= 12; }) &&
          D.every(function (d) { return !!SK.draftAt(d.x, d.y); });
        var g0 = C.save.player.gold;
        var f1 = R.discoverOn('shrine'), f2 = R.discoverOn('shrine');
        r.found = !!f1 && !f2 && R.found('shrine') && C.save.player.gold === g0 + R.REWARD.gold && R.marks().filter(function (m) { return m.found; }).length === 1;
      } finally { C.setTune('skyroute.drafts', null); delete C.save.skyroute; R._resetForTest(); U._resetForTest(); rig.undo(); }
      var bad = Object.keys(r).filter(function (k) { return !r[k]; });
      return bad.length === 0 ? '23장 등롱 뒤 · 사당 60·잔해 82·정거장 104(서쪽으로) · 틈 8 · 기둥 24·24·25장 뒤(끝 +9, 12m 안) · 발견 금 +200 한 번' : ('실패 ' + bad.join(','));
    });

    t('구름 위 항로 ⑲-48 — 실제로 탄다: 사당 위 서쪽 기둥에서 뛰면 솟아 잔해 윗면 +9 에서 멎고, 서쪽으로 활공하면 잔해 섬에 내려선다(섬 위 층)', function () {
      var rig = stRig(52), R = DG.skyRoute, SK = DG.skyIsle, U = DG.sunken, LF = DG.landform, r = {}, i;
      try {
        U._resetForTest(); R._resetForTest(); SK._resetForTest(); LF._resetForTest();
        C.save.story = { ch: 23, step: 0 }; C.setTune('skyroute.drafts', 1);
        var I = R.isles(), D = R.drafts(), pos = C.save.player.pos;
        pos.x = D[1].x; pos.y = D[1].y; LF.setSky(true);
        r.onShrine = LF.onSky() && SK.padAt(pos.x, pos.y).id === 'sr_shrine';
        LF.jump();
        for (i = 0; i < 80 && !(LF.gliding() && LF.glideAlt() >= D[1].top - 0.01); i++) { LF.tick(0.1); }
        r.rose = LF.gliding() && Math.abs(LF.glideAlt() - D[1].top) < 0.05;
        for (i = 0; i < 120 && LF.gliding(); i++) { pos.x -= 0.8; LF.tick(0.1); }
        var pd = SK.padAt(pos.x, pos.y);
        r.landed = !LF.gliding() && LF.onSky() && !!pd && pd.id === 'sr_wreck';
      } finally { C.setTune('skyroute.drafts', null); LF._resetForTest(); SK._resetForTest(); R._resetForTest(); U._resetForTest(); rig.undo(); }
      var bad = Object.keys(r).filter(function (k) { return !r[k]; });
      return bad.length === 0 ? '사당 기둥 → 잔해 +9 까지 솟음 → 서쪽 활공 → 잔해 섬에 내려섬' : ('실패 ' + bad.join(','));
    });

    /* ── 2026-09-27 실기 보고 Q1·Q4 — 3인칭 이동(키는 카메라 기준)·밝기 ── */
    t('3인칭 이동 Q1 — 3D 로 시점을 돌리면 키·스틱 방향도 같이 돈다(W = 카메라가 보는 쪽) · 3D 가 꺼져 있으면 그대로', function () {
      var W = DG.world, W3 = DG.world3d, r = {};
      try {
        DG.world3d = Object.create(W3, { active: { value: function () { return true; } }, yaw: { value: function () { return Math.PI / 2; } } });
        var f = W.camRot(0, -1), rt = W.camRot(1, 0);
        r.turned = Math.abs(f.x - 1) < 1e-9 && Math.abs(f.y) < 1e-9 && Math.abs(rt.x) < 1e-9 && Math.abs(rt.y - 1) < 1e-9;   // 앞 = 동, 오른쪽 = 남
        DG.world3d = Object.create(W3, { active: { value: function () { return false; } }, yaw: { value: function () { return Math.PI / 2; } } });
        var g = W.camRot(0, -1);
        r.flat = g.x === 0 && g.y === -1;
      } finally { DG.world3d = W3; }
      var bad = Object.keys(r).filter(function (k) { return !r[k]; });
      return bad.length === 0 ? 'yaw 90° 에서 W → 동 · D → 남 · 3D 꺼지면 그대로' : ('실패 ' + bad.join(','));
    });

    t('밝기 Q4 — 밤도 읽히게: 밤 반구광 세기 ≥ 1.9 · 밤 지도 물감 밝기 ≥ 0.7 · 밤 안개는 500m 넘어 · 흐림 해는 맑음의 0.8배 넘게', function () {
      var R3 = DG.world3d, r = {};
      function atH(h) { var d = new Date(2026, 8, 27, h, 0, 0); return d.getTime(); }
      C.setTune('world3d.dayNight', 1);
      try {
        var n = R3.lightingAt(atH(23), 'clear'), c = R3.lightingAt(atH(13), 'clear'), cl = R3.lightingAt(atH(13), 'cloud');
        r.hemi = n.hemi.intensity >= 1.9;
        r.tint = R3.lum(n.tint) >= 0.7;
        r.fog = n.fog.far > 500;
        r.cloud = cl.sun.intensity > c.sun.intensity * 0.8;
      } finally { C.setTune('world3d.dayNight', null); }
      var bad = Object.keys(r).filter(function (k) { return !r[k]; });
      return bad.length === 0 ? '밤 반구광·물감·안개 · 흐림 해' : ('실패 ' + bad.join(','));
    });

    /* ── ⑳ 원작 겹침 정리 (PLAN §5 ⑳) ── */
    t('원작 겹침 ⑳ — 화면 글자(보패·무기·무예·반응·상자·숨은 터 표 · 인물 상세 · 등급 카드)에 옛 원작 용어가 없다', function () {
      var OLD = ['성유물', '비경', '지맥', '운명의 자리', '원소 시야', '모험 등급', '세계 등급', '원소 폭발', '신상', '재련', '돌파',
        '한손검', '양손검', '장병기', '법구', '증발', '융해', '과부하', '감전', '빙결', '초전도', '확산', '개화', '연소', '촉진', '활성',
        '발산', '쇄빙', '해시계', '술잔', '절연', '평범', '정교', '진귀', '화려'];
      var AR = DG.artifact, WP = DG.weapon, TL = DG.talent, FC = DG.fieldCombat, parts = [], html = '';
      [AR.SLOT_NAMES, AR.STAT_NAMES, AR.SETS, WP.TYPE_NAMES, WP.STAT_NAMES, WP.PASSIVE_NAMES, WP.WEAPONS, TL.KINDS, TL.CON_TEXT, TL.MATS,
        FC.REACT, FC.EL, DG.treasure.GRADES, DG.domain.KINDS, DG.fieldBoss.MATS].forEach(function (o) { parts.push(JSON.stringify(o)); });
      if (DG.adventure) { parts.push(DG.adventure.cardHtml()); }
      var a = heroOfType('sword', 0), undo = gearRig([a]);
      try {
        WP.give('w_sword_4'); WP.equip(a, 'w_sword_4');
        AR.SLOTS.forEach(function (sl) { AR.equip(a, AR.add(5, 'emblem', sl)); });
        DG.ui.openDetail('hero', a);
        html = document.getElementById('detail').innerHTML;
        DG.ui.closeDetail();
      } finally { undo(); }
      parts.push(html);
      var txt = parts.join(' | '), hit = OLD.filter(function (w) { return txt.indexOf(w) >= 0; });
      return hit.length === 0 && html.length > 500 ? ('옛 용어 ' + OLD.length + '개 · 글 ' + txt.length + '자에서 0') : ('실패 ' + (hit.join(',') || '상세 ' + html.length + '자'));
    });

    t('런타임 에러 없음', function () {
      return errors.length === 0 || ('에러 ' + errors.length + '건: ' + errors.join(' | ')) === '';
    });

    var failCount = out.filter(function (s) { return s.indexOf('FAIL') >= 0; }).length;
    document.getElementById('report').innerHTML =
      '<h3>사가고 자가진단 — ' + (out.length - failCount) + '/' + out.length + ' 통과</h3>' +
      out.join('<br>') +
      (errors.length ? '<br><br><b class="fail">런타임 에러</b><br>' + errors.join('<br>') : '');
    document.title = 'RESULT ' + (out.length - failCount) + '/' + out.length;
    localStorage.removeItem(C.SAVE_KEY);   // 진단 흔적 제거
  }, 400);
})();
</script>
</body>
</html>
