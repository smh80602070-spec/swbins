<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>bake-one</title></head>
<body>
<!--
  bake.html 하나가 33개를 한 페이지에서 순서대로 구우면 특정 잡이 간헐적으로
  멎을 때(README "알려진 흠" 참고) 그 잡 하나만 완전히 새 브라우저 프로세스로
  격리해 재시도하기 위한 보조 도구다. 쿼리스트링으로 잡 하나만 받는다:
    _bake_one.html?key=<이름>&group=beast|building&url=<GLB/GLTF 상대경로(URL 인코딩)>
  결과는 bake.html과 같은 형식으로 <pre id="manifest">에 JSON 배열(길이 1) 하나로 남는다.
-->
<div id="log" style="font:12px monospace;white-space:pre-wrap;padding:10px;">굽는 중…</div>
<pre id="manifest" style="display:none"></pre>
<script src="../../js/vendor/three.iife.js"></script>
<script>
(function () {
  'use strict';
  var T = window.THREE;
  var logEl = document.getElementById('log');
  function log(s) { logEl.textContent += '\n' + s; }

  var params = new URLSearchParams(location.search);
  var key = params.get('key');
  var group = params.get('group');
  var url = params.get('url');
  var ICON = +params.get('px') || 96;
  var FIT = +params.get('fit') || 1.6;    // 넓은 건물은 0.9 안팎으로 줄여야 프레임에 다 든다(탑 기준 1.6)
  /* view=pet (2026-09-23) — 지도 스탬프용 짐승: 쉬는 자세·긴 축을 옆으로(3/4)·몸 전체·발이 바닥. 예전 기본 구도는
     정면에 위아래가 잘렸다(사슴 다리, 장룡은 막대). 정사각 직교 카메라를 상자 투영에 맞춘다 */
  var VIEW = params.get('view') || '';

  var TIMEOUT_MS = 60000;

  function finish(r) {
    var entry = { key: key, group: group, ok: r.ok, error: r.error, dataURL: r.dataURL };
    document.getElementById('manifest').textContent = JSON.stringify([entry]);
    log((r.ok ? 'OK ' : 'FAIL ') + group + '/' + key + (r.ok ? '' : (' — ' + r.error)));
    log('BAKE_ONE_DONE ' + (r.ok ? 1 : 0) + '/1');
    document.title = 'BAKE_ONE_DONE ' + (r.ok ? 1 : 0) + '/1';
  }

  function petFrame(root, gltf) {
    var clips = gltf.animations || [], clip = null, i;
    for (i = 0; i < clips.length && !clip; i++) { if (/idle/i.test(clips[i].name)) { clip = clips[i]; } }
    if (!clip && clips.length) { clip = clips[0]; }
    if (clip) { var mx = new T.AnimationMixer(root); mx.clipAction(clip).play(); mx.update(0.3); }
    function box() {
      root.updateMatrixWorld(true);
      root.traverse(function (o) { if (o.isSkinnedMesh && o.skeleton) { o.skeleton.update(); } });
      return new T.Box3().setFromObject(root, true);   // precise — 스킨 반영 정점
    }
    var s0 = box().getSize(new T.Vector3());
    var yaw = +params.get('yaw') || 1.1;
    root.rotation.y = s0.z >= s0.x ? yaw : yaw - Math.PI / 2;   // 모델마다 앞 축이 다르다 — 긴 축을 옆으로
    var b = box();
    var el = 12 * Math.PI / 180, cam = new T.OrthographicCamera(-1, 1, 1, -1, -100, 100);
    cam.position.set(0, Math.sin(el), Math.cos(el)); cam.lookAt(0, 0, 0); cam.updateMatrixWorld(true);
    var inv = cam.matrixWorldInverse, xs = [], ys = [], v = new T.Vector3(), k;
    for (k = 0; k < 8; k++) {
      v.set(k & 1 ? b.max.x : b.min.x, k & 2 ? b.max.y : b.min.y, k & 4 ? b.max.z : b.min.z).applyMatrix4(inv);
      xs.push(v.x); ys.push(v.y);
    }
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var size = Math.max(x1 - x0, y1 - y0) * 1.06, mid = (x0 + x1) / 2, bot = y0 - size * 0.02;
    cam.left = mid - size / 2; cam.right = mid + size / 2; cam.bottom = bot; cam.top = bot + size;
    cam.updateProjectionMatrix();
    return cam;
  }

  function fitAndFrame(root, camera, group) {
    root.updateMatrixWorld(true);
    var box = new T.Box3().setFromObject(root);
    var size = new T.Vector3(); box.getSize(size);
    var center = new T.Vector3(); box.getCenter(center);
    var maxDim = Math.max(size.x, size.y, size.z) || 1;
    var scale = FIT / maxDim;
    root.position.copy(center).multiplyScalar(-scale);
    root.scale.setScalar(scale);
    var elevDeg = group === 'building' ? 22 : 42;
    var dist = 2.1;
    var elev = elevDeg * Math.PI / 180;
    camera.position.set(0, dist * Math.sin(elev), dist * Math.cos(elev));
    camera.lookAt(0, group === 'building' ? 0.15 : 0, 0);
  }

  function run() {
    var cv = document.createElement('canvas');
    var renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(ICON, ICON, false);
    var scene = new T.Scene();
    var camera = new T.PerspectiveCamera(30, 1, 0.01, 100);
    scene.add(new T.HemisphereLight(0xdCE8FF, 0x746a5c, 2.4));
    var light1 = new T.DirectionalLight(0xFFF3DC, 1.8);
    light1.position.set(1.2, 2.0, 1.6);
    scene.add(light1);
    var light2 = new T.DirectionalLight(0xbdd2ee, 0.9);
    light2.position.set(-1.3, 1.0, -1.0);
    scene.add(light2);

    var done = false;
    var timer = setTimeout(function () {
      if (done) { return; }
      done = true;
      finish({ ok: false, error: '시간 초과(' + TIMEOUT_MS + 'ms)' });
    }, TIMEOUT_MS);
    var loader = new T.GLTFLoader();
    /* 2026-09-23 — 사가나락에서 옮겨 온 펫 모델은 meshopt 압축이다(게임 asset3d.js 와 같은 디코더) */
    if (T.MeshoptDecoder) { loader.setMeshoptDecoder(T.MeshoptDecoder); }
    log('start ' + key + ' <- ' + url);
    loader.load(url, function (gltf) {
      if (done) { return; }
      done = true; clearTimeout(timer);
      try {
        var root = gltf.scene || gltf.scenes[0];
        scene.add(root);
        var cam = camera;
        if (VIEW === 'pet') { cam = petFrame(root, gltf); } else { fitAndFrame(root, camera, group); }
        renderer.render(scene, cam);
        var dataURL = renderer.domElement.toDataURL('image/png');
        finish({ ok: true, dataURL: dataURL });
      } catch (e) {
        finish({ ok: false, error: String(e && e.message || e) });
      }
    }, function (xhr) {
      log(key + ' progress ' + xhr.loaded + '/' + xhr.total);
    }, function (err) {
      if (done) { return; }
      done = true; clearTimeout(timer);
      finish({ ok: false, error: String(err && err.message || err) });
    });
  }

  if (!T || !T.GLTFLoader) {
    finish({ ok: false, error: 'no GLTFLoader' });
  } else if (!key || !group || !url) {
    finish({ ok: false, error: 'missing query params' });
  } else {
    run();
  }
})();
</script>
</body></html>
