<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사가만리 — 아이콘 굽기(오프라인 배치)</title>
</head>
<body>
<!--
  saga-go 전용 오프라인 배치 툴. 게임 화면이 아니다 — 실행 방법은
  ../../SAGA-HANDOFF.md 2026-09-11 Phase 3 항목과 이 폴더의 README.md 참고.

  하는 일: 이미 있는 CC0 GLB(들짐승 28종·건물 5종)를 THREE.js로 한 번씩
  띄워 위에서 내려다본(top-down에 가까운) 작은 스냅샷을 굽고, 끝나면
  결과를 <pre id="manifest"> 에 JSON(base64 dataURL 모음)으로 그대로
  적어 둔다. 브라우저에서 직접 열어도 되고(수동 저장), 헤드리스 크롬
  --dump-dom 으로 이 페이지를 한 번 열어 그 출력에서 JSON을 뽑아
  PNG 파일로 흩는 방식(../../tools/bake-icons/extract.js)도 된다.

  게임 런타임 코드가 이 파일을 로드하지 않는다 — sprite.js/world.js는
  이 툴이 만든 결과물(assets/sprites2d/beast_*.png · building_*.png)만
  쓴다.
-->
<div id="log" style="font: 12px monospace; white-space: pre-wrap; padding: 10px;">굽는 중…</div>
<pre id="manifest" style="display:none"></pre>

<script src="../../js/vendor/three.iife.js"></script>
<script>
(function () {
  'use strict';
  var T = window.THREE;
  var logEl = document.getElementById('log');
  function log(s) { logEl.textContent += '\n' + s; }

  var ANIMALS = '../../assets/models/animals/';
  var BLD = '../../assets/models/buildings/';
  var BLD_REAL = BLD + 'realistic/';

  /* asset3d.js의 DEFAULTS(REG 초기값)에서 실제로 참조되는 파일을 그대로
     옮겼다 — 새 에셋을 추가하는 게 아니라 "이미 쓰고 있는 것들"을 2D
     아이콘으로도 한 벌 굽는 것뿐이다. key는 나중에 sprite.js가 파일명을
     찾을 때 쓸 이름(../../js/asset3d.js의 경로에서 확장자 뺀 베이스네임과
     맞춘다 — 예: Deer.glb → beast_Deer.png). */
  var ANIMAL_FILES = [
    'Deer', 'Wolf', 'Cow', 'Alpaca', 'Bull', 'Donkey', 'Fox', 'Husky', 'ShibaInu', 'Stag',
    'Pigeon', 'Birb',
    'Koi', 'Shark', 'Dolphin', 'Manta_ray',
    'Horse', 'Horse_White',
    'Frog',
    'Trex', 'Triceratops', 'Stegosaurus', 'Velociraptor',
    'Orc', 'Demon', 'BlueDemon',
    'Snake', 'Snake_angry'
  ];
  /* Orc·Demon·BlueDemon만 확장자가 .gltf다(asset3d.js DEFAULTS 참고) */
  var GLTF_EXT = { Orc: 1, Demon: 1, BlueDemon: 1 };

  var BUILDINGS = [
    { key: 'Watchtower', url: BLD + 'Watchtower.glb' },
    { key: 'Tower', url: BLD + 'Tower.glb' },
    { key: 'PointyTower', url: BLD + 'PointyTower.glb' },
    { key: 'tower_round', url: BLD_REAL + 'tower_round.glb' },
    { key: 'tower_ruin', url: BLD_REAL + 'tower_ruin.glb' }
  ];

  var JOBS = ANIMAL_FILES.map(function (name) {
    return { key: name, url: ANIMALS + name + (GLTF_EXT[name] ? '.gltf' : '.glb'), group: 'beast' };
  }).concat(BUILDINGS.map(function (b) { return { key: b.key, url: b.url, group: 'building' }; }));

  var ICON = 96;   // 2D 지도 스탬프 한 칸 크기에 맞춘다(sprite.js의 stamp() 가 이미 그 정도 크기로 찍는다)

  var renderer = null, scene = null, camera = null, light1, light2;
  function boot() {
    var cv = document.createElement('canvas');
    renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(ICON, ICON, false);
    scene = new T.Scene();
    camera = new T.PerspectiveCamera(30, 1, 0.01, 100);
    scene.add(new T.HemisphereLight(0xdCE8FF, 0x746a5c, 2.4));
    light1 = new T.DirectionalLight(0xFFF3DC, 1.8);
    light1.position.set(1.2, 2.0, 1.6);
    scene.add(light1);
    light2 = new T.DirectionalLight(0xbdd2ee, 0.9);
    light2.position.set(-1.3, 1.0, -1.0);
    scene.add(light2);
  }

  function fitAndFrame(root, group) {
    /* asset3d.js의 normalize()가 이미 겪은 함정 — 재기 전에 월드 행렬을
       갱신 안 하면 계층에 걸린 스케일이 빠진 채로 재어져 박스가 엉뚱하게
       나온다(2026-09-11, 이 툴에서도 그대로 재현: Trex·Koi·Manta_ray·
       PointyTower가 빈 화면으로 나왔다). */
    root.updateMatrixWorld(true);
    var box = new T.Box3().setFromObject(root);
    var size = new T.Vector3(); box.getSize(size);
    var center = new T.Vector3(); box.getCenter(center);
    var maxDim = Math.max(size.x, size.y, size.z) || 1;
    var scale = 1.6 / maxDim;                // 대략 한 변 1.6 유닛에 맞춘다
    /* 버그였던 자리 — position은 스케일이 적용되기 *전* 로컬 좌표라, 그냥
       -center를 넣으면 스케일만큼 어긋난다(모델이 클수록 화면 밖으로
       멀리 튕겨 나가 완전히 빈 화면이 됐다 — Trex·Koi 등 6종, 2026-09-11).
       중심이 원점에 오려면 -center*scale이어야 한다. */
    root.position.copy(center).multiplyScalar(-scale);
    root.scale.setScalar(scale);
    /* 짐승은 위에서 살짝 내려다보는 3/4 시점(지도 스탬프 느낌),
       건물은 조금 더 옆에서 봐야 탑 높이가 눈에 들어온다 */
    var elevDeg = group === 'building' ? 22 : 42;
    var dist = 2.1;
    var elev = elevDeg * Math.PI / 180;
    camera.position.set(0, dist * Math.sin(elev), dist * Math.cos(elev));
    camera.lookAt(0, group === 'building' ? 0.15 : 0, 0);
  }

  /* GPU(여기선 SwiftShader 소프트웨어 렌더) 메모리를 안 돌려주면 서른 몇
     번째쯤부터 실제로 자원이 바닥나 로더가 응답을 못 하는 것으로 보인다
     (Orc부터 매번 같은 자리에서 멎었다, 2026-09-11) — 구운 다음엔 텍스처·
     지오메트리를 전부 지운다. */
  function disposeDeep(root) {
    root.traverse(function (o) {
      if (o.geometry) { o.geometry.dispose(); }
      if (o.material) {
        var mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(function (m) {
          ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap', 'alphaMap'].forEach(function (k) {
            if (m[k]) { m[k].dispose(); }
          });
          m.dispose();
        });
      }
    });
  }

  function bakeOne(job) {
    /* 2026-09-11엔 8초에서 콜백이 영영 안 오는 걸로 봤는데, 2026-09-11(후속
       재확인)에 같은 파일을 단독으로 다시 열어 보니 어떤 시도는 1초 안에
       끝나고 어떤 시도는 30초를 줘도 그대로 멎었다 — 로더 자체가 항상
       막히는 게 아니라 이 환경(헤드리스+동시 GLB 여러 개)에서 간헐적으로
       느려지는 것으로 보인다. 그래서 시간을 30초로 늘리고 **한 번 더
       시도**(새 GLTFLoader 인스턴스로 재시도)까지 두어 일시적 지연을
       버티게 한다. */
    var TIMEOUT_MS = 30000;
    function attempt() {
      return new Promise(function (resolve) {
        var done = false;
        var timer = setTimeout(function () {
          if (done) { return; }
          done = true;
          resolve({ ok: false, error: '시간 초과(' + TIMEOUT_MS + 'ms) — 로더 콜백 없음' });
        }, TIMEOUT_MS);
        var loader = new T.GLTFLoader();
        loader.load(job.url, function (gltf) {
          if (done) { return; }
          done = true; clearTimeout(timer);
          try {
            var root = gltf.scene || gltf.scenes[0];
            scene.add(root);
            fitAndFrame(root, job.group);
            renderer.render(scene, camera);
            var url = renderer.domElement.toDataURL('image/png');
            scene.remove(root);
            disposeDeep(root);
            resolve({ ok: true, dataURL: url });
          } catch (e) {
            resolve({ ok: false, error: String(e && e.message || e) });
          }
        }, undefined, function (err) {
          if (done) { return; }
          done = true; clearTimeout(timer);
          resolve({ ok: false, error: String(err && err.message || err) });
        });
      });
    }
    return attempt().then(function (r) {
      if (r.ok) { return r; }
      log('  (재시도) ' + job.group + '/' + job.key + ' — ' + r.error);
      return attempt();
    }).then(function (r) {
      return { key: job.key, group: job.group, ok: r.ok, error: r.error, dataURL: r.dataURL };
    });
  }

  function run() {
    boot();
    var results = [];
    var i = 0;
    function next() {
      if (i >= JOBS.length) { return finish(); }
      var job = JOBS[i++];
      bakeOne(job).then(function (r) {
        log((r.ok ? 'OK  ' : 'FAIL') + ' ' + r.group + '/' + r.key + (r.ok ? '' : (' — ' + r.error)));
        results.push(r);
        next();
      });
    }
    function finish() {
      var okCount = results.filter(function (r) { return r.ok; }).length;
      document.getElementById('manifest').textContent = JSON.stringify(results);
      log('\nBAKE_DONE ' + okCount + '/' + results.length);
      document.title = 'BAKE_DONE ' + okCount + '/' + results.length;
    }
    next();
  }

  if (!T || !T.GLTFLoader) {
    log('THREE.GLTFLoader 를 못 찾았다 — three.iife.js 로딩 실패');
    document.title = 'BAKE_DONE 0/0';
  } else {
    run();
  }
})();
</script>
</body>
</html>
