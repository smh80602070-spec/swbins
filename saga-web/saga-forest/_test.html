<!-- three.js 는 씨앗을 잠그기 전에 싣는다 — 라이브러리 자체 내부의 Math.random()
     (UUID 생성 따위)가 게임 난수열에 끼어들지 않게. 게임 스크립트는 전부
     아래 씨앗 고정 다음에 실린다 -->
<script src="js/vendor/three.iife.js"></script>
<script>
window.DG_NO_DRAW = true; window.DG_NO_TUT = true; window.DG_NO_ACCOUNT = true; window.DG_NO_LOOP = true; window.DG_NO_SCENARIO = true;
/* 어드민의 균형 손잡이를 읽지 않는다 — 손잡이를 잡아 둔 기기에서
   판정이 흔들리면 안 된다 (씨앗을 고정한 것과 같은 이유다) */
window.DG_NO_TUNE = true;

/* 무작위 고정 — 진단이 굴릴 때마다 달라지면 판정이 흔들린다.
   게임 스크립트보다 **먼저** 갈아 둬야 부트에서 쓰는 난수까지 잡힌다.
   (실제 플레이는 그대로다 — 이 파일 안에서만 바꾼다)
   mulberry32: 짧고 분포가 고르며 같은 씨앗이면 같은 수열이 나온다. */
(function (seed) {
  var s = seed >>> 0;
  Math.random = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  window.DG_SEED = seed;
})(20260824);
</script>

<script>
(function () {
  var out = [], errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message); });

  function t(name, fn) {
    try {
      var r = fn();
      out.push((r ? '<span class="pass">PASS</span> ' : '<span class="fail">FAIL</span> ') +
        name + (typeof r === 'string' ? ' — ' + r : ''));
      return !!r;
    } catch (e) {
      out.push('<span class="fail">FAIL</span> ' + name + ' — 예외: ' + e.message);
      return false;
    }
  }

  setTimeout(function () {
    var C = DG.core, V = DG.village, VD = DG.villageData, AU = DG.auto;

    t('루프 문지기(W-0066) — 숨김이면 park(다음 프레임 예약 없음)·보이되 포커스 없으면 wait·보이고 포커스면 run, 깨우기는 멈춰 있을 때만 한 번(사슬이 둘이 되지 않는다)', function () {
      var G = DG.game, saved = window.requestAnimationFrame, n = 0, prevParked = G._parked(), r = {};
      function hide(v) { if (v) { Object.defineProperty(document, 'hidden', { configurable: true, get: function () { return true; } }); } else { delete document.hidden; } }
      try {
        hide(true); r.park = G.loopGate() === 'park'; hide(false);
        document.hasFocus = function () { return false; }; r.wait = G.loopGate() === 'wait';
        document.hasFocus = function () { return true; }; r.run = G.loopGate() === 'run';
        delete document.hasFocus;
        window.requestAnimationFrame = function () { n++; return n; };
        G._park(false); G.wakeLoop(); r.noop = n === 0;                                   // 멈춰 있지 않으면 아무것도 안 한다
        G._park(true); G.wakeLoop(); r.once = n === 1 && G._parked() === false;            // 멈춰 있으면 한 번 켠다
        G.wakeLoop(); r.again = n === 1;                                                  // 두 번째 깨우기는 무시
        hide(true); G._park(true); G.wakeLoop(); r.stay = n === 1 && G._parked() === true; // 아직 숨김이면 안 깨운다
      } finally { window.requestAnimationFrame = saved; hide(false); delete document.hasFocus; G._park(prevParked); }
      var bad = Object.keys(r).filter(function (k) { return !r[k]; });
      return bad.length === 0 ? 'park·wait·run · 깨우기 1회' : ('실패 ' + bad.join(','));
    });

    t('다른 게임의 모듈은 실려 있지 않다', function () {
      var gone = ['world', 'encounter', 'dungeon', 'item'];
      var leaked = gone.filter(function (k) { return !!DG[k]; });
      return leaked.length === 0 && '지도·조우·던전·장비 없음';
    });

    t('데이터는 그대로 물려받았다', function () {
      /* 2026-09-10 — HEROES 일본사 신설(20)+세계사 비유럽 보강(15)으로 70→105 */
      return DG.data.heroes.length === 105 &&
        ('인물 ' + DG.data.heroes.length);
    });

    /* ── 3D 에셋 창고 (PLAN 40절 PHASE 1~2 — 자리를 파고 GLB 를 채웠다) ── */

    t('THREE 가 실려 있다', function () {
      return typeof THREE === 'object' && typeof THREE.GLTFLoader === 'function' &&
        'THREE + GLTFLoader';
    });

    t('2D 들짐승 — 희귀 괴물까지 모두 그림 시트(늑대·토끼·오리·뱀·포자괴물·성간충은 3D 모델을 구운 것), emoji 아님 (CHARACTER_UNIQUENESS ⑤)', function () {
      /* 2026-09-25 — 넷은 맞는 CC0 픽셀 그림이 없어 emoji 였다. 3D 에 서는 그 모델을 옆에서 구워(bake.mjs --sprites=animals) 같은 4줄 시트로 */
      var VV = DG.villageView, VD = DG.villageData;
      if (!VV || !VV._animalSprite || !VD || !VD.ANIMALS) { return false; }
      var plain = Object.keys(VD.ANIMALS);
      var miss = plain.filter(function (k) { var s = VV._animalSprite(k); return !s || !(s.w > 0 && s.h > 0 && s.runFrames >= 1 && s.idleFrames >= 1); });
      var baked = ['wolf', 'rabbit', 'duck', 'snake', 'mushnub', 'spacebug'].every(function (k) { var s = VV._animalSprite(k); return s && s.w === 44 && s.h === 36; });
      if (miss.length || !baked) { throw new Error('시트 없음 ' + miss.join(',')); }
      return '들짐승·희귀 괴물 ' + plain.length + '종 모두 시트 · 여섯은 44×36(3D 모델에서 구움)';
    });

    t('asset3d — 펫 105종 전부 제 모델(또는 사가고와 같은 대역), 늑대·사슴·여우 돌려 입기 아님', function () {
      /* 2026-09-24 — 여태 105종이 늑대·사슴·여우 셋을 id 해시로 돌려 입어 고래도 범도 여우였다(펫 초상 모음) */
      var A3 = DG.asset3d, D = DG.data;
      A3.restore();
      var miss = D.pets.filter(function (p) { var h = A3.lookup('pet', p); return !h || h.key !== 'pet:' + p.id; }).map(function (p) { return p.id; });
      var want = { pt_whale: /animals_extra\/Whale\.glb$/, pt_tiger: /animals\/Tiger\.glb$/, pt_haetae: /standin\/Goleling\.glb$/, pt_dokkaebi: /standin\/Orc\.gltf$/ };
      var bad = Object.keys(want).filter(function (id) { var h = A3.lookup('pet', D.find(id)); return !h || !want[id].test(h.url); });
      /* 2026-09-25 — 대역 28종이 서로 안 겹친다(CHARACTER_UNIQUENESS ④) */
      var SI = ['pt_samjogo','pt_haetae','pt_cheongryong','pt_baekho','pt_jujak','pt_hyeonmu','pt_gumiho','pt_dokkaebi','pt_bulgasari','pt_jeoktoma','pt_jeolyeong','pt_magpie','pk_bulbasaur','pk_charmander','pk_squirtle','pk_magikarp','pk_pikachu','pk_eevee','pk_slowbro','pk_gengar','pk_snorlax','pk_lapras','pk_alakazam','pk_dragonite','pk_charizard','pk_gyarados','pk_mewtwo','pk_mew'], su = {};
      SI.forEach(function (id) { var h = A3.lookup('pet', D.find(id)); su[h ? h.url : 'x'] = 1; });
      if (miss.length || bad.length || Object.keys(su).length !== SI.length) { return false; }
      return '펫 ' + D.pets.length + '종 전부 제 키 · 고래=Whale·범=Tiger·해태=돌정령·도깨비=오크 · 대역 28종 서로 다름';
    });

    t('asset3d 표는 임의 키로도 순수 함수로 검사할 수 있다 (렌더러 없이)', function () {
      var A3 = DG.asset3d;
      var before = Object.keys(A3.REG()).length;
      A3.clear();
      var r = A3.lookup('scratch', { id: 'pine' }) === null &&
        A3.register('scratch', 'x.glb') && A3.lookup('scratch').url === 'x.glb' &&
        A3.register('scratch:pine', 'y.glb') &&
        A3.lookup('scratch', { id: 'pine' }).key === 'scratch:pine';
      A3.restore();
      return r && Object.keys(A3.REG()).length === before &&
        '빈 표 → null · 넓은 키 → 좁은 키 우선 · restore 로 원상복구';
    });

    t('asset3d 기본 표에 PLAN 8·16절 어휘가 다 채워져 있다', function () {
      var A3 = DG.asset3d;
      var need = ['tree:common', 'tree:common:autumn', 'tree:common:snow', 'tree:dead',
        'tree:pine', 'tree:birch', 'bush', 'rock', 'rock:moss', 'grass', 'flower', 'plant',
        'mushroom', 'stump', 'log', 'bench', 'fence', 'cart', 'campfire', 'tent', 'lantern',
        'well', 'bridge', 'animal:an_deer', 'animal:an_wolf', 'animal:an_fox', 'hero'];
      var reg = A3.REG(), missing = need.filter(function (k) { return !reg[k]; });
      return missing.length === 0 && (need.length + '개 키 다 참 · 등록 ' + Object.keys(reg).length + '개');
    });

    t('나무 키는 계절별로 갈라지고, ref.id 로 좁은 키를 먼저 찾는다', function () {
      var A3 = DG.asset3d;
      var spring = A3.lookup('tree:common', {});
      var autumn = A3.lookup('tree:common:autumn', {});
      var dead = A3.lookup('tree', { id: 'dead' });   // 'tree:dead' 를 좁은 키로 먼저 찾는다
      return spring.key === 'tree:common' && autumn.key === 'tree:common:autumn' &&
        spring.url !== autumn.url && dead.key === 'tree:dead' &&
        '봄여름 ≠ 가을 · tree + id:dead → tree:dead';
    });

    t('같은 사람은 늘 같은 몸을 입는다 (hero 조합 해시)', function () {
      var A3 = DG.asset3d;
      var a1 = A3.oneOf(A3.lookup('hero').url, { id: 'h_012' });
      var a2 = A3.oneOf(A3.lookup('hero').url, { id: 'h_012' });
      /* outfit·hair 는 조합형(Quaternius) 레시피에만 있다 — 2026-09-02부터
         기본은 통짜 스킨(Mixamo) 하나라 body 만 있어도 정상이다 */
      return a1 === a2 && a1.body &&
        '같은 id → 같은 조합 (' + a1.key + ')';
    });

    t('heroRecipe — 표에 조합 객체가 있을 때만 몸(+있으면 옷·머리)을 준다', function () {
      var A3 = DG.asset3d;
      var rec = A3.heroRecipe({ id: 'h_012' });
      var ok = rec && rec.body;
      A3.register('hero', 'flat.glb');           // 문자열 하나로 덮으면
      var flat = A3.heroRecipe({ id: 'h_012' });  // 조합이 아니니 null
      A3.restore();
      return ok && flat === null && '조합 객체 → body(+옷·머리) · 문자열 하나 → null';
    });

    t('mapClips — 이름이 뒤섞인 클립도 자리(idle·walk·attack…)를 찾아낸다', function () {
      var A3 = DG.asset3d;
      var m = A3.mapClips(['Armature|mixamo.com|Idle_Loop', 'Walk.001', 'Anim_Attack_Slash', 'RunCycle']);
      var empty = A3.mapClips([]);
      return m.idle === 'Armature|mixamo.com|Idle_Loop' && m.walk === 'Walk.001' &&
        m.attack === 'Anim_Attack_Slash' && m.run === 'RunCycle' &&
        empty.idle === undefined && !!empty.alias &&
        '넷 다 제자리 · 빈 목록 → 빈 표';
    });

    t('mapClips — 못 채운 자리는 대타로 메운다 (idle 하나뿐이면 나머지가 다 그걸로)', function () {
      var A3 = DG.asset3d;
      var m = A3.mapClips(['idle']);
      return m.attack === 'idle' && m.alias.attack === 'idle' &&
        m.hit === 'idle' && m.alias.hit === 'idle' &&
        'attack·hit 모두 idle 대타';
    });

    /* ── VRoid 몸 변형 (vroid-variant.js, 2026-09-20) — 인물 전원에게 VRoid 몸을 나눠 입히고 색만 바꾼다 ─────────── */

    t('vroid-variant — 인물 전원의 머리·옷·눈 칸이 늘 같고(해시), 서로 거의 안 겹친다', function () {
      var V = DG.vroidVariant, heroes = DG.data.heroes, seen = {}, n = 0, again = true, inRange = true;
      heroes.forEach(function (h) {
        var p = V.pick(h.id), q = V.pick(h.id);
        if (p.hair !== q.hair || p.cloth !== q.cloth || p.eye !== q.eye) { again = false; }
        [p.hair, p.cloth, p.eye].forEach(function (v) { if (!(v >= 0 && v < V.N)) { inRange = false; } });
        var k = p.hair + '.' + p.cloth + '.' + p.eye;
        if (!seen[k]) { seen[k] = 1; n++; }
      });
      return heroes.length >= 100 && again && inRange && n >= Math.floor(heroes.length * 0.9) &&
        ('인물 ' + heroes.length + '명 · 서로 다른 조합 ' + n + '(' + V.N + '³ 칸)');
    });

    t('vroid-variant — 머리·옷·눈 재질만 인물 색으로 바꾸고, 피부·얼굴과 원본 재질은 그대로다', function () {
      var V = DG.vroidVariant, TH = window.THREE, i;
      function body() {
        var g = new TH.Group(), names = ['F00_000_00_Body_00_SKIN', 'F00_000_00_Face_00_SKIN', 'F00_000_00_EyeIris_00_EYE',
          'F00_006_01_Tops_01_CLOTH', 'F00_008_01_Bottoms_01_CLOTH', 'F00_001_01_Shoes_01_CLOTH', 'F00_000_Hair_00_HAIR_01'];
        return { g: g, names: names };
      }
      var base = {};
      var mats = {};
      var mk = body();
      mk.names.forEach(function (nm) {
        var m = new TH.MeshStandardMaterial({ name: nm }); mats[nm] = m;
        var mesh = new TH.Mesh(new TH.BoxGeometry(1, 1, 1), m); mk.g.add(mesh);
      });
      /* 두 인물이 머리·옷 칸이 다르고 0 칸이 아닌 것을 고른다 */
      var idA = null, idB = null;
      for (i = 0; i < 400 && !idB; i++) {
        var p = V.pick('t' + i);
        if (p.hair && p.cloth && p.eye) {
          if (!idA) { idA = 't' + i; }
          else { var pa = V.pick(idA); if (pa.hair !== p.hair && pa.cloth !== p.cloth) { idB = 't' + i; } }
        }
      }
      function clone() { var c = new TH.Group(); mk.g.children.forEach(function (m) { c.add(new TH.Mesh(m.geometry, m.material)); }); return c; }
      var a = clone(), b = clone();
      V.apply(a, idA); V.apply(b, idB);
      function matOf(root, nm) { var r = null; root.traverse(function (o) { if (o.isMesh && o.material.name === nm) { r = o.material; } }); return r; }
      var hairA = matOf(a, 'F00_000_Hair_00_HAIR_01'), hairB = matOf(b, 'F00_000_Hair_00_HAIR_01');
      var topA = matOf(a, 'F00_006_01_Tops_01_CLOTH'), botA = matOf(a, 'F00_008_01_Bottoms_01_CLOTH');
      var skinA = matOf(a, 'F00_000_00_Body_00_SKIN'), faceB = matOf(b, 'F00_000_00_Face_00_SKIN');
      var irisA = matOf(a, 'F00_000_00_EyeIris_00_EYE'), irisB = matOf(b, 'F00_000_00_EyeIris_00_EYE');
      var hexDiff = function (x, y) { return x.color.getHex() !== y.color.getHex(); };
      var again = clone(); V.apply(again, idA);
      var ok = !!idB && hairA !== mats['F00_000_Hair_00_HAIR_01'] && hexDiff(hairA, hairB) && hexDiff(topA, botA) && hexDiff(irisA, irisB) &&
        skinA === mats['F00_000_00_Body_00_SKIN'] && faceB === mats['F00_000_00_Face_00_SKIN'] &&
        mats['F00_000_Hair_00_HAIR_01'].color.getHex() === 0xffffff && mats['F00_006_01_Tops_01_CLOTH'].color.getHex() === 0xffffff &&
        matOf(again, 'F00_000_Hair_00_HAIR_01') === hairA;   // 같은 인물·같은 칸은 같은 재질(캐시)

    t('village-view3d — angleLerp 은 최단 방향으로 돈다(경계를 넘어도 먼 길로 안 돈다)', function () {
      var VV3 = DG.villageView3d;
      /* 179° → -179°(≈181°) 는 2° 만 돌면 되는데, 순진하게 빼면(180 - (-179) = 359°)

         sin·cos 로 비교하는 건 각도는 2π 마다 같은 방향을 가리키므로(모듈러
         계산을 직접 다시 하지 않고) "같은 방향인가"만 안전하게 본다 */

      return zero === a && fullMatchesB &&
        Math.abs(half) > Math.PI * 0.99 &&   // 최단 경로라 경계(±π) 부근에 머문다

    });

    t('village-view3d — 시간대 넷(dawn·day·even·night) 모두 밝기·해·반구광 표에 있고, day 가 가장 밝다', function () {

    /** 그 갈래 칸 하나(씨앗이 안 뽑았으면 null) */

      var list = DG.grid.cells(), i;
      for (i = 0; i < list.length; i++) {
        if (list[i].kind === kind && (daily === undefined || list[i].daily === daily)) { return list[i]; }

      return null;

    /** 칸 하나를 (씨앗이 안 뽑았어도) 그 갈래·주기로 만들어 돌려준다 — 진단 전용, 정리는 gridKeep 의 리셋 */

      var c = gridOf(kind, daily);
      if (c && c !== not) { return c; }
      var list = DG.grid.cells(), i;

    /** 흔들기 결과를 확률이 아니라 **정해진 수**로 굴린다 (판정만 본다) */

      var real = Math.random;

      Math.random = real;
      return { r: out, tree: tree };
    }

      var s = V.state(), raw = V.raw();

        s.stung = null;
        DG.bug.reset();
        var b = DG.bug.swarm(raw.player.x + 40, raw.player.y);
        for (var k = 0; k < 40; k++) {
          /* 벌떼는 오른쪽에 있다 — **반대쪽으로** 달아나야 벌어진다
             (벌 쪽으로 달리면 그대로 쏘인다. 실제로 그렇게 한 번 틀렸다) */
          if (flee) { raw.player.x -= 40; }           // 걸음이 벌보다 빠르다

          if (!DG.bug.list().length) { break; }

    t('날씨 — 비 오는 날에만 나오는 것이 있고, 나는 벌레는 숨는다', function () {
      /* poolNow() 는 하늘뿐 아니라 **철·시간대(실제 시각)** 도 본다 — 그 둘을

    t('꽃 — 곁에 다른 꽃이 있어야 교배로 핀다', function () {
      var s = V.state(), T = V.TILE;
      var raw = V.raw();
      /* 꽃이 하나도 없는 풀밭을 찾아 둘을 나란히 심는다. 교배는 "곁에 꽃(kind flower)이 있나"만 본다 —
         정령·힌트가 격자를 채운 뒤로는 사물이 하나도 없는 자리가 없어서(예전 기준), 곁에 다른 *꽃*만 없으면 된다.
         판정은 자리 해시라(markHybrids) 둘 중 하나가 해시 0.45 를 넘는 자리를 고른다 */
      var spot = null, tx, ty;
      for (ty = 3; ty < V.H - 3 && !spot; ty++) {
        for (tx = 3; tx < V.W - 3; tx++) {
          if (V.tileAt(tx, ty) !== 'grass' || V.tileAt(tx + 1, ty) !== 'grass') { continue; }
          var x0 = tx * T + T * 0.5, y0 = ty * T + T * 0.5;
          var busy = raw.props.filter(function (p) {
            return p.kind === 'flower' && Math.hypot(p.x - x0, p.y - y0) < T * 3;
          }).length;
          var lucky = C.hash2(Math.round(x0), Math.round(y0)) > 0.45 ||
            C.hash2(Math.round(x0 + T), Math.round(y0)) > 0.45;
          if (!busy && lucky) { spot = { tx: tx, ty: ty }; break; }
        }
      }
      if (!spot) { return false; }
      var keep = s.planted.slice();

      /* 홀로 심은 것 — 교배가 아니다 */
      s.planted = [{ x: spot.tx * T + T * 0.5, y: spot.ty * T + T * 0.5,
                     kind: 'flower', day: s.day - V.PLANT_DAYS, from: 'azalea' }];
      V.syncPlanted();
      var alone = V.raw().props.filter(function (p) { return p.id === 'pl0'; })[0];
      var soloHybrid = !!alone.hybrid;

      /* 곁에 하나 더 — 이제 교배가 일어난다 */
      s.planted.push({ x: (spot.tx + 1) * T + T * 0.5, y: spot.ty * T + T * 0.5,
                       kind: 'flower', day: s.day - V.PLANT_DAYS, from: 'azalea' });
      V.syncPlanted();
      var pair = V.raw().props.filter(function (p) {
        return p.id === 'pl0' || p.id === 'pl1';
      });
      var anyHybrid = pair.filter(function (p) { return p.hybrid; }).length;

      s.planted = keep;
      V.syncPlanted();
      return soloHybrid === false && anyHybrid > 0 &&
        ('홀로 → 그대로 · 나란히 → 교배 ' + anyHybrid + '송이');
    });

    t('별똥별 — 밤 맑은 하늘에서만, 정해진 때에만 흐른다', function () {
      var T = DG.town, VD = DG.villageData;
      var ph0 = VD.phaseOf, wx0 = VD.weather;
      VD.phaseOf = function () { return VD.PHASES.filter(function (p) { return p.key === 'night'; })[0]; };
      VD.weather = function () { return VD.WEATHERS.clear; };

      /* **별이 흐르는 슬롯**을 골라 훑는다 (안 흐르는 슬롯을 잡으면 아무것도 못 본다) */
      var slot = 100000, i;
      for (i = 0; i < 200; i++) {
        if (C.hash2(slot + i, (slot + i) % 883 + 3) <= 0.5) { slot = slot + i; break; }
      }
      var base = slot * T.STAR_SLOT;
      var onCount = 0;
      for (i = 0; i < T.STAR_SLOT; i += 100) {
        if (T.starNow(base + i)) { onCount++; }
      }
      var rainy = (function () {
        VD.weather = function () { return VD.WEATHERS.rain; };
        var r = T.starNow(base + T.STAR_AT + 100);
        VD.weather = function () { return VD.WEATHERS.clear; };
        return r;
      })();
      var day = (function () {
        VD.phaseOf = function () { return VD.PHASES.filter(function (p) { return p.key === 'day'; })[0]; };
        var r = T.starNow(base + T.STAR_AT + 100);
        VD.phaseOf = function () { return VD.PHASES.filter(function (p) { return p.key === 'night'; })[0]; };
        return r;
      })();

      VD.phaseOf = ph0; VD.weather = wx0;
      /* 흐르는 슬롯이면 창이 열려 있고, 아니면 내내 닫혀 있다 */
      /* 흐르는 슬롯이면 2.6초(=26칸)만 열려 있다 — 하늘 내내 별이 흐르면 안 된다 */
      var want = Math.round(T.STAR_MS / 100);
      return Math.abs(onCount - want) <= 2 && rainy === null && day === null &&
        ('흐르는 슬롯 ' + slot + ' 에서 열린 구간 ' + onCount + '칸(' +

    });

    t('소원 — 별이 흐를 때만, 하룻밤 세 번까지', function () {

    t('마을 평가 — 다음날 최악에도 등급이 그대로면 경고 없음, 문턱 넘으면 뜬다', function () {

      var keep = s.weeds.slice(), i;
      s.weeds = [];
      V.buildProps();
      var b0 = T.beauty();
      if (b0.level <= 0) {                 // 이미 바닥 등급이면 더 떨어질 데가 없다

      s.weeds = [];
      for (i = 0; i < safeWeeds; i++) { s.weeds.push({ x: 100 + i, y: 100 }); }
      V.buildProps();
      var safe = T.beautyWarning();

    t('자가진단은 어드민 손잡이를 읽지도 쓰지도 않는다', function () {
      /* 손잡이를 잡아 둔 기기에서 판정이 흔들리면 안 된다 — 씨앗을 고정한 것과 같은 이유다.

      DG.folk._reset();
      var res = V.raw().residents, r = res[0], raw = V.raw();
      r.home = { x: r.x, y: r.y };
      var savedPX = raw.player.x, savedPY = raw.player.y, savedWalkable = V.walkable;
      V.walkable = function () { return true; };   // 지형과 무관하게 "따라오는가"만 본다

      var started = DG.folk.startFollow(r.id);
      var blocked = !DG.folk.startFollow('nobody-else');    // 이미 걷는 중이면 중복 거절
      var k;
      for (k = 0; k < 100; k++) { DG.folk.update(0.1); }     // 10초
      var d10 = Math.hypot(r.x - r.home.x, r.y - r.home.y);
      var closerThanHome = Math.hypot(r.x - raw.player.x, r.y - raw.player.y) <

      V.walkable = savedWalkable;

     *   ① 덮개가 tileAt 보다 먼저 읽히는가 (통행·사물까지 따라오는가)
     *   ② 되돌리면 **세이브에서도 지워지는가** (안 그러면 마을이 무거워진다)

      for (i = 0; i < raw.props.length; i++) {
        if (Math.floor(raw.props[i].x / T) === tx &&
            Math.floor(raw.props[i].y / T) === ty) { return true; }
      }
      for (i = 0; i < raw.residents.length; i++) {
        if (Math.floor(raw.residents[i].x / T) === tx &&
            Math.floor(raw.residents[i].y / T) === ty) { return true; }
      }
      return false;
    }

    /** 나란한 빈 풀 칸 둘 — 하나에 서고 하나를 고친다 */

        for (var tx = 1; tx < V.W - 2; tx++) {
          if (V.tileAt(tx, ty) !== 'grass' || V.tileAt(tx + 1, ty) !== 'grass') { continue; }
          if (tileBusy(tx, ty) || tileBusy(tx + 1, ty)) { continue; }
          return { stand: { tx: tx, ty: ty }, at: { tx: tx + 1, ty: ty } };
        }
      }
      return null;
    }
