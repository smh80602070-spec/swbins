<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* 주소창에서 파일 이름을 지운다 — /xxx/index.html → /xxx/ */
try{if(location.protocol!=='file:'&&/\/index\.html$/.test(location.pathname))history.replaceState(null,'',location.pathname.replace(/index\.html$/,'')+location.search+location.hash);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7ec8e8">
<title>3마을 — 모으고 나눈다</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3마을">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- 마을 (전체화면) -->
<canvas id="map"></canvas>
<canvas id="map3d"></canvas>
<div id="vignette"></div>
<!-- 가상 조이스틱 — 터치 기기에서만 보인다(village-view.js) -->
<div id="vjoy"><div id="vjoy-knob"></div></div>
<!-- PC 마우스 클릭 방향버튼 — 터치가 아닐 때만 보인다(village-view.js) -->
<div id="vpad">
  <button data-dir="up">▲</button>
  <button data-dir="left">◀</button>
  <button data-dir="down">▼</button>
  <button data-dir="right">▶</button>
</div>

<!-- 상단: 프로필 · 재화 · 도구 — 자동·손쓰기만 붙박이, 나머지는 더보기 뒤로
     (사가종횡·사가천하와 같은 결) -->
<div id="top">
  <div class="glass profile" id="profile"></div>
  <div class="tools">
    <button class="icon-btn" id="btn-auto" title="자동 마을살이 (대신 모으고 나눠 준다)">🤖</button>
    <button class="icon-btn" id="btn-do" title="손을 쓴다 (Space)">✋</button>
    <button class="icon-btn" id="btn-more" title="더보기">⋯</button>
    <div id="top-more">
      <button class="icon-btn" id="btn-sneak" title="살금살금 (Shift) — 벌레가 달아나지 않습니다">🐾</button>
    <button class="icon-btn" id="btn-sound" title="소리 (발소리·낚시·계절 등, 절차적 생성 — 아직 실기 미확인)">🔊</button>
      <button class="icon-btn" id="btn-3d" title="3D 로 걷기 (실험, 세로로 드래그하면 부감⇄어깨너머)">🧊</button>
      <button class="icon-btn" id="btn-camview" title="3D 시점 (어깨너머 ↔ 3/4 부감 쿼터뷰)">🎥</button>
      <button class="icon-btn" id="btn-help" title="도움말">❔</button>
      <a class="icon-btn" id="btn-admin" href="_admin.html" target="_blank" rel="noopener" title="어드민 (QA · 손잡이)">🛠️</a>
      <button class="icon-btn" id="btn-reset" title="처음부터">↺</button>
    </div>
  </div>
  <div class="glass wallet" id="wallet"></div>
</div>

<!-- 자동 상태 -->
<div id="autobar"></div>

<!-- 하단 중앙: 손이 닿는 것 -->
<div id="focusbar"></div>

<!-- 우하단: 액션 독 — 가방·지도만 붙박이, 나머지는 "더보기" 뒤로
     (사가종횡·사가천하와 같은 결) -->
<nav id="dock">
  <div id="dock-more">
    <button data-sheet="folks"><span>🏡</span><small>주민</small></button>
    <button data-sheet="home"><span>🏠</span><small>집</small></button>
    <button data-sheet="mail"><span>📮</span><small>편지</small></button>
    <!-- 공사 — 개토패를 사기 전에는 숨어 있다 (ui.js 의 syncDock) -->
    <button data-sheet="build" style="display:none"><span>🪧</span><small>공사</small></button>
    <button data-sheet="dex"><span>📖</span><small>도감</small></button>
    <button data-sheet="log"><span>📜</span><small>기록</small></button>
    <button data-sheet="keys"><span>⌨️</span><small>키설정</small></button>
    <button data-sheet="settings"><span>⚙️</span><small>설정</small></button>
  </div>
  <button data-sheet="bag"><span>🎒</span><small>가방</small></button>
  <!-- 전체지도 — 구면 마을을 펼쳐서 보는 M키식 토글 (PLAN 34-1절) -->
  <button data-sheet="map"><span>🗺️</span><small>지도</small></button>
  <button id="dock-more-btn"><span>⋯</span><small>더보기</small></button>
</nav>

<!-- 슬라이드 시트 -->
<div id="scrim"></div>
<aside id="sheet">
  <div class="sheet-head">
    <div class="grip"></div>
    <h3 id="sheet-title">가방</h3>
    <button class="icon-btn sm" id="sheet-close">✕</button>
  </div>
  <div id="sheet-body"></div>
</aside>

<div id="encounter"></div><div id="detail"></div>
<div id="toast"></div>

<script src="dist/app.js"></script>
<script>
/* 서비스 워커 — https · localhost 에서만 등록된다.
   파일을 늘리거나 고쳤으면 sw.js 의 VERSION 도 같이 올릴 것. */
(function () {
  if (!('serviceWorker' in navigator)) { return; }
  var h = location.hostname;
  var secure = location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1';
  if (!secure) { return; }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')['catch'](function (e) {
      console.warn('서비스 워커 등록 실패', e);
    });
  });
})();
</script>
</body>
</html>
