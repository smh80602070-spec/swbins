<!-- three 를 **씨앗보다 먼저** 싣는다.
     three 는 켜지면서 UUID 를 만드느라 `Math.random()` 을 **76번** 부른다
     (직접 세어 봤다). 씨앗을 갈아 둔 뒤에 실으면 그 76번이 수열을 밀어
     게임과 무관한 항목이 깨진다 — 실제로 원소 피해 항목 하나가 그렇게 넘어졌다.
     본판(`index.html`)은 순서를 안 바꿨다. 거기서는 씨앗을 안 갈기 때문이다. -->

<script>
window.DG_NO_DRAW = true; window.DG_NO_TUT = true; window.DG_NO_ACCOUNT = true; window.DG_NO_TUNE = true; window.DG_NO_SCENARIO = true;

/* 무작위 고정 — 진단이 굴릴 때마다 달라지면 판정이 흔들린다.
   게임 스크립트보다 **먼저** 갈아 둬야 부트에서 쓰는 난수까지 잡힌다.
   (실제 플레이는 그대로다 — 이 파일 안에서만 바꾼다)
   mulberry32: 짧고 분포가 고르며 같은 씨앗이면 같은 수열이 나온다. */
(function (seed) {
  var s = seed >>> 0;
  Math.random = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  window.DG_SEED = seed;
})(20260824);

/* 2026-09-07 — `_test.html` 3회 재실행이 매번 다른 RESULT(예: 276→274→270)를
   내는 회귀를 잡았다. **진짜 원인** — 완전히 새 브라우저 프로필로 딱 한 번
   돌리면 항상 276/276이었는데, 같은 프로필(같은 localStorage)로 페이지를
   다시 열면 그때부터 흔들렸다. 아래 154행 부근의 `localStorage.
   removeItem(C.SAVE_KEY)`는 **부팅(game.js의 boot())이 이미 끝난 뒤**에야
   실행된다 — `DOMContentLoaded`가 이 스크립트들보다 먼저 끝나 `start()`가
   이미 지난 실행이 남긴 세이브를 읽어 버린 다음이라, "새로 시작하면
   동행 3명"을 가정하는 `출사표` 항목이 그 세이브에 따라 흔들리고, 그 뒤로
   부대·도감을 전제하는 항목들이 줄줄이 밀려 실패했다. **고침 — 이
   스크립트가 실행될 때(= 어떤 게임 스크립트도 아직 안 실린 시점, `boot()`
   보다 훨씬 먼저) localStorage를 통째로 비운다.** 이러면 매번 정말로
   빈 상태에서 시작한다. `AU.update(dt)`처럼 원하는 만큼만 직접 시간을
   미는 이 파일의 방식(위 121행 주석 참고)에는 배경 `requestAnimationFrame`
   루프도 여전히 불필요한 잡음이라 겸사겸사 무력화해 둔다(다만 이번 흔들림의
   주범은 아니었다 — localStorage 쪽이었다). */
try { localStorage.clear(); } catch (e) { /* file:// 등에서 막히면 조용히 넘어간다 */ }
window.requestAnimationFrame = function () { return 0; };
</script>

/* 자가진단 — 헤드리스에서도 돈다 (rAF 가 아니라 setTimeout 을 쓴다).
     chrome --headless=new --virtual-time-budget=25000 --dump-dom http://127.0.0.1:8792/_test.html
*/
(function () {
  var out = [], errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message); });

  /* W-0122 — "실패 …" 로 시작하는 설명 글은 실패다(사가만리 t 와 같은 규칙). 전엔 빈 글이 아니라서 PASS 로 찍혀 실패 여덟 곳이 숨었다 */
  function t(name, fn) {
    try {
      var r = fn(), ok = !!r && !(typeof r === 'string' && /^실패 /.test(r));
      out.push((ok ? '<span class="pass">PASS</span> ' : '<span class="fail">FAIL</span> ') +
        name + (typeof r === 'string' ? ' — ' + r : ''));
      return ok;
    } catch (e) {
      out.push('<span class="fail">FAIL</span> ' + name + ' — 예외: ' + e.message);
      return false;
    }
  }

  setTimeout(function () {
    var C = DG.core, D = DG.data, HR = DG.hero;
    var DN = DG.dungeon, IT = DG.item, AU = DG.auto, G = DG.game;
    localStorage.removeItem(C.SAVE_KEY);

    /* ── 진단용 밑작업 ──────────────────────────────────
     * 2026-08-26 에 **요구 수준(要求)** 이 들어왔다 — 원작처럼 좋은 물건은
     * 인물 레벨이 차야 입는다. 그런데 진단에는 갓 출사표로 붙은 **1레벨 인물**에게
     * 수준 20짜리를 입히는 항목이 많다. 실제 플레이에서는 깊이 내려가는 동안
     * 인물도 같이 크므로 저절로 맞는 자리다.
     * 그래서 여기서 **동행을 한 번 키워 둔다.** 요구 수준 자체는 아래 전용 항목이
     * 낮은 레벨로 따로 검사한다.
     */
    function levelParty(lv) {
      C.save.party.forEach(function (hid) {
        C.save.heroes[hid] = C.save.heroes[hid] || { lv: 1, exp: 0, rank: 0 };
        C.save.heroes[hid].lv = lv;
      });
    }

    /* ── 갈라져 나온 프로젝트로서의 조건 ─────────────── */

    /* W-0295 PBR 땅 — 공용 pbrground3d 값 층(three 없이) */
    t('3D 자체 땅 타일(W-0355, K-0136) — 마을 바닥 = dg_town_dirt · 던전 층은 돌바닥·굴 바위가 옛 석 장과 함께 후보 · 공용 주소 전엔 옛 석 장(null) · 파일 있음', function () {
      var D3 = DG.dungeon3d, A3 = DG.assets3d, s0 = A3.state, r0 = A3.root, R = '../shared/assets/'; var ex = function (u) { try { var x = new XMLHttpRequest(); x.open('HEAD', u, false); x.send(); return x.status === 200; } catch (e) { return false; } };
      var before = (A3.state = function () { return 'loading'; }, D3._groundTile({ town: true, floor: 1, roomIdx: 0 }));
      A3.state = function () { return 'ok'; }; A3.root = function () { return R; };
      var town, picks = {}, i;
      try { town = D3._groundTile({ town: true, floor: 1, roomIdx: 0 }); for (i = 1; i <= 40; i++) { picks[D3._groundTile({ town: false, floor: i, roomIdx: i % 4 }).split('/').pop()] = 1; } } finally { A3.state = s0; A3.root = r0; }
      var r = [before === null, town === (DG.core.tuned('dungeon3d.townMud', 1) ? R + 'ground/mud_gravel_512.webp' : R + 'tiles/ground/dg_town_dirt.webp'),   /* W-0415 마을 바닥 = K-0193 진흙 자갈(손잡이 0 = 옛 dg_town_dirt) */ !!(picks['dg_dungeon_stone.webp'] || picks['dg_cave_rock.webp']), (s0.call(A3) !== 'ok' || ['dg_town_dirt', 'dg_dungeon_stone', 'dg_cave_rock'].every(function (n) { return ex(r0.call(A3) + 'tiles/ground/' + n + '.webp'); }))];   // 파일은 진짜 공용 주소가 섰을 때만(진단 서버는 판 폴더만 내줄 수 있다)
      return r.every(Boolean) && ('마을 흙 · 던전 후보 ' + Object.keys(picks).length + '장') || '실패 ' + r.join(',');
    });
    t('적 초상·몸 종 id 먼저(W-0354) — 적 134 마다 초상이 있으면 파일이 있음(404 0) · body 초상이 있는 적은 초상 id = body = 3D 몸 id · 사람 적은 자체 NPC 몸 초상 · 보스는 옛 길', function () {
      var MP = DG.monsterPortrait, E = DG.enemyData.enemies, miss = [], byBody = 0, hum = 0, mism = [];
      E.forEach(function (e) {
        var id = MP.idOf(e, false);
        if (id && !MP.has(id)) { miss.push(e.name + ':' + id); }
        if (e.body && MP.has(e.body)) { byBody++; if (id !== e.body || MP.bodyOf(e, false) !== e.body) { mism.push(e.name); } }
        if ((e.kind === 'human' || e.look) && MP.HUMAN[e.name]) { hum++; if (id !== MP.HUMAN[e.name] || MP.bodyOf(e, false) !== null) { mism.push(e.name); } }
      });
      var b = DG.enemyData.bosses && DG.enemyData.bosses[0], bossOk = !b || /^boss_[0-9]+$/.test(MP.idOf(b, true) || '');
      return !miss.length && !mism.length && byBody > 40 && hum >= 18 && bossOk && ('적 ' + E.length + ' · 종 몸 초상 ' + byBody + ' · 사람 짝 ' + hum + ' · 404 0') || '실패 miss ' + miss.slice(0, 4).join(',') + ' mism ' + mism.slice(0, 4).join(',') + ' ' + byBody + '/' + hum + '/' + bossOk;
    });
    t('끌어 놓기 손놀림(W-0362) — 마우스 6px 끌기 → 받는 칸에 놓음 · 안 받는 칸은 취소 · 짧은 터치는 집지 않음 · 길게 누르기 → 집음 · 먼저 움직인 터치는 스크롤로 넘김 · 취소', function () {
      var DD = DG.dragdrop, host = document.createElement('div'), got = [];
      host.style.cssText = 'position:fixed;left:0;top:0;width:300px;height:100px;z-index:99999';
      host.innerHTML = '<div data-dd="A" style="position:absolute;left:10px;top:10px;width:40px;height:40px"></div><div data-dd-drop="T" style="position:absolute;left:200px;top:10px;width:60px;height:60px"></div><div data-dd-drop="N" style="position:absolute;left:120px;top:10px;width:40px;height:40px"></div>';
      document.body.appendChild(host);
      DD.bind(host, { accepts: function (i, k) { return k === 'T'; }, drop: function (i, k) { got.push(i + '>' + k); } });
      var src = host.firstChild, pe = function (type, x, y, pt) { DD._feed(type.replace('pointer', ''), { target: src, clientX: x, clientY: y, pointerId: pt === 'touch' ? 7 : 1, pointerType: pt }, host); };   // DOM 이벤트 없이(판의 첫 눌림을 안 건드림)
      pe('pointerdown', 30, 30, 'mouse', src); pe('pointermove', 120, 40, 'mouse'); pe('pointermove', 230, 40, 'mouse'); pe('pointerup', 230, 40, 'mouse');
      var r = [got.join() === 'A>T'];
      pe('pointerdown', 30, 30, 'mouse', src); pe('pointermove', 140, 30, 'mouse'); pe('pointerup', 140, 30, 'mouse'); r.push(got.length === 1);
      pe('pointerdown', 30, 30, 'touch', src); pe('pointerup', 30, 30, 'touch'); r.push(got.length === 1 && !DD.active());
      pe('pointerdown', 30, 30, 'touch', src); var held = DD._holdNow(); pe('pointermove', 230, 40, 'touch'); pe('pointerup', 230, 40, 'touch'); r.push(held && got.length === 2);
      pe('pointerdown', 30, 30, 'touch', src); pe('pointermove', 30, 60, 'touch'); r.push(!DD._holdNow()); pe('pointerup', 30, 60, 'touch');
      pe('pointerdown', 30, 30, 'touch', src); DD._holdNow(); pe('pointercancel', 30, 30, 'touch'); var st = DD._state(); DD._feed('down', { target: host.children[1], clientX: 230, clientY: 40, pointerId: 8, pointerType: 'touch' }, host); r.push(st && st.picked && got.length === 3 && !DD.active());   // 집은 뒤 브라우저가 스크롤을 가져감 → 들고 있는 채 → 받는 칸을 눌러 놓음
      pe('pointerdown', 30, 30, 'mouse', src); pe('pointermove', 120, 40, 'mouse'); var act = DD.active(); DD.cancel(); pe('pointerup', 230, 40, 'mouse'); r.push(act && got.length === 3 && !document.querySelector('.dd-ghost'));
      r.push(DD.decide('touch', 100, 2) === 'wait', DD.decide('touch', 400, 2) === 'pick', DD.decide('touch', 100, 20) === 'scroll', DD.decide('mouse', 0, 7) === 'pick');
      host.remove();
      return r.every(Boolean) && '끌기·취소·짧은 터치·길게 누르기·스크롤 넘김·들고 있는 채 · 판정 넷' || '실패 ' + r.join(',');

    function pwWith(fn) {

    /** 찍은 곳에서 stats[key] 가 있는 가장 가까운 마디 */

    t('투전 — 등급 저울이 던전 드랍보다 위쪽으로 두껍다', function () {
      /* 값이 비싼 대신 좋은 등급이 잘 나온다는 것이 도박의 전부다.
         굴려서 세면 판마다 흔들리니 **저울 자체**를 견준다. */
      function mean(w) {
        var tot = 0, sum = 0, i;
        for (i = 0; i < w.length; i++) { tot += w[i]; sum += w[i] * i; }
        return sum / tot;
      }
      var drop = mean(DG.itemData.TIERS.map(function (x) { return x.weight; }));
      var gam = mean(VD.GAMBLE_W);
      return gam > drop * 1.8 &&
        ('평균 등급 드랍 ' + drop.toFixed(2) + ' vs 투전 ' + gam.toFixed(2));
    });

    t('세계 앵커(PLAN §28-8) — 마을 넷의 발판이 서로 안 겹친다', function () {
      /* §28-8(오픈월드 A안)부터 마을은 세계 좌표 위의 실제 지점(앵커)에

      var T = DG.town, DN2 = DG.dungeon, R = DN2.fieldRadiusUnits();
      var anchors = T.worldAnchors(), ids = Object.keys(anchors), i, j, minGap = Infinity;
      var halfSpan = Math.max(T.ROOM_W, T.ROOM_H) + R;   // 넉넉한 반경 추정(대각선 아님, 상한)
      for (i = 0; i < ids.length; i++) {
        for (j = i + 1; j < ids.length; j++) {
          var a = anchors[ids[i]], b = anchors[ids[j]];
          var d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < minGap) { minGap = d; }

         ' > 발판+반경*2(' + Math.round(halfSpan * 2) + ')');

         마을 없음)을 지나 (b) 갈대나루로 자연히 갈리는지, (c) 그때마다

    /* ── 들판 (field3d) — 3D 전환 2단계 ─────────────────────
     * PLAN 4·5·6절. **전부 순수 함수**라 화면 없이 값으로 다 본다 —
     * 씨앗이 같으면 같은 세상인가 · 조각이 몇이나 되는가 · 방 안은 평평한가.

    var F3 = DG.field3d;

    t('들판 — 같은 씨앗이면 같은 세상이다 (PLAN 5절)', function () {
      var a = F3.seedOf(14, 2, '산채'), b2 = F3.seedOf(14, 2, '산채');
      var c2 = F3.seedOf(15, 2, '산채'), d2 = F3.seedOf(14, 3, '산채');
      var l1 = F3.chunkAt(2, -1, a, 2, 1).map(function (p) { return p.t; }).join('/');
      var l2 = F3.chunkAt(2, -1, b2, 2, 1).map(function (p) { return p.t; }).join('/');
      return a === b2 && a !== c2 && a !== d2 && l1 === l2 && l1.length > 0 &&
        ('14층 2방 씨앗이 늘 같다 · 조각 하나 = ' + l1);

    t('들판 — 방 안팎 다 평평하다 (2026-09-08, 사용자 요청으로 기복 제거)', function () {
      /* 옛 기대(방 밖은 기복)를 사용자가 "평평하게 해달라"로 뒤집었다 —
         heightAt()은 이제 인자와 무관하게 늘 0이다 */
      var W = DN.ROOM_W, H = DN.ROOM_H;
      var s = F3.seedOf(14, 0, 'x');
      var inside = [[10, 10], [W / 2, H / 2], [W - 10, H - 10]]
        .map(function (p) { return F3.heightAt(p[0], p[1], s, W, H); });
      var far = [];
      for (var i = 1; i <= 6; i++) { far.push(F3.heightAt(-i * 120, -i * 120, s, W, H)); }
      var flat = inside.every(function (v) { return v === 0; });
      var farFlat = far.every(function (v) { return v === 0; });
      return flat && farFlat && '방 안팎 아홉 자리 전부 높이 0';
    });

    t('들판 — 방 가까이는 사람이 지난 자리다 (PLAN 5절 "플레이 가능한 결과만")', function () {
      /* 완전 랜덤이면 방 바로 옆이 절벽으로 막히기도 한다 — 가까이는 길·캠프·폐허다 */
      var s = F3.seedOf(20, 1, 'y'), i, near = {}, far = {};
      for (i = 0; i < 40; i++) {

        far[F3.kindOf(i, -5, s + i, 4)] = 1;

    t('들판 — 방보다 대여섯 배 넓다 (PLAN 6절)', function () {
      var W = DN.ROOM_W, H = DN.ROOM_H;
      var sv = F3.survey(F3.seedOf(14, 0, 'z'), 3, W, H);
      var room = Math.max(W, H);

        (sv.span / room) >= 2 &&

    t('들판 — 절벽·동굴·제단처럼 큰 것은 ring 2 에는 안 선다', function () {
      /* 2026-08-30, 실기기(PC) — "1층 시작하자마자 캐릭터를 가린다" 로
         잡힌 버그. 절벽(h 120~270 · s 최대 2.8)이 방에서 chunk 하나
         남짓(ring 2, 카메라 거리 700 안쪽)에도 날 수 있었다 — 카메라는
         회전이 없어(17행) 한 번 걸리면 그 방을 볼 때마다 막힌다.
         ring 2 는 작은 것(숲·바위·폐허·길·물)까지만, 큰 것은 ring 3부터. */
      var BIG = { cliff: 1, cave: 1, altar: 1, camp: 1 };
      var s = F3.seedOf(11, 2, 'z'), hit = 0, cx, cz;
      for (cz = -6; cz <= 6; cz++) {
        for (cx = -6; cx <= 6; cx++) {
          if (F3.ringOf(cx, cz, 560, 360) === 2 && BIG[F3.kindOf(cx, cz, s, 2)]) { hit++; }
        }
      }
      return hit === 0 && 'ring 2 에서 절벽·동굴·제단·야영지 0번';
    });

    t('들판 — 이웃한 조각이 같은 성격으로 뭉치지 않는다', function () {
      /* 격자 좌표용 해시를 쓰면 이웃한 입력이 이웃한 답을 준다 —
         그러면 온 세상이 숲 한 판이 된다(사가만리에서 밟은 그 함정) */
      var s = F3.seedOf(3, 1, 'q'), same = 0, n = 0, cx, cz;
      for (cz = -5; cz <= 5; cz++) {
        for (cx = -5; cx < 5; cx++) {

        }
      }
      return same / n < 0.35 &&
        ('가로로 이웃한 110쌍 중 같은 성격은 ' + same + '쌍 (' +
         Math.round(same / n * 100) + '%)');

    t('들판 — 밀도를 내리면 세울 것이 준다', function () {
      var s = F3.seedOf(9, 0, 'r');
      var full = 0, half = 0, cx, cz;
      for (cz = -3; cz <= 3; cz++) {
        for (cx = -3; cx <= 3; cx++) {
          full += F3.chunkAt(cx, cz, s, 2, 1).length;
          half += F3.chunkAt(cx, cz, s, 2, 0.4).length;
        }
      }
      return half < full && half > 0 &&
        ('배수 1 → ' + full + '개 · 0.4 → ' + half + '개');

    t('들판 — 값을 내도 세이브는 그대로다', function () {
      var before = JSON.stringify(C.save);
      var s = F3.seedOf(11, 2, 't');

    /* ── 층 테마 편향 (2026-09-05, PLAN 9절 Biome) ──────────────
     * `kindOf()`가 다섯째 인자로 테마 이름을 받아 오브젝트 비율을 바꾼다.
     * 여태는 색깔(data-dungeon.js)만 층마다 다르고 무엇이 서는지는 여섯 층이

    t('들판 테마 — 테마를 안 주면 예전과 완전히 같다 (회귀 방지)', function () {
      /* weightedKind() 로 갈아 끼운 뒤에도 이 자가진단의 다른 들판 항목이
         전부 그대로 통과해야 한다는 것 자체가 이미 회귀 증거지만, 여기서
         명시적으로 한 번 더 박아 둔다 — 다음에 THEME_BIAS 표를 고치다
         기본값(가중치 없음)을 실수로 건드리면 이 항목 하나만 바로 깨진다 */
      var s = F3.seedOf(23, 0, 'nobias'), cx, cz, seen = {};
      for (cz = -6; cz <= 6; cz++) {
        for (cx = -6; cx <= 6; cx++) { seen[F3.kindOf(cx, cz, s, 3)] = 1; }

    });

    t('들판 테마 — 수궁은 물·늪이, 산채는 숲이 뚜렷이 는다', function () {
      var cx, cz, i, water1 = 0, water2 = 0, forest1 = 0, forest2 = 0, n = 0;
      var floors = [5, 12, 19, 26, 33, 40, 47];   // 씨앗 여럿 평균 — 표본 하나로 요행 안 걸리게
      floors.forEach(function (fl) {
        var sNone = F3.seedOf(fl, 0, '수궁(水宮)');   // seedOf 자체도 테마 문자열을 섞으므로
        var sSwamp = sNone, sForest = F3.seedOf(fl, 0, '산채(山寨)');

            if (k1 === 'water' || k1 === 'swamp') { water1++; }
            var k1b = F3.kindOf(cx, cz, sSwamp, 3);   // 같은 자리·테마만 뺀 대조군
            if (k1b === 'water' || k1b === 'swamp') { water2++; }
            var k2 = F3.kindOf(cx, cz, sForest, 3, '산채(山寨)');
            if (k2 === 'forest') { forest1++; }

         forest1 + ' vs 무편향 ' + forest2 + ' (표본 ' + n + ')');
    });

    /* ── 잡초 층 (2026-09-04, clutterAt) — SAGA WEB.md 감사로 채운 자리 ──
     * chunkAt() 과 갈라 둔 순수 함수라 여기서도 값으로만 본다. */

    t('잡초 — 같은 씨앗이면 같은 잡초다', function () {
      var s = F3.seedOf(5, 1, '숲');
      var l1 = F3.clutterAt(1, 0, s, 2, 1).map(function (p) { return p.t; }).join('/');
      var l2 = F3.clutterAt(1, 0, s, 2, 1).map(function (p) { return p.t; }).join('/');
      return l1 === l2 && ('한 조각 = ' + (l1 || '(없음)'));
    });

    t('잡초 — 물·동굴에는 안 심는다', function () {
      var s = F3.seedOf(14, 0, 'w'), cx, cz, bad = 0, n = 0;
      for (cz = -8; cz <= 8; cz++) {
        for (cx = -8; cx <= 8; cx++) {
          var ring = F3.ringOf(cx, cz, 560, 360);
          var kind = F3.kindOf(cx, cz, s, ring);
          if (kind !== 'water' && kind !== 'cave') { continue; }
          n++;
          if (F3.clutterAt(cx, cz, s, ring, 1).length) { bad++; }
        }
      }
      return n > 0 && bad === 0 && ('물·동굴 조각 ' + n + '개 모두 잡초 0개');
    });

    t('잡초 — 덤불·버섯·통나무는 숲에서만 난다', function () {
      var s = F3.seedOf(6, 0, 'f'), cx, cz, offForest = 0;
      var WOOD = { bush: 1, mushroom: 1, log: 1 };
      for (cz = -8; cz <= 8; cz++) {
        for (cx = -8; cx <= 8; cx++) {
          var ring = F3.ringOf(cx, cz, 560, 360);
          var kind = F3.kindOf(cx, cz, s, ring);
          if (kind === 'forest') { continue; }
          F3.clutterAt(cx, cz, s, ring, 1).forEach(function (p) {
            if (WOOD[p.t]) { offForest++; }
          });
        }
      }
      return offForest === 0 && '숲이 아닌 조각에서 덤불·버섯·통나무 0개';

    t('잡초 — 밀도를 내리면 잡초도 준다', function () {
      var s = F3.seedOf(8, 1, 'd'), full = 0, half = 0, cx, cz;
      for (cz = -3; cz <= 3; cz++) {
        for (cx = -3; cx <= 3; cx++) {
          var ring = F3.ringOf(cx, cz, 560, 360);
          full += F3.clutterAt(cx, cz, s, ring, 1).length;
          half += F3.clutterAt(cx, cz, s, ring, 0.4).length;
        }
      }
      return half <= full && full > 0 &&
        ('배수 1 → ' + full + '개 · 0.4 → ' + half + '개');
    });

    /* ── 판정을 방에서 필드로 잇는다 (4a67af2, PLAN 4·5·6절 나머지 절반) ──
     * 위 들판 테스트들은 field3d 가 값을 잘 내는지만 본다 — 그 값을 실제로

    t('필드 on — 던전 방 안에서 옛 벽 경계를 넘어 걸어 나간다', function () {
      D3.set('dg3d.field', 1);
      DN.enter({ floor: 1, mode: 'easy' });

      var oldHiX = DN.ROOM_W - DN.WALL - DN.P_R;   // 옛(필드 없던 시절) 오른쪽 클램프

      D3.set('dg3d.field', 0);
      DN.enter({ floor: 1, mode: 'easy' });
      var run = DN.raw();
      var oldHiX = DN.ROOM_W - DN.WALL - DN.P_R;
      run.player.x = oldHiX - 5; run.player.y = DN.ROOM_H / 2;

    /* ── 전투 연출 (fx3d) — 3D 전환 3단계 ────────────────────
     * PLAN 51·52·53절. 판정이 흘려 주는 fx 를 입체로 세우는 층이다.

    var FX = DG.fx3d;

      return plain === 0xffffff && crit !== plain && res !== plain && foe !== plain &&

        ('여느 값 #' + plain.toString(16) + ' · 회심 #' + crit.toString(16) +

    t('연출 — 글리프판에 없는 글자는 자리를 비운다', function () {
      /* 한글은 판에 없다 — 없는 글자에 0번 칸(숫자 0)이 뜨면 엉뚱한 값이 보인다 */
      var num = FX.glyphs('★12');

    t('연출 — 사그라지며 흐려지고 떠오른다', function () {
      var fresh = FX.plan({ t: 'hit', x: 0, y: 0, v: 30, life: 0.58 });

    t('연출 — 잇달아 뜬 숫자는 칸을 나눠 비킨다(W-0077): 같은 자리 셋 0·1·2, 먼 것·0.35초 지난 것 0, 1 칸 오른쪽·2 칸 왼쪽·위로', function () {
      var L = [{ t: 'hit', x: 100, y: 100, v: 1, life: 0.6 }, { t: 'hit', x: 104, y: 98, v: 2, life: 0.6 }, { t: 'elem', x: 98, y: 102, v: 3, life: 0.6 },
               { t: 'hit', x: 400, y: 100, v: 4, life: 0.6 }, { t: 'pop', x: 100, y: 100, life: 0.5 }], i, s = [];
      for (i = 0; i < L.length; i++) { s.push(FX.slotOf(L, i)); }

    t('퀘스트 — 지역은 최고 도달 층이 닿아야 열리고, 안 닿은 지역은 잠긴 채다', function () {

    t('퀘스트 — 방 발견(discover)과 구출(rescue)이 각각 다른 퀘스트를 채운다', function () {
      var Q = DG.quest, keep = C.save.quest;

      Q._onKill({ e: { elite: 'brute', boss: false }, floor: 1 });

    t('퀘스트 — 현상(무작위)은 늘 하나 떠 있고, 다시 뽑기가 딴 것으로 바꾼다', function () {

    /* 맨 끝에 둔다 — 세이브를 실제로 비우므로 뒤에 상태를 쓰는 항목이 있으면 안 된다.

    t('reset — 빈 세이브를 v:1 로 저장해 두지 않는다 (다음 load 가 fresh 로 보이게)', function () {
      C.reset();
      var raw = localStorage.getItem(C.SAVE_KEY);
      var loadsAsFresh = C.load() === false;

    t('출사표 자가치유 조건 — 세이브가 있어도 동행·도감이 둘 다 비면 fresh 로 잡힌다', function () {
      /* 옛 reset() 이 남긴 "빈 채로 저장된 v:1" 세이브를 흉내낸다.

         fresh 를 다시 true 로 되돌린다 — 그 조건이 여기서도 참이어야 한다

      localStorage.setItem(C.SAVE_KEY, JSON.stringify({
        v: 1, createdAt: Date.now(), lastSeen: Date.now(),
        player: {}, dex: { heroes: {}, pets: {} }, party: [], settings: {}, log: []
      }));
      var fresh = !C.load();

    /* 아래 둘은 일부러 맨 끝 가까이 둔다 — `DN.enter()`/`leave()` 를 여섯 번
       더 돌리면 그때마다 방·전리품을 새로 굴리며 공유 RNG 수열을 상당히
       소비한다. 앞쪽에 끼워 넣었더니 그 뒤에 오는 무관한 항목(부문어 순서)의
       수열이 밀려 실패했다 — 자리를 맨 끝으로 옮겨 그 뒤에 오는 항목이
       "진단의 무작위는 씨앗으로 고정된다"·"런타임 에러 없음" 둘뿐이 되게
       했다(둘 다 정확한 수열 값을 안 따진다). */
    t('지역 도감 — 층 테마 여섯 곳에 처음 닿으면 등록된다', function () {
      /* 이 자리(맨 끝)에 오면 위쪽 "reset" 항목이 이미 부대를 비워 둔 뒤다 —
         `enter()` 는 부대가 없으면 거절하므로 임시로 하나 채워 준다(다른
         항목들의 "keep → 임시로 갈아끼움 → 복원" 과 같은 손짓). */
      var keep = C.save.dex.regions, keepParty = C.save.party.slice();
      C.save.dex.regions = {};
      if (!C.save.party.length) { C.save.party = [D.heroes[0].id]; }
      var seq = DG.dungeonData.THEMES.map(function (th) { return th.from; });
      var counts = seq.map(function (floor) {
        if (DN.active()) { DN.leave(); }
        DN.enter({ floor: floor });
        return Object.keys(C.save.dex.regions).length;
      });
      if (DN.active()) { DN.leave(); }
      var monotone = counts.every(function (n, i) { return n === i + 1; });
      C.save.dex.regions = keep;
      C.save.party = keepParty;
      return monotone && ('여섯 지역 순서대로 ' + counts.join('→'));
    });

    t('도감 완성 — 지역 전부를 밟으면 한 번만 보상', function () {
      var keepDex = C.save.dex.regions, keepGold = C.save.player.gold, keepFeat = C.save.player.feat;
      var names = DG.dungeonData.THEMES.map(function (th) { return th.name; });
      C.save.dex.regions = {};
      delete C.save.dex.regionsFull;
      names.forEach(function (nm, i) { if (i < names.length - 1) { C.save.dex.regions[nm] = true; } });
      var last = names[names.length - 1];
      var goldBefore = C.save.player.gold, featBefore = C.save.player.feat;
      C.emit('dex:new', { cat: 'regions', id: last });    // 마지막 지역 — 아직 도감엔 없다
      C.save.dex.regions[last] = true;
      C.emit('dex:new', { cat: 'regions', id: last });     // 등록된 뒤 다시 알림 — 이제 완성
      var gained1 = C.save.player.gold - goldBefore, featGained1 = C.save.player.feat - featBefore;
      C.emit('dex:new', { cat: 'regions', id: last });     // 또 와도 두 번은 안 준다
      var gained2 = C.save.player.gold - goldBefore;
      var ok = gained1 === 800 && featGained1 === 30 && gained2 === 800 && C.save.dex.regionsFull === true;
      C.save.dex.regions = keepDex; C.save.player.gold = keepGold; C.save.player.feat = keepFeat;
      delete C.save.dex.regionsFull;
      return ok && ('완성 보상 금 +' + gained1 + ' · 공적 +' + featGained1 + ', 재지급 없음');
    });

    /* ── 던전도 "걸어서 이어지게" — Phase 1 (PLAN §28-4, 2026-09-05) ──
     * 던전 입구(굴혈)를 마을방 안 고정 표식에서 모루골의 'W' 들길로
     * 옮겼다. 다른 세 들길(N=자작재·E=갈대나루·S=소금벌)과 방향이 안
     * 겹치는지, 옛 마을방 표식(gate)이 더 안 서는지, 새 표식이
     * enterGate()로 정확히 라우팅되는지를 본다. */

      var T = DG.town, exits = T.exitsOf('moru');
      var dirs = exits.map(function (e) { return e.dir; });
      var uniq = dirs.filter(function (d, i) { return dirs.indexOf(d) === i; });
      var dungeonExit = exits.filter(function (e) { return e.to === 'dungeon'; });
      return dirs.length === uniq.length && dungeonExit.length === 1 &&
        ('모루골 들길 ' + dirs.length + '개 · 방향 ' + dirs.join('/') + ' · 겹침 없음');

    t('굴혈(gate) 마을방 고정 표식은 더 안 선다', function () {
      var T = DG.town;
      T._reset('moru');
      var gateMarks = T.raw().room.marks.filter(function (o) { return o.key === 'gate'; });
      var exitDungeon = T.raw().room.marks.filter(function (o) { return o.key === 'exit_dungeon'; });
      return gateMarks.length === 0 && exitDungeon.length === 1 &&
        ('gate 0개(제거됨) · exit_dungeon 1개(대체) · 이름 ' + exitDungeon[0].name);
    });

    t('던전 문마다 통로 하나(PLAN §28-4 Phase 2) — 옛 벽에선 안 넘어가고 통로 끝에서만 넘어간다', function () {
      /* 이 자리(맨 끝)에 오는 이유는 위 지역 도감 항목과 같다 — DN.enter()가
         공유 RNG 수열을 꽤 소비하고, 그 뒤엔 씨앗 고정·런타임 에러 항목 둘뿐이라
         정확한 수열 값을 안 따진다. */
      var keepParty = C.save.party.slice();
      if (!C.save.party.length) { C.save.party = [D.heroes[0].id]; }
      if (DN.active()) { DN.leave(); }
      DN.enter({ floor: 1 });
      var run = DN.raw();
      run.room.cleared = true;                  // 통로 자체(door-touch)만 골라 보려 정리 여부는 배제
      var doors = run.room.doors, corridors = run.corridors;
      var unit = DN._doorCorridorUnits();
      var mapOk = doors.length > 0 && doors.length === corridors.length &&
        corridors.every(function (co, i) {
          return co.dir === 'E' && co.laneAt === doors[i].y && co.extra === unit;
        });
      var oldWallX = DN.ROOM_W - DN.WALL - DN.P_R, farX = oldWallX + unit;
      var dr = doors[0];
      DN.setInput(0, 0);
      run.player.x = oldWallX + 4; run.player.y = dr.y;
      DN.update(0.016);
      var firedAtWall = DN.raw().roomIdx !== 0;
      run.player.x = farX + 2; run.player.y = dr.y;
      DN.update(0.016);
      var firedAtFar = DN.raw().roomIdx === 1;
      if (DN.active()) { DN.leave(); }
      C.save.party = keepParty;
      return mapOk && !firedAtWall && firedAtFar &&
        ('문 ' + doors.length + '개 · laneAt=문y·extra=' + unit + ' · 옛 벽 안 걸림 · 통로 끝(+' + unit + ')에서 걸림');
    });

    t('던전 계단문 통로만 필드 소품이 테마를 갈아입는다(PLAN §28-4 Phase 3, 통로:계단)', function () {
      /* 순수 함수 시험이라 자리가 어디든 상관없다(RNG 안 씀) — 위 항목들
         바로 다음에 둔 것은 §28-4 절 안에서 이어 보기 좋아서일 뿐이다. */
      var F = DG.field3d, W = DN.ROOM_W, H = DN.ROOM_H;
      var spanX = Math.floor(W / F.CHUNK), farCx = spanX + 1;
      var laneCz = 0;                              // gz = CHUNK/2 = 100
      var stairCo = { dir: 'E', lane: 34, laneAt: F.CHUNK / 2, extra: 200, kind: 'stair' };
      var forageCo = { dir: 'E', lane: 34, laneAt: F.CHUNK / 2, extra: 200, kind: 'forage' };
      var stairTheme = F.corridorNameAt(farCx, laneCz, W, H, [stairCo]);
      var forageTheme = F.corridorNameAt(farCx, laneCz, W, H, [forageCo]);
      var outside = F.corridorNameAt(farCx, laneCz + 3, W, H, [stairCo]);   // 결 밖 — null
      var inside = F.corridorNameAt(spanX, laneCz, W, H, [stairCo]);       // 통로 밖(방 안 칸) — null
      return stairTheme === '통로:계단' && forageTheme === null && outside === null && inside === null &&
        ('계단문=' + stairTheme + ' · 그 외 문=층 테마(null) · 결 밖·방 안=null');
    });

    t('통로 결 안에서만 다음 방 텍스처를 미리 당길 대상으로 잡는다(PLAN §28-4 Phase 4, 결 밖·마을 통로는 안 걸린다)', function () {
      /* 순수 함수 시험 — T(three) 없이도 돈다. rawTex()(실제 텍스처 요청)는
         3D init() 뒤에만 의미가 있어 여기선 안 건드리고, "어느 (floor,roomIdx)를
         당길지" 예측만 본다(§28-4 Phase 4). */
      /* d() 는 마을이 켜져 있으면 마을의 방 크기를 쓴다 — 앞 시험이 마을을 켜 둔 채면 문 자리가 어긋난다 */
      if (DG.town && DG.town.active()) { DG.town.leave(); }
      var run = { floor: 3, roomIdx: 2, corridors: [
        { dir: 'E', lane: 34, laneAt: 100, extra: 200, kind: 'forage' },
        { dir: 'E', lane: 34, laneAt: 300, extra: 200, kind: 'stair' },
        { dir: 'E', lane: 90, to: 'galdae', extra: 800 }              // 마을 통로 흉내(laneAt 없음)
      ] };
      var edgeX = DN.ROOM_W - DN.WALL;
      var near1 = D3._doorPrefetchTargets(run, { x: edgeX, y: 100 });    // 일반 문 결 안
      var near2 = D3._doorPrefetchTargets(run, { x: edgeX, y: 300 });    // 계단문 결 안
      var far = D3._doorPrefetchTargets(run, { x: edgeX, y: 700 });      // 둘 다에서 한참 밖
      var townRun = { floor: 3, roomIdx: 2, corridors: [run.corridors[2]] };
      var townLike = D3._doorPrefetchTargets(townRun, { x: edgeX, y: 0 });
      var ok1 = near1.length === 1 && near1[0].floor === 3 && near1[0].roomIdx === 3;
      var ok2 = near2.length === 1 && near2[0].floor === 4 && near2[0].roomIdx === 0;
      return ok1 && ok2 && far.length === 0 && townLike.length === 0 &&
        ('일반 문→' + near1[0].floor + ':' + near1[0].roomIdx + ' · 계단문→' + near2[0].floor + ':' + near2[0].roomIdx +
         ' · 결 밖=' + far.length + ' · 마을 통로(laneAt 없음)=' + townLike.length);
    });

    t('던전 문을 지나면 도착할 (floor,roomIdx)를 RNG 없이 미리 안다(PLAN §28-4 Phase 4)', function () {
      /* 이 자리(맨 끝 쪽)에 두는 이유는 위 §28-4 Phase 2 항목과 같다 —
         DN.enter()·descend()가 공유 RNG 수열을 소비하고, 뒤엔 씨앗 고정·
         런타임 에러 항목뿐이라 정확한 수열 값을 안 따진다. */
      var keepParty = C.save.party.slice();
      if (!C.save.party.length) { C.save.party = [D.heroes[0].id]; }

      if (DN.active()) { DN.leave(); }
      DN.enter({ floor: 1 });
      var run = DN.raw();
      run.room.cleared = true;
      var normalDoor = run.room.doors.filter(function (dr) { return dr.kind !== 'stair'; })[0];
      var predNormal = D3._nextRoomFor(run, normalDoor);
      DN.goRoom(normalDoor.kind);
      var afterNormal = DN.raw();
      var normalOk = predNormal.floor === afterNormal.floor && predNormal.roomIdx === afterNormal.roomIdx;

      if (DN.active()) { DN.leave(); }
      DN.enter({ floor: 1 });
      var run2 = DN.raw();
      run2.room.cleared = true;
      var predStair = D3._nextRoomFor(run2, { kind: 'stair' });
      DN.goRoom('stair');
      var afterStair = DN.raw();
      var stairOk = predStair.floor === afterStair.floor && predStair.roomIdx === afterStair.roomIdx;

      if (DN.active()) { DN.leave(); }
      C.save.party = keepParty;
      return normalOk && stairOk &&
        ('보통 문 예측 ' + predNormal.floor + ':' + predNormal.roomIdx + '=실제 · 계단 예측 ' +
         predStair.floor + ':' + predStair.roomIdx + '=실제(' + afterStair.floor + ':' + afterStair.roomIdx + ')');
    });

    /* ── 위성↔위성 통로 — 갈대나루↔자작재(Phase 1) + 갈대나루↔소금벌(후속),
     * 2026-09-06 ── 모루골을 안 거치고 옆 사분면으로 바로 가는 지름길 둘.
     * 설계안이 예상한 대로 `exits` 데이터만 추가해서 끝났는지(corridorsFor·
     * corridorNameAt·prefetch를 코드 한 줄도 안 고쳤는지)를 이 네 항목으로
     * 본다(쌍마다 왕복 대칭 + 테마 재사용, 총 둘). */
    function checkSatellitePair(a, b, aDir, bDir) {
      var T = DG.town;
      var aExits = T.exitsOf(a), bExits = T.exitsOf(b);
      var aToB = aExits.filter(function (e) { return e.to === b; })[0];
      var bToA = bExits.filter(function (e) { return e.to === a; })[0];
      var aDirs = aExits.map(function (e) { return e.dir; });
      var bDirs = bExits.map(function (e) { return e.dir; });
      var aUniq = aDirs.filter(function (d, i) { return aDirs.indexOf(d) === i; });
      var bUniq = bDirs.filter(function (d, i) { return bDirs.indexOf(d) === i; });
      var dirOk = !!aToB && !!bToA && aToB.dir === aDir && bToA.dir === bDir;
      var lenOk = !!aToB && !!bToA && aToB.len === bToA.len;
      var noCollide = aDirs.length === aUniq.length && bDirs.length === bUniq.length;

      var id = M.ids[0], u = [IL.url(id, 'fire'), IL.url(id, 'worry'), IL.url(id, 'shock'), IL.url(id)].map(function (x) { return String(x).split('/').pop(); }).join(',');

    });
    t('W-0380 「오늘」 창 — 어댑터 model 이 규격(today·week 배열, 줄마다 label·max>0) · 오늘+이번 주 줄이 하나 이상(없으면 note) · render 에 줄마다 data-gp-row·진행 n/m 또는 ✔', function () {

      var ok = Array.isArray(m.today) && Array.isArray(m.week) && rows.every(function (r) { return r.label && r.max > 0; }) && (rows.length > 0 || !!m.note);

      return ok && drew && P.left(3700) === '1시간 1분' && ('오늘 ' + m.today.length + ' · 이번 주 ' + m.week.length + (m.claim ? ' · 보상 ' + m.claim.state : '')) || '실패 ' + ok + ',' + drew + ' ' + JSON.stringify(m).slice(0, 200);
    });
    t('W-0402 컷아웃 — 기본 켬 · 그림 묶음 있는 풀만 컷아웃(없는 풀은 옛 시트) · 그림 발 y = 0·머리 끝 = 몸 높이(시트와 같은 척도, 무기 뺌)', function () {
      var K = DG.cutout2d; if (!K || !K.bounds) { return '실패 cutout2d.bounds 없음'; }
      var on = +DG.core.tuned('cutout2d.on', 1) === 1, idx = null, bad = [], seen = [];
      function get(u) { try { var x = new XMLHttpRequest(); x.open('GET', u, false); x.send(); return x.status === 200 ? JSON.parse(x.responseText) : null; } catch (e) { return null; } }
      idx = get(K.base() + 'index.json');   // 시험 서버(gameserve)는 공용 그림 폴더를 안 준다 — 못 받으면 대역 그림으로 같은 규칙을 잰다
      var rigs = idx && idx.pools ? Object.keys(idx.pools).map(function (p) { return [p, get(K.base() + idx.pools[p] + '/rig.json')]; }) : [['_stub', K.stubRig('a')], ['_stub2', K.stubRig('b')]];
      rigs.forEach(function (pr) { if (!pr[1]) { bad.push(pr[0] + ' 못 받음'); return; } var b = K.bounds(pr[1]); seen.push(pr[0] + ' ' + Math.round(b.top) + '/' + Math.round(b.foot)); if (Math.abs(b.foot) > 2 || Math.abs(b.top + b.h) > 6) { bad.push(pr[0]); } });
      var none = K.drawFor({}, { pool: '__그림없는풀', x: 0, y: 0 }, 60) === false;
      var h1 = K.holdClip('__t', 'attack', 300, 1000), h2 = K.holdClip('__t', 'idle', 0, 1100), h3 = K.holdClip('__t', 'walk', 0, 1300), hold = h1.clip === 'attack' && h2.clip === 'attack' && h2.t > 1e6 && h3.clip === 'walk';   // ③ 공격 끝 0.14초 멈춤
      return (on && seen.length >= 2 && !bad.length && none && hold) ? ((idx ? 'K 그림 ' : '대역(시험 서버) ') + seen.join(', ') + ' · 없는 풀 = 시트 · 공격 끝 멈춤') : ('실패 켬 ' + on + ' · ' + seen.join(', ') + ' · 어긋남 ' + bad.join(',') + ' · 없는 풀 시트 ' + none + ' · 멈춤 ' + hold);
    });
    t('W-0442 발소리·탈것 소리 — 디딤 사이(1/sps)가 차면 한 번 · 땅 갈래(grass_meadow → 풀) · 탄 동안 말발굽(돌·나무 = hard) · 날면 날갯짓(용 = heavy) · 멈추면 없음 · 끔', function () {
      var SS = DG.stepsSfx, C = DG.core; if (!SS) { return '실패 DG.stepsSfx 없음'; }
      SS._reset();
      var a = SS.tick('t', 0.3, { moving: true, sps: 2, surface: 'grass_meadow' }), b = SS.tick('t', 0.3, { moving: true, sps: 2, surface: 'grass_meadow' });
      var hoof = SS.tick('h', 1, { moving: true, sps: 2, surface: 'road', mount: 'ground' }), soft = SS.tick('h2', 1, { moving: true, sps: 2, surface: 'sand', mount: 'ground' });
      var wing = SS.tick('w', 1, { moving: false, flying: true, mount: 'fly' }), heavy = SS.tick('w2', 1, { flying: true, mount: 'flyHeavy' }), still = SS.tick('s', 5, { moving: false });

      SS._reset(); return ok ? [b, hoof, soft, wing, heavy].join(' · ') : ('실패 ' + JSON.stringify([a, b, hoof, soft, wing, heavy, still, off, SS.count()]));

    t('런타임 에러 없음', function () {
