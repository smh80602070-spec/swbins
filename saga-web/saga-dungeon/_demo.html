<!--
  스크린샷용 데모 상태 — "한동안 내려가 본 뒤" 를 재현한다. 게임 코드는 건드리지 않는다.

  장면(해시)
    #camp  본영(난도 고르기)   #dg    던전 안(정예가 섞여 나온다)
    #craft 세공(보석·부문)      #word  부문어가 이루어진 장비
    #loot  바닥에 떨어진 것(등급색 이름표)
    #fx    전투 연출 아홉 가지(3D · 정지 화면)
    #gear3d 몬스터 장구(투구·왕관·망토) 여덟 결(3D · 정지 화면, 밝게·넓게)
    #me3d  플레이어 본인 장비→겉모습(갑주 tier)·외모 커스텀(스타일·색) 확인
           (3D · 정지 화면) — 접미사: -plate(판금+투구+월도) · -style(스타일3+청색)
    #vendor 행상(사다)   #gamble 투전   #buyback 되사기   #forge 연단   #skill 무예
    #gear  장비                 #party 부대   #dex 도감   #log 기록
    #world 월드맵                #quest 퀘스트

  던전 장면은 **update 를 직접 굴린다** — 헤드리스에서는 rAF 가 거의 돌지 않아
  게임 루프에 기댈 수 없다(SAGA-HANDOFF 의 함정표 참고).

  이 파일은 index.html 과 **같은 스크립트 목록**을 써야 한다. 하나가 어긋나면
  화면이 통째로 죽는다 (사가만리에서 실제로 그렇게 오래 죽어 있었다).
-->

/* 가입 화면을 건너뛴다 — 데모는 진단과 같은 고정 키(…/save/test)로 켠다 */
window.DG_NO_ACCOUNT = true;
/* 2026-09-05 — CDP(devtools 프로토콜) 스크린샷이 던전 3D 화면만 새까맣게
   찍히던 자리. `dungeon3d.js`가 이미 `DG_3D_PRESERVE`로 이 스위치를 마련해
   뒀었다(WebGL의 preserveDrawingBuffer) — 켜지 않으면 렌더러가 매 프레임
   그린 뒤 버퍼를 비우는데, 헤드리스 컴포지터가 rAF에 안 맞춰 드물게만
   프레임을 굳혀서 CDP가 그 사이 빈 버퍼를 찍었다(실제 플레이·PC 스크린샷은
   영향 없다 — 정상 프레임 속도에서 컴포지터가 항상 최신 그림을 든다).
   데모(진단용)에서만 켠다 — 실제 게임은 약간의 GPU 비용을 아낄 이유가 있다. */
window.DG_3D_PRESERVE = true;
</script>

<script>
/* 세이브 보호 — 루프가 주기적으로 persist() 한다. 데모 상태로 덮이지 않게 막는다. */
DG.core.persist = function () {};

window.addEventListener('error', function (e) {
  var msg = e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno;
  document.title = 'DEMO ERROR: ' + msg;
  var box = document.getElementById('demo-err');
  if (!box) {
    box = document.createElement('div');
    box.id = 'demo-err';
    box.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:9999;padding:8px 10px;' +
      'background:#5b1414;color:#ffd9d9;border:1px solid #ff8f8f;border-radius:10px;' +
      'font:600 12px ui-monospace,Consolas,monospace;white-space:pre-wrap';
    document.body.appendChild(box);
  }
  box.textContent = '⚠️ ' + msg;
});
</script>
<script>
setTimeout(function () {
  var C = DG.core, IT = DG.item, DN = DG.dungeon;

  var party = ['kr_yisunsin', 'sg_zhaoyun', 'kr_ganggamchan', 'sg_zhangliao'];
  party.forEach(function (id, i) {
    C.save.dex.heroes[id] = { count: i === 0 ? 3 : 1, firstAt: Date.now() };
  });
  C.save.party = party.slice();
  C.save.heroes = {
    kr_yisunsin: { lv: 18, exp: 10, rank: 2 },
    sg_zhaoyun: { lv: 14, exp: 4, rank: 1 },
    kr_ganggamchan: { lv: 12, exp: 8, rank: 1 },
    sg_zhangliao: { lv: 10, exp: 2, rank: 0 }
  };
  C.save.player.level = 16;
  C.save.player.gold = 9400;
  C.save.player.featTotal = 2100;
  C.save.dungeon = { best: 24, runs: 31, kills: 1840, clears: 22, deaths: 5, mode: 'hard' };

  /* 장비 몇 점 — 구멍이 뚫린 것으로 */
  C.save.gear = { seq: 1, bag: [], equip: {}, mats: { gem: {}, rune: {} } };
  /* 입고 있는 것은 **확인된 채**로 만든다 — 미확인은 입을 수 없다(원작 규칙).
     데모가 이걸 놓쳐서 종이인형이 통째로 비어 보인 적이 있다. */
  var sword = IT.roll(22, { slot: 'weapon', tier: 4, sock: 3, unid: false });
  var armor = IT.roll(20, { slot: 'armor', tier: 3, sock: 2, unid: false });
  var charm = IT.roll(18, { slot: 'charm', tier: 2, sock: 1, unid: false });
  [sword, armor, charm].forEach(function (g) { IT.add(g); });
  IT.equip('kr_yisunsin', sword.uid);
  IT.equip('sg_zhaoyun', armor.uid);

  /* 미확인 몇 점 + 감정서 — 감정 줄이 어떻게 보이는지 남게 */
  IT.add(IT.roll(21, { slot: 'weapon', tier: 3 }));
  IT.add(IT.roll(19, { slot: 'armor', tier: 2 }));
  IT.addScroll(4);

  /* 요대 — 원작의 벨트. 네 칸이 어떻게 보이는지 스크린샷에 남게 채워 둔다 */
  DG.potion.add('heal', 1); DG.potion.add('heal', 1); DG.potion.add('heal', 1);
  DG.potion.add('heal', 0); DG.potion.add('mana', 1);
  DG.potion.add('mana', 2);

  /* 세공 재료 */
  IT.addMat('gem', 'jade', 2, 3);
  IT.addMat('gem', 'agate', 4, 1);
  IT.addMat('gem', 'amber', 1, 2);
  ['cheon', 'ji', 'in', 'mu', 'mun', 'ui'].forEach(function (k) { IT.addMat('rune', k, 0, 1); });
  /* 주옥 둘 — 굴러 나오는 물건이라 데모에서는 **값을 박아 둔다**(장면이 매번 달라지면
     스크린샷을 견줄 수 없다) */
  IT.addJewel({ aff: [{ k: 'j_fire', v: 11 }, { k: 'j_crit', v: 4 }] });
  IT.addJewel({ aff: [{ k: 'j_rcold', v: 8 }] });

  C.save.log = [];
  C.log('🔨 환도 에 완(完) 마노 을(를) 박았다', 'info');
  C.log('👤 그림자가 갈라졌다', 'info');
  C.log('💼 노획물 확정 (탈출) · 금 4,210 · 장비 3점', 'good');
  C.log('🕳️ 던전 진입 · 제12층 (한중 굴혈) · 험(險)', 'info');

  var hash = location.hash.replace('#', '');
  var tab = hash.split('-')[0];

  if (tab === 'word') {
    /* 부문어가 이루어진 장비를 하나 만들어 둔다 */
    IT.socket(armor.uid, 'rune', 'cheon');
    IT.socket(armor.uid, 'rune', 'ji');
    IT.addMat('rune', 'in', 0, 1);
    var third = IT.roll(20, { slot: 'armor', tier: 4, sock: 3 });
    IT.add(third);
    ['cheon', 'ji', 'in'].forEach(function (k) { IT.addMat('rune', k, 0, 1); });
    IT.socket(third.uid, 'rune', 'cheon');
    IT.socket(third.uid, 'rune', 'ji');
    IT.socket(third.uid, 'rune', 'in');
    DG.ui.openSheet('craft');
  }
  else if (tab === 'dg') {
    /* 던전 안 — 자동에게 맡기고 update 를 직접 굴린다 */
    DN.enter({ floor: 14, mode: 'hard' });
    DG.auto.setOn(true);
    setInterval(function () {
      if (!DN.active()) { DN.enter({ floor: 14, mode: 'hard' }); }
      DG.auto.update(0.05);
      DN.update(0.05);
      DG.dungeonView.update(0.05);
      DG.dungeonView.draw();
    }, 40);
  }
  else if (tab === 'loot') {
    /* 바닥에 떨어진 것 — 원작에서 물건은 **이름으로** 바닥에 놓이고,
       등급색만 보고 주울지 말지를 정한다. 다섯 등급을 한 화면에 늘어놓는다. */
    DN.enter({ floor: 18, mode: 'hard' });
    var run = DN.raw();
    run.room.enemies.length = 0;
    run.room.cleared = true;
    run.player.x = 150; run.player.y = 180;
    var slots = ['weapon', 'armor', 'charm', 'weapon', 'armor'];
    for (var t = 0; t < 5; t++) {
      var g = IT.roll(24, { slot: slots[t], tier: t, sock: t >= 3 ? 2 : 0 });
      run.room.drops.push({ kind: 'item', item: g, x: 210 + t * 62, y: 120 + (t % 2) * 92 });
    }
    run.room.drops.push({ kind: 'gold', gold: 640, x: 180, y: 250 });
    run.room.drops.push({ kind: 'mat', mat: { kind: 'gem', key: 'jade', g: 3 }, x: 150, y: 96 });
    run.room.drops.push({ kind: 'mat', mat: { kind: 'rune', key: 'cheon' }, x: 262, y: 262 });
    setInterval(function () {
      DN.update(0.05);
      DG.dungeonView.update(0.05);
      DG.dungeonView.draw();
    }, 40);
  }
  else if (tab === 'fx') {
    /* 전투 연출 (3단계) — 아홉 가지를 한 화면에 늘어놓는다.
       자동 전투로 보면 한 순간이라 눈에 안 잡히고 스크린샷을 견줄 수도 없다.
       그래서 **매 틱 같은 자리로 되돌린다** — 게임 루프는 계속 돌지만
       수명·좌표·체력을 다시 박으니 화면은 멈춰 있다.
       (가만히 서 있으면 적에게 맞아 죽는다. 처음엔 그래서 본영으로 튕겼다)
       적은 **하나만** 남긴다 — 여럿이면 숫자와 겹쳐 무엇이 무엇인지 안 보인다. */
    DN.enter({ floor: 14, mode: 'hard' });

    function fxStage() {
      if (!DN.active()) { DN.enter({ floor: 14, mode: 'hard' }); }
      var runf = DN.raw(), qf;
      runf.hp = runf.hpMax;
      runf.player.x = 150; runf.player.y = 190;
      runf.player.hurt = 0.14;              // 피격 기운이 화면에 어떻게 도는지 남게
      runf.player.invuln = 999;             // 정지 화면이니 맞아 죽지 않게 둔다

      var ef = runf.room.enemies;
      if (ef.length > 1) { ef.length = 1; }
      if (ef[0]) {
        ef[0].x = 300; ef[0].y = 120;
        ef[0].hp = Math.max(1, ef[0].hp);
        /* **맞은 직후**로 둔다 — 번쩍임을 정지 화면에서 보려면 이 길뿐이다 */
        ef[0].hurt = 0.2;
      }

      var fxa = DN.fx();
      fxa.length = 0;
      /* 숫자 — 여느 값 · 회심 · 저항에 깎인 것 · 내가 맞은 것 · 원소 · 독 · 획득 */
      fxa.push({ t: 'hit', x: 240, y: 252, v: 138, life: 0.5 });
      fxa.push({ t: 'hit', x: 300, y: 118, v: 902, crit: true, life: 0.55 });
      fxa.push({ t: 'hit', x: 436, y: 300, v: 12, resist: true, life: 0.5 });
      fxa.push({ t: 'hit', x: 150, y: 190, v: 46, foe: true, life: 0.62 });
      fxa.push({ t: 'elem', x: 364, y: 208, v: 33, el: 'fire', color: '#e06565', life: 0.5 });
      fxa.push({ t: 'elem', x: 452, y: 148, v: 7, el: 'poi', color: '#8ec06a', dot: true, life: 0.5 });
      fxa.push({ t: 'get', x: 196, y: 300, text: '+4,210', color: '#f0c45a', life: 0.9 });
      /* 칼궤적 · 격파 고리 · 파편 · 회전참 · 파문 · 돌진 잔상 */
      fxa.push({ t: 'slash', x: 300, y: 132, a: 0.6, life: 0.10 });
      fxa.push({ t: 'slash', x: 248, y: 238, a: -1.1, crit: true, life: 0.13 });
      fxa.push({ t: 'pop', x: 432, y: 88, life: 0.14 });
      fxa.push({ t: 'burst', x: 432, y: 88, color: '#c9a83a', seed: 1.2, life: 0.3 });
      fxa.push({ t: 'pop', x: 486, y: 258, boss: true, life: 0.12 });
      fxa.push({ t: 'whirl', x: 150, y: 190, r: 96, life: 0.26 });
      fxa.push({ t: 'ring', x: 372, y: 322, life: 0.3 });
      for (qf = 0; qf < 4; qf++) {
        fxa.push({ t: 'trail', x: 96 + qf * 17, y: 190, life: 0.2 - qf * 0.04 });
      }
      /* 화면 흔들림은 **미리 겪은 것으로 표시해 둔다** — 안 그러면 매 틱 다시 흔들려
         스크린샷을 견줄 수 없다 */
      for (qf = 0; qf < fxa.length; qf++) { fxa[qf].shake3d = 1; }

      /* 기공파 셋 — 색은 판정이 들려 준다(무예의 결마다 다르다) */
      runf.shots.length = 0;
      runf.shots.push({ x: 246, y: 160, dx: 1, dy: 0, el: 'fire', color: '#e06565', life: 1, hit: {} });
      runf.shots.push({ x: 300, y: 296, dx: 0.8, dy: 0.6, el: 'cold', color: '#7fb8e0', life: 1, hit: {} });
      runf.shots.push({ x: 404, y: 240, dx: 0.8, dy: -0.6, el: 'lit', color: '#e0d070', life: 1, hit: {} });

      DG.dungeonView.draw();

      /* 3D 가 실제로 섰는지 · 풀이 몇 칸 쓰였는지를 화면에 적어 둔다 —
         WebGL 이 없는 자리에서는 이 줄만 보고도 왜 안 보이는지 알 수 있다 */
      var sb = document.getElementById('fx-stat');
      if (!sb) {
        sb = document.createElement('div');
        sb.id = 'fx-stat';
        sb.style.cssText = 'position:fixed;left:6px;bottom:6px;z-index:9999;max-width:70vw;' +
          'padding:4px 7px;background:#000b;color:#cfe;border-radius:6px;' +
          'font:600 10px ui-monospace,Consolas,monospace;white-space:pre-wrap';
        document.body.appendChild(sb);
      }
      var s3 = DG.dungeon3d.stats(), sf = DG.fx3d.stats();
      sb.textContent = '3D ' + (s3.none ? 'off(failed=' + s3.failed + ')' : 'on mesh=' + s3.drawn) +
        ' · fx ready=' + sf.ready + ' drawn=' + sf.drawn +
        (sf.num ? ' num=' + sf.num.used + '/' + sf.num.cap +
          ' ring=' + sf.ring.used + ' slash=' + sf.slash.used +
          ' burst=' + sf.burst.used + ' trail=' + sf.trail.used +
          ' text=' + sf.text.used : '');
    }

    setInterval(fxStage, 60);
    fxStage();
  }
  else if (tab === 'gear3d') {
    /* 몬스터 장구(투구·왕관·망토) 한눈에 — 헤드리스 스크린샷 확인용으로 새로 만든
       자리(2026-09-05). #dg(실전투)는 어두운 데다 자동전투가 카메라를 끌고 다녀
       장구가 눈에 들어올 즈음엔 이미 암흑이고, #fx는 "방금 맞은 직후"를 일부러
       만드는 자리라 피격 번쩍임(흰색)이 갑옷·투구 색을 덮어 버린다 — 둘 다
       장구 확인용으로는 못 쓴다는 게 실제로 겪어 확인한 것이다.
       그래서 밝게·넓게 당겨 잡은 화면 하나에 장구 결 여덟 가지를 나란히 세운다
       (`_styles.html`이 인물 여럿을 나란히 굽는 것과 같은 생각). DN.update()는
       부르지 않는다 — 적 AI가 움직이거나 플레이어를 때리면 다음 틱에 흐트러진다
       (#fx가 이미 쓰던 요령). */
    DN.enter({ floor: 14, mode: 'hard' });
    var rung = DN.raw();
    DG.dungeon3d.set('dg3d.dark', 0.02);   // 실전 어둡기와는 별개 손잡이 — 뜯어보기 좋게 밝힌다
    /* zoom 을 세게 키우면 카메라가 안개(fog.far ≈ 1400 안팎)를 넘어서 버려
       화면이 통째로 새까매진다(실제로 겪었다 — 2.0에서 그랬다). 살짝만 물러난다 */
    DG.dungeon3d.set('dg3d.zoom', 1.25);

    var baseRef = (rung.room.enemies[0] && rung.room.enemies[0].ref) || { name: '적', color: '#8a6a4a', kind: 'human' };
    var GEAR_GALLERY = [
      { label: '투구 없음', look: { weapon: 'sword', helm: 'none', armor: 'plate' } },
      { label: '투구(helmet)', look: { weapon: 'spear', helm: 'helmet', armor: 'plate' } },
      { label: '원뿔(gapju→바이킹)', look: { weapon: 'sword', helm: 'gapju', armor: 'plate' } },
      { label: '왕관(crown)', look: { weapon: 'sword', helm: 'crown', armor: 'plate' } },
      { label: '깃털(plume)', look: { weapon: 'halberd', helm: 'plume', armor: 'plate' } },
      { label: '망토(cape)', look: { weapon: 'spear', helm: 'helmet', armor: 'plate', cape: true } },
      { label: '왕관+망토', look: { weapon: 'sword', helm: 'crown', armor: 'plate', cape: true } },
      { label: '수염(beard, 도형)', look: { weapon: 'axe', helm: 'none', armor: 'leather', beard: true } }
    ];
    rung.room.enemies = GEAR_GALLERY.map(function (g, i) {
      var ref = {};
      for (var k in baseRef) { if (baseRef.hasOwnProperty(k)) { ref[k] = baseRef[k]; } }
      ref.name = 'QA ' + g.label;
      ref.look = g.look;
      return {
        x: 153 + i * 42, y: 190, r: 14, hp: 999, hpMax: 999, boss: false,
        elite: null, shade: false, dmg: 0, cd: 999, phase: 0, hurt: 0, ref: ref
      };
    });
    rung.player.x = 300; rung.player.y = 300;
    rung.player.invuln = 999;
    rung.hp = rung.hpMax;

    setInterval(function () {
      /* 매 틱 되돌린다 — dungeonView.update() 가 건드릴 수 있는 카메라·연출
         상태 말고는 아무것도 못 바꾸게 한다(#fx와 같은 요령) */
      rung.player.x = 300; rung.player.y = 300; rung.player.invuln = 999;
      rung.hp = rung.hpMax;
      rung.room.enemies.forEach(function (e, i) {
        e.hurt = 0; e.hp = e.hpMax; e.x = 153 + i * 42; e.y = 190;
      });
      DG.dungeonView.update(0.05);
      DG.dungeonView.draw();

      var sb = document.getElementById('fx-stat');
      if (!sb) {
        sb = document.createElement('div');
        sb.id = 'fx-stat';
        sb.style.cssText = 'position:fixed;left:6px;bottom:6px;z-index:9999;max-width:90vw;' +
          'padding:4px 7px;background:#000b;color:#cfe;border-radius:6px;' +
          'font:600 10px ui-monospace,Consolas,monospace;white-space:pre-wrap';
        document.body.appendChild(sb);
      }
      var s3 = DG.dungeon3d.stats();
      sb.textContent = '3D ' + (s3.none ? 'off(failed=' + s3.failed + ')' : 'on mesh=' + s3.drawn) +
        ' · gear3d 여덟 자리(왼쪽부터: ' + GEAR_GALLERY.map(function (g) { return g.label; }).join(' · ') + ')';
    }, 40);
  }
  else if (tab === 'me3d') {
    /* 플레이어 본인 장비→겉모습·외모 커스텀 확인(2026-09-06, PLAN §28-8 후속).
       #gear3d 는 몬스터 ref.look 을 직접 조작해 흉내 낸 것이지만, 여기서는
       **진짜 IT.equip() 경로**로 party[0]에게 실제 장비를 입혀
       dungeon3d.js의 meLookOf()/foeGear()가 실전과 똑같이 그리는지 본다.
       -plate: 판금 갑주+투구+월도(guandao) · -style: 외모 스타일3+청색 tint
       (기본 #me3d 는 가죽 갑주+투구+환도, 스타일0=옛 모습 그대로) */
    var variant = hash.split('-')[1] || '';
    var leadId = C.save.party[0];
    var wKey = variant === 'plate' ? 'w_wolto' : 'w_hwando';
    var aKey = variant === 'plate' ? 'a_chalgap' : 'a_pigap';
    var mw = IT.roll(20, { base: wKey, tier: 2, unid: false });
    var ma = IT.roll(20, { base: aKey, tier: 2, unid: false });
    var mh = IT.roll(20, { base: 'h_tumo', tier: 2, unid: false });
    IT.add(mw); IT.add(ma); IT.add(mh);
    IT.equip(leadId, mw.uid); IT.equip(leadId, ma.uid); IT.equip(leadId, mh.uid);
    if (variant === 'style') { C.save.appearance = { styleSeed: 3, tint: '#4f8fc9' }; }

    DN.enter({ floor: 14, mode: 'hard' });
    var rung3 = DN.raw();
    rung3.room.enemies.length = 0;
    rung3.player.x = 300; rung3.player.y = 300; rung3.player.invuln = 999;
    rung3.hp = rung3.hpMax;
    DG.dungeon3d.set('dg3d.dark', 0.02);
    DG.dungeon3d.set('dg3d.zoom', 0.75);   // 가까이 당겨 몸에 걸친 것을 크게 본다

    setInterval(function () {
      rung3.player.x = 300; rung3.player.y = 300; rung3.player.invuln = 999;
      rung3.hp = rung3.hpMax;
      DG.dungeonView.update(0.05);
      DG.dungeonView.draw();

      var sb2 = document.getElementById('fx-stat');
      if (!sb2) {
        sb2 = document.createElement('div');
        sb2.id = 'fx-stat';
        sb2.style.cssText = 'position:fixed;left:6px;bottom:6px;z-index:9999;max-width:90vw;' +
          'padding:4px 7px;background:#000b;color:#cfe;border-radius:6px;' +
          'font:600 10px ui-monospace,Consolas,monospace;white-space:pre-wrap';
        document.body.appendChild(sb2);
      }
      var s4 = DG.dungeon3d.stats();
      sb2.textContent = '3D ' + (s4.none ? 'off(failed=' + s4.failed + ')' : 'on mesh=' + s4.drawn) +
        ' · me3d[' + (variant || 'default') + '] look=' + JSON.stringify(DG.dungeon3d._meLookOf(leadId)) +
        ' appearance=' + JSON.stringify(C.save.appearance);
    }, 40);
  }
  else if (tab === 'forge') {
    /* 연단 — 넷이 다 뜨게 재료를 깔아 둔다 (보석 셋 · 부문 셋 · 장비 셋 · 완 보석 둘) */
    IT.addMat('gem', 'jade', 0, 3);
    IT.addMat('rune', 'cheon', 0, 3);
    IT.addMat('gem', 'agate', 4, 2);
    ['weapon', 'weapon', 'weapon'].forEach(function (sl) {
      IT.add(IT.roll(16, { slot: sl, tier: 1 }));
    });
    IT.add(IT.roll(22, { slot: 'armor', tier: 3, sock: 2 }));
    DG.ui.openSheet('craft');
    document.querySelector('[data-act="craft-tab"][data-tab="forge"]').click();
  }
  else if (tab === 'vendor' || tab === 'gamble' || tab === 'buyback') {
    /* 행상 — 재고를 채우고 탭을 골라 둔다 */
    DG.vendor.refresh();
    if (tab === 'buyback') {
      var spare = IT.roll(18, { slot: 'charm', tier: 1 });
      IT.add(spare);
      DG.vendor.sell(spare.uid);
    }
    DG.ui.openSheet('vendor');
    var want = tab === 'gamble' ? 'gamble' : (tab === 'buyback' ? 'back' : 'buy');
    document.querySelector('[data-act="vendor-tab"][data-tab="' + want + '"]').click();
  }
  else if (tab === 'skill') {
    /* 무예 — 점수를 몇 점 주고 나무가 어떻게 보이는지 남게 */
    DG.skill.ensureStarter(C.save.party[0]);
    DG.ui.openSheet('skill');
  }
  else if (['party', 'gear', 'craft', 'dex', 'log', 'world', 'quest'].indexOf(tab) >= 0) {
    DG.ui.openSheet(tab);
  }

  C.emit('changed');
  document.getElementById('sheet').style.transition = 'none';
  document.getElementById('dock').style.transition = 'none';
}, 350);
</script>
</body></html>
