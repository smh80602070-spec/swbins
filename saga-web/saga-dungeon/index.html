try{if(location.protocol!=='file:'&&/\/index\.html$/.test(location.pathname))history.replaceState(null,'',location.pathname.replace(/index\.html$/,'')+location.search+location.hash);}catch(e){}</script>

<!-- 본영(本營) 배경 — 지도가 없는 게임이라 캔버스 대신 CSS 로 깐다 -->
<div id="camp-bg"></div>
<div id="vignette"></div>

<!-- 상단: 프로필 · 재화 · 도구 -->
<div id="top">
  <div class="glass profile" id="profile"></div>
  <div class="tools">
    <button class="icon-btn" id="btn-auto" title="자동 순회 (AI가 대신 던전을 돈다)"><span data-icon="bot">🤖</span></button>
    <div class="tools-drawer" id="tools-drawer">
      <button class="icon-btn" id="btn-3d" title="3D 화면 ↔ 2D 화면 (2D 는 그림 그대로)">🧊</button>
      <button class="icon-btn" id="btn-sound" title="소리 (끄기/켜기)">🔊</button>
      <button class="icon-btn" id="btn-help" title="도움말"><span data-icon="circle-question-mark">❔</span></button>
      <a class="icon-btn" id="btn-admin" href="_admin.html" target="_blank" rel="noopener" title="어드민 (QA · 손잡이)"><span data-icon="wrench">🛠️</span></a>
      <button class="icon-btn" id="btn-reset" title="처음부터"><span data-icon="rotate-ccw">↺</span></button>
    </div>
    <button class="icon-btn" id="btn-more" title="도구 더 보기" aria-expanded="false"><span data-icon="ellipsis">⋯</span></button>
  </div>
  <div class="glass wallet" id="wallet"></div>
  <!-- 목표판(§5.6): 지금 · 이번 세션 · 이번 주 세 줄. #top 그리드의 한 줄로 낀다
       (따로 fixed 좌표를 안 잡아도 지갑 높이가 늘어나면 같이 밀린다). -->
  <div class="glass" id="goals"></div>
</div>

<!-- 자동 순회 상태 -->
<div id="autobar"></div>

<!-- 마을 3D 자산(GLB) 로딩 표시 — 모바일 LTE 에서 집·사람 모델이 다 실리기 전엔
     플레이스홀더 도형만 서 있어 "화면이 깨졌다"로 보였다(실기기 신고) -->
<div id="loadbar"></div>

<!-- 가운데: 본영/마을 — 기본은 필드를 도는 화면이고, 던전(굴혈)은 걸어 들어가야 하는 이벤트 던전이다 -->
<div id="camp"></div>

<!-- 우하단: 액션 독 — 2026-09-11, "하단 메뉴가 화면을 가려" 재신고로 붙박이 셋
     (부대·장비·지도)까지 마저 접었다. 이제 화면에 늘 떠 있는 건 "더보기"
     버튼 하나뿐 — 열 셋 전부 그 뒤에서 기다린다. -->
<nav id="dock">
  <div id="dock-more">
    <button data-sheet="party"><span data-icon="swords">⚔️</span><small>부대</small></button>
    <button data-sheet="gear"><span data-icon="backpack">🎒</span><small>장비</small></button>
    <button data-sheet="world"><span data-icon="map">🗺️</span><small>지도</small></button>
    <button data-sheet="skill"><span data-icon="scroll-text">📜</span><small>무예</small></button>
    <button data-sheet="craft"><span data-icon="hammer">🔨</span><small>세공</small></button>
    <button data-sheet="vendor"><span data-icon="store">🧺</span><small>행상</small></button>
    <button data-sheet="dex"><span data-icon="book-open">📖</span><small>도감</small></button>
    <button data-sheet="quest"><span data-icon="flag">🚩</span><small>퀘스트</small></button>
    <button data-sheet="look"><span data-icon="user">🧑</span><small>외모</small></button>
    <button data-sheet="log"><span data-icon="scroll-text">📜</span><small>기록</small></button>
    <button data-sheet="overworld"><span data-icon="compass">🧭</span><small>오버월드</small></button>
    <button data-sheet="keys"><span data-icon="keyboard">⌨️</span><small>키설정</small></button>
    <button data-sheet="settings"><span data-icon="settings">⚙️</span><small>설정</small></button>
  </div>
  <button id="dock-more-btn"><span data-icon="ellipsis">⋯</span><small>더보기</small></button>
</nav>

<script>
/* 서비스 워커 — https · localhost 에서만 등록된다 (브라우저 규칙).
   파일을 늘리거나 고쳤으면 sw.js 의 VERSION 도 같이 올릴 것. */
(function () {
  if (!('serviceWorker' in navigator)) { return; }
  var h = location.hostname;
  var secure = location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1';
  if (!secure) { return; }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')['catch'](function (e) {
      console.warn('서비스 워커 등록 실패', e);
    });
  });
})();
</script>
